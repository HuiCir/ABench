name: Publish profile and agent images
on:
  push:
    tags:
      - 'images-*'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: abench-image-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 -m pip install pyyaml
      - run: python3 tools/images.py generate --check
      - name: Publish and collect immutable platform locks
        run: python3 tools/publish_images.py
      - uses: actions/upload-artifact@v4
        with:
          name: published-image-and-environment-locks
          path: |
            spec/env/images.lock.yaml
            spec/env/lock/*.json
