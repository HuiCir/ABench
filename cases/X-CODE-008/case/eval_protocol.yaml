case_id: X-CODE-008
version: v2026.07
cutoff: '2026-07-01'
hardware:
  reference: single 24GB GPU, posttrain_24gb sandbox
  software: benchmark manifest required; fixed container/CUDA/PyTorch/transformers versions
  timing: server-side wall clock, peak memory and subprocess limits; median over fixed seeds
proxy:
  types:
  - SURG
  - SUBSET
  - INFER
  plan: Fixed 125M–350M code checkpoint; signed offline Python repository bundle; visible tests for development, hidden API/defect-family tests for final evaluation; training ≤ 2 epochs or a fixed token cap
  fidelity_gate: track-level calibration must reproduce at least 5 known pairwise orderings with >=80% agreement
budget:
  agent_dev_gpu_h: 4
  per_submission_verify_gpu_h: 2
  reference_precompute_gpu_h: 25
  budget_tier: medium
  submissions: 1
ladder:
  L0_smoke:
    visibility: agent
    checks:
    - interface
    - finite outputs
    - deterministic replay under fixed seed
    - resource limits
    - no input mutation
    - patch parses and applies cleanly
  L1_proxy:
    visibility: agent
    settings: smallest documented repository subset and visible unit tests
  L2_main:
    visibility: benchmark
    settings: public repository tasks, fixed seeds, full visible regression suite
  L3_holdout:
    visibility: hidden
    settings: hidden repositories/tasks split by API and defect family, hidden regression tests, timeout and malformed-patch checks
inputs:
  public: resources.yaml
  private: benchmark-side signed repository/test/model manifests and hidden split
  required_hashes: true
outputs:
  required:
  - manifest.json
  - run.jsonl
  - artifacts.sha256
  - metrics.json
  - patches/
  forbidden:
  - simulated_scores
  - fabricated_reference_runs
  - undeclared_network_access
  - repository_write_outside_workdir
  - hidden_test_or_label_access
metrics:
  objective: pareto_frontier
  dimensions:
  - name: visible_patch_pass_rate
    direction: higher
    unit: fraction
    role: quality
  - name: hidden_patch_pass_rate
    direction: higher
    unit: fraction
    role: quality
  - name: regression_pass_rate
    direction: higher
    unit: fraction
    role: constraint
  - name: patch_reject_rate
    direction: lower
    unit: fraction
    role: constraint
  - name: train_gpu_hours
    direction: lower
    unit: GPU-h
    role: cost
  - name: peak_memory_gb
    direction: lower
    unit: GB
    role: cost
  - name: patch_latency_ms
    direction: lower
    unit: ms/patch
    role: cost
  - name: stable_pass_rate
    direction: higher
    unit: fraction
    role: stability
  dominance: quality and stability dimensions maximize; cost dimensions minimize; constraint dimensions must pass before dominance
  aggregation: report full non-dominated set and hypervolume against server reference envelope
special_blockers:
- offline_repo_bundle_and_test_manifest
- frozen_code_model_tokenizer_and_training_split
- hidden_patch_tests_and_regression_suite
- server_patch_sandbox_and_resource_measurement
activation: scaffold_only_until_real_reference_runs_and_hidden_eval_exist
resource_profile:
  sandbox_profile: posttrain_24gb
  hardware_class: single_gpu_24gb
  accelerator: RTX_4090_class
  accelerator_count: 1
  memory_gib: 24
  cost_unit: GPU-h
  leaderboard: budget
  limits:
    agent_dev: {value: 4, unit: GPU-h}
    per_submission_verify: {value: 2, unit: GPU-h}
    reference_precompute: {value: 25, unit: GPU-h}
  sandbox:
    network: disabled
    filesystem: output_only
    hidden_inputs: server_only
    measurement: server_side
objective_mode: pareto
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
