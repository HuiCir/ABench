version: v0-scaffold
case_id: X-CODE-008
objective: pareto_frontier
primary_metrics:
- name: visible_patch_pass_rate
  direction: higher
  unit: fraction
  role: quality
- name: hidden_patch_pass_rate
  direction: higher
  unit: fraction
  role: quality
- name: regression_pass_rate
  direction: higher
  unit: fraction
  role: constraint
- name: patch_reject_rate
  direction: lower
  unit: fraction
  role: constraint
- name: train_gpu_hours
  direction: lower
  unit: GPU-h
  role: cost
- name: peak_memory_gb
  direction: lower
  unit: GB
  role: cost
- name: patch_latency_ms
  direction: lower
  unit: ms/patch
  role: cost
- name: stable_pass_rate
  direction: higher
  unit: fraction
  role: stability
normalization:
  direction: per metric declaration
  baseline: server reference envelope
  aggregation: non-dominated set + normalized hypervolume; publish per-dimension values and test failure taxonomy
gates:
- valid_run_manifest
- resource_and_time_budget
- finite_metrics
- deterministic_replay
- no_hidden_input_or_network_access
- patch_applies_without_test_mutation
- regression_pass_rate_at_or_above_reference_floor
- no_unsafe_process_or_filesystem_access
pareto_policy:
  no_single_sota_gate: true
  constraint_fail: dominated_and_ineligible
  tie_break: higher hidden pass rate, then lower total measured cost, then lower variance
simulation_policy: 'none: this scaffold does not execute repositories or generate scores'
missing_real_artifacts: report pending rather than zeroing a fabricated score
deferred_due_to:
- offline_repo_bundle_and_test_manifest
- frozen_code_model_tokenizer_and_training_split
- hidden_patch_tests_and_regression_suite
- server_patch_sandbox_and_resource_measurement
objective_mode: pareto
resource_profile: posttrain_24gb
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
pareto:
  axes:
  - id: hidden_patch_pass_rate
    direction: maximize
    unit: fraction
    primary: true
  - id: regression_pass_rate
    direction: maximize
    unit: fraction
    primary: false
  - id: train_gpu_hours
    direction: minimize
    unit: GPU-h
    primary: false
  - id: peak_memory_gb
    direction: minimize
    unit: GB
    primary: false
  - id: patch_latency_ms
    direction: minimize
    unit: ms/patch
    primary: false
  - id: stable_pass_rate
    direction: maximize
    unit: fraction
    primary: false
  feasibility:
  - metric: hidden_patch_pass_rate
    op: '>='
    threshold: reference_quality_floor
  - metric: regression_pass_rate
    op: '>='
    threshold: reference_regression_floor
  aggregation: empirical_frontier
  report:
  - frontier_points
  - hypervolume
  - knee_point
  - dominated_by_reference
  - failure_taxonomy
