# ABench anchor card: case B-OPT-001
# Version: ABench v2026.07 (corpus cutoff 2026-07-01; papers published after the cutoff are never usable)

case_id: B-OPT-001
readiness: contract_only
title: An optimizer for small language-model pretraining
version: v2026.07
cutoff: "2026-07-01"           # hard cutoff for retrieval and citation

anchor:
  title: "Adam: A Method for Stochastic Optimization"
  authors: "Kingma, Ba"
  arxiv: '1412.6980'
  first_public: "2014-12-22"
  venue: "ICLR 2015"
  type: T3                     # optimizer and training method
  track: B                     # track B: optimizers
  age_band: mature             # mature tier

task_family: design            # design = retrieve → synthesize → design a new method (as opposed to calibration / discovery)
deliverable_kind: optimizer    # the submission is an optimizer update rule + design notes

neighborhood:
  retrieval: open              # open retrieval: the agent searches on its own, and any paper before the cutoff may be used
  seed_snapshot: paper_snapshot/seed_neighborhood.jsonl   # seed neighborhood frozen by the benchmark (for weight calibration and mechanism duplicate checks)
  hidden_snapshot: "Held by the benchmark operator and not given to the agent; used for nearest-neighbor retrieval in mechanism divergence"
  weight_rule: scoring_config.yaml#paper_weight             # venue tier × Google Scholar citations

references:                    # comparison basis for the SOTA margin: reproduced uniformly by the benchmark operator, tuned with the same budget
  pool: reference_pool.yaml
  envelope: "At each token budget take the lowest loss among all reference methods; together these form the 'reference envelope'"

budget:
  agent_dev_budget: "8 GPU-h (reference card), usable for L0 and μ1/μ2 self-tests"
  hardware: "Reference card: one 24GB GPU (RTX 4090 class), fixed driver and CUDA version (see eval_protocol.yaml)"
  verify_per_submission: "about 6 GPU-h"
  reference_precompute: "about 74 GPU-h"
  scale_policy: "No training at the paper's scale; at most about 42M effective parameters; larger scales appear only in the unscored outer review"
  wall_clock_limit: "24 h total agent interaction time"
  submissions: 1               # only one final submission is allowed

metrics:
  primary: "Validation cross-entropy at a fixed token budget → converted to an equivalent token speedup relative to the reference envelope"
  constraints:
    - "Optimizer-state memory ≤ 3 × parameter count (in fp32)"
    - "Wall-clock time per step ≤ 1.25 × AdamW"
    - "OOD validation loss no more than 1% worse than the best reference"
  robustness_matrix: [model_scale, data_ratio, batch_size]

probes:
  - "Update-direction probe: on a fixed gradient stream, compare the update directions and spectral distributions of the submission with each reference method (used for behavioral divergence)"
  - "Large-batch probe: performance at 4× batch size (a known weakness of Lion-type methods)"

holdout:
  - "μ3 (about 42M) @ 20 tokens/parameter: scale-extrapolation point"
  - "μ1 @ 8× data (long training; checks whether a mid-training advantage disappears after learning-rate decay)"
  - "μ2 @ 4× batch size"
  - "OOD: validation loss on wikitext-103 and a code corpus"

counterfactual:
  - "B-OPT-001-cf1: optimizer-state memory cap lowered to 1 × parameter count (Adam-type methods no longer feasible)"

contamination:
  - "Post-cutoff papers (such as Muon variants after 2026-07) are blocked at the retrieval-tool layer; citing a post-cutoff paper in the submission's source declarations counts as a violation"
  - "Official implementations of the reference methods may be memorized by the model, so code divergence has low weight and behavioral probes carry most of the weight"

# Canonical ratings copied from index.yaml
difficulty: medium
budget_tier: high
status: scaffold
track: B
priority: P0
# Shared resource and sandbox profile (v2026.07)
resource_profile:
  sandbox_profile: single_gpu_24gb
  hardware_class: single_gpu_24gb
  accelerator: RTX_4090_class
  accelerator_count: 1
  memory_gib: 24
  cost_unit: GPU-h
  leaderboard: budget
  limits:
    agent_dev:
      value: 8
      unit: GPU-h
    per_submission_verify:
      value: 6
      unit: GPU-h
    reference_precompute:
      value: 74
      unit: GPU-h
  sandbox:
    network: disabled
    filesystem: output_only
    hidden_inputs: server_only
    measurement: server_side
resource_rating: high
standard_case: spec/standard_cases/B-OPT-001.yaml   # the agent-facing contract (task statement v2.1) is generated from this spec
