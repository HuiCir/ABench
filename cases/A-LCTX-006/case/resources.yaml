case_id: A-LCTX-006
scope: deferred_out_of_scope_v1
status: scaffold
resource_rating: medium
offline_bundle: synthetic_mqar_v1 + fixed_longdoc_v1 + offline_rag_corpus_v1 + tiny_lm_train_v1 (packaged by the server; network access at run time is forbidden)
datasets:
- Synthetic MQAR/needle generator (version and seed frozen by the server)
- Fixed long-document bundle (document hashes and split manifest held by the server)
- TinyStories or an equivalent small corpus snapshot (tokenizer and sha256 frozen)
- Fixed offline RAG document store, queries and answer-supporting passages (BM25/dense retrieval reference implementation and split manifest frozen by the server)
models:
- Decoder-only base checkpoint of ≤ 350M parameters (revision and sha256 frozen by the server)
software:
- Python 3.11
- PyTorch 2.6 + CUDA 12.4
- transformers version and lockfile frozen by the server
hardware: One 24GB GPU; only the server container and a fixed CUDA are allowed; CPU only for preprocessing
private_resources:
- Hidden length/position distributions, reference runs, peak-memory timer, contamination-detection set
sandbox_constraints:
- No network; data and base model mounted read-only; the submission may write only to the working directory
- Reading hidden lengths, labels, validation loss or evaluator state is forbidden
- Custom drivers, external processes or undeclared CUDA extensions are not allowed
- RAG may access only the offline corpus; external retrieval, browsers or online embedding APIs must not be called
blocked_inputs:
- frozen_tokenizer_and_base_model_hash
- offline_long_context_probe_and_hidden_lengths
- fixed_gpu_memory_and_throughput_timer
no_download_or_training_in_scaffold: true
resource_profile: single_gpu_24gb
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
# Shared sandbox/resource declaration (v2026.07)
sandbox_profile: single_gpu_24gb
budget_tier: medium
hardware_class: single_gpu_24gb
cost_unit: GPU-h
