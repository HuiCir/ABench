version: v0-scaffold
case_id: A-LCTX-006
objective: pareto_frontier
primary_metrics:
- name: mqar_recall
  direction: higher
  unit: accuracy
  role: quality
- name: short_context_ce
  direction: lower
  unit: nats/token
  role: quality_constraint
- name: peak_memory_gb
  direction: lower
  unit: GB
  role: cost
- name: tokens_per_second
  direction: higher
  unit: tokens/s
  role: cost
normalization:
  direction: per metric declaration
  baseline: server reference envelope
  aggregation: non-dominated set + normalized hypervolume; publish per-dimension values
gates:
- valid_run_manifest
- resource_and_time_budget
- finite_metrics
- deterministic_replay
- no_hidden_input_or_network_access
- quality_and_safety_constraints
pareto_policy:
  no_single_sota_gate: true
  constraint_fail: dominated_and_ineligible
  tie_break: lower total measured cost then lower variance
simulation_policy: 'none: this scaffold does not generate scores'
missing_real_artifacts: report pending rather than zeroing a fabricated score
deferred_due_to:
- frozen_tokenizer_and_base_model_hash
- offline_long_context_probe_and_hidden_lengths
- fixed_gpu_memory_and_throughput_timer
objective_mode: pareto
resource_profile: single_gpu_24gb
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
pareto:
  axes:
  - id: mqar_recall
    direction: maximize
    unit: accuracy
    primary: true
  - id: rag_retrieval_recall_at_5
    direction: maximize
    unit: fraction
    primary: false
  - id: short_context_ce
    direction: minimize
    unit: nats/token
    primary: false
  - id: peak_memory_gb
    direction: minimize
    unit: GB
    primary: false
  - id: tokens_per_second
    direction: maximize
    unit: tokens/s
    primary: false
  feasibility:
  - metric: rag_retrieval_recall_at_5
    op: '>='
    threshold: reference_quality_floor
  aggregation: empirical_frontier
  report:
  - frontier_points
  - hypervolume
  - knee_point
  - dominated_by_reference
