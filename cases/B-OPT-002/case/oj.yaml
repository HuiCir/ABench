schema: abench.oj/v2
case_id: B-OPT-002
handcrafted: true
agent_visible:
  task: case/agent/task.md
  interface:
    - harness/interface.md
    - harness/optim_api.py
    - harness/primitive_search.py
  # 'proxy score' names the agent's own search objective, not the judge score
  leak_allow: [score]
data:
  public: []
  hidden: null
  note: "The fixed gradient stream is generated by primitive_search.fixed_stream; training data is provided only inside the evaluation environment"
submission:
  kind: code_only
  entry: optimizer.py
  checkpoint_dir: null
  allowed_top_level: [README.md, optimizer.py, src, search.py, search_spec.yaml, search_log.jsonl, hparam_space.yaml, report, references.yaml, manifest.yaml]
  max_bytes: 10485760
  report_profile: design_report_v2
judge:
  kind: pending
  planned: [search_replay, optimizer_retrain]
  note: "The judge first replays search.py in a clean environment and compares against search_log.jsonl, then reads only optimizer.py and hparam_space.yaml and trains from scratch"
