# Generic protocol scaffold; no simulated evaluation outputs.
case_id: V-DIT-003
version: v2026.07
cutoff: '2026-07-01'
hardware:
  reference: single 24GB GPU (Budget; resource_profile pending)
  software: benchmark manifest required
  timing: server-side wall clock; median over fixed seeds
proxy:
  types:
  - SUBSET
  - MICRO
  plan: 100-class subset of ImageNet 64px, DiT-S class, pre-encoded latents; FID-10k
  fidelity_gate: track-level calibration must reproduce at least 5 known pairwise
    orderings with >=80% agreement
budget:
  agent_dev_gpu_h: 8
  per_submission_verify_gpu_h: 6
  reference_precompute_gpu_h: 60
  submissions: 1
ladder:
  L0_smoke:
    visibility: agent
    checks:
    - interface
    - finite outputs
    - determinism
    - resource limits
    - no input mutation
  L1_proxy:
    visibility: agent
    settings: smallest documented proxy
  L2_main:
    visibility: benchmark
    settings: public validation split and fixed seeds
  L3_holdout:
    visibility: hidden
    settings: scale/length/parameter/OOD holdout as appropriate
inputs:
  public: resources.yaml
  private: benchmark-side manifests and hidden split
  required_hashes: true
outputs:
  required:
  - manifest.json
  - run.jsonl
  - artifacts.sha256
  - metrics.json
  forbidden:
  - simulated_scores
  - fabricated_reference_runs
  - undeclared_network_access
special_blockers:
- frozen_weights_or_dataset_snapshot
- fid_or_scene_metric_calibration
- reference_runs_and_fixed_hardware
activation: scaffold_only_until_real_reference_runs_and_hidden_eval_exist
