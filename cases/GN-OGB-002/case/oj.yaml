# GN-OGB-002 OJ contract (standard case, generated by tools/build_standard_cases.py from spec/standard_cases/GN-OGB-002.yaml; edit the spec, not this file)
schema: abench.oj/v2
case_id: GN-OGB-002
standard: true
task_statement: v2.1
mode: checkpoint
agent_visible:
  task: case/agent/task.md
  interface:
  - harness/interface.md
  - harness/sandbox_guide.md
  - harness/stages.py
  - harness/metrics.py
  - harness/abench_stage.py
  - harness/abench_metrics.py
  - harness/selfcheck.py
  - harness/submission_rules.json
  - harness/baseline/model.py
  - harness/baseline/train.py
  leak_allow:
  - hidden
  - evaluation
  - metric
  - threshold
  - score
  - evaluate
  - held-out
agent_budget:
  gpu_hours: 2.0
  session_hours: 3.0
environment:
  profile: gpu-torch
  version: '2026.10'
resources:
  budget_tier: budget
  hardware:
    reference: RTX 4090 24GB
  wall_clock_limit_h: 3.0
  leaderboard: all
  gpus: 1
  gpu_class: reference24
  cpus: 8
  memory: 32g
  shm_size: 2g
data:
  public_dir: sandbox/data/GN-OGB-002
  public:
  - path: sandbox/data/GN-OGB-002/graph.npz
    sha256: pending
  hidden:
    path: sandbox/hidden/GN-OGB-002/hidden.npz.enc
    sha256_plain: pending
    keys:
    - y_test
  sources:
  - name: ogbn-arxiv (Hu et al. 2020, Open Graph Benchmark)
    url: http://snap.stanford.edu/ogb/data/nodeproppred/arxiv.zip
    license: ODC-BY
    verified: '2026-10-19: archive URL, 40 classes, time split and accuracy metric read from ogb/nodeproppred/master.csv;
      license, 169,343 nodes and 1,166,243 edges from ogb.stanford.edu/docs/nodeprop'
submission:
  kind: code_plus_checkpoint
  entry: model.py
  checkpoint_dir: checkpoint
  allowed_top_level:
  - README.md
  - model.py
  - train.py
  - checkpoint
  - src
  - report
  - references.yaml
  code_suffixes:
  - .py
  - .yaml
  - .yml
  - .md
  - .txt
  code_max_bytes: 200000
  max_bytes: 526288000
  checkpoint_max_bytes: 524288000
  required_files:
  - train.py
  report_profile: design_report_v2
judge:
  kind: harness
  activation: awaiting_data
  stages: harness/stages.py
  metrics: harness/metrics.py
  device: cuda
  reference_gpu: RTX 4090-class 24GB (model, driver, CUDA and torch versions frozen at activation)
  seeds:
  - 2005
