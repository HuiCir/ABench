# Resource registry scaffold; URLs/checkpoints are intentionally not fabricated.
case_id: V-GEN-001
status: scaffold
required:
  datasets: freeze source, version, split, license and sha256 before activation
  models: freeze config/checkpoint/revision and sha256
  software: freeze container, compiler/CUDA/PyTorch versions
  hardware: record device model, driver, clocks and thermal state
public_resources:
  anchor: DDPM
  arxiv: '2006.11239'
  track_proxy:
  - SUBSET
  - MICRO
  notes:
  - Subset, fewer-fold or low-resolution proxy; fidelity calibration before launch
  - Micro-scale training ladder; real model, tokenizer and data hashes are frozen by the benchmark operator
private_resources:
- hidden test split or task instances
- reference runs and tuned baselines
- server signing key / run manifest
blocked_inputs:
- frozen_weights_or_dataset_snapshot
- fid_or_scene_metric_calibration
- reference_runs_and_fixed_hardware
no_download_or_training_in_scaffold: true
