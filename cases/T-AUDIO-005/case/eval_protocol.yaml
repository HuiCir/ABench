case_id: T-AUDIO-005
version: v2026.07
cutoff: '2026-07-01'
hardware:
  reference: single 24GB GPU; CPU-only audio decode/pre-cache stage allowed
  software: benchmark manifest required; fixed container/CUDA/PyTorch/torchaudio/transformers
  timing: server-side wall clock, realtime factor and peak memory; median over fixed seeds
proxy:
  types:
  - FROZEN
  - SUBSET
  plan: Freeze a ≤ 100M wav2vec 2.0/HuBERT encoder with fixed 16 kHz audio and CTC vocabulary; train only a linear CTC layer, low-rank/bottleneck adapters or a lightweight pooling head; select on a public speaker-disjoint split and review on hidden speaker/accent/noise splits
  fidelity_gate: track-level calibration must reproduce at least 5 known pairwise orderings with >=80% agreement
budget:
  agent_dev_gpu_h: 3
  per_submission_verify_gpu_h: 1.5
  reference_precompute_gpu_h: 15
  budget_tier: medium
  submissions: 1
ladder:
  L0_smoke:
    visibility: agent
    checks:
    - interface
    - finite outputs
    - determinism
    - resource limits
    - no input mutation
    - frozen encoder checksum
  L1_proxy:
    visibility: agent
    settings: smallest documented 16kHz speech subset and one fixed seed
  L2_main:
    visibility: benchmark
    settings: public speaker-disjoint split, fixed normalization and seeds
  L3_holdout:
    visibility: hidden
    settings: unseen speakers, accents/noise conditions and duplicate-cluster checks
inputs:
  public: resources.yaml
  private: benchmark-side manifests and hidden speaker/noise split
  required_hashes: true
outputs:
  required:
  - manifest.json
  - run.jsonl
  - artifacts.sha256
  - metrics.json
  forbidden:
  - simulated_scores
  - fabricated_reference_runs
  - undeclared_network_access
  - modified_frozen_encoder
metrics:
  objective: pareto_frontier
  dimensions:
  - name: wer
    direction: lower
    unit: fraction
    role: quality
  - name: cer
    direction: lower
    unit: fraction
    role: quality
  - name: speaker_heldout_wer
    direction: lower
    unit: fraction
    role: robustness
  - name: trainable_params_m
    direction: lower
    unit: million
    role: cost
  - name: peak_memory_gb
    direction: lower
    unit: GB
    role: cost
  - name: realtime_factor
    direction: lower
    unit: ratio
    role: latency
  - name: compute_cost_gpu_h
    direction: lower
    unit: GPU-h
    role: cost
  dominance: quality and robustness dimensions minimize; cost and latency dimensions minimize; constraint dimensions must pass before dominance
  aggregation: report full non-dominated set and hypervolume against server reference envelope
special_blockers:
- frozen_audio_encoder_processor_and_vocab_hash
- offline_16khz_speech_bundle_and_speaker_holdout
- fixed_audio_preprocess_and_server_asr_evaluator
- fixed_gpu_timer_and_peak_memory_probe
activation: scaffold_only_until_real_reference_runs_and_hidden_eval_exist
objective_mode: pareto
resource_profile:
  sandbox_profile: single_gpu_24gb
  hardware_class: single_gpu_24gb
  accelerator: RTX_4090_class
  accelerator_count: 1
  memory_gib: 24
  cost_unit: GPU-h
  leaderboard: budget
  limits:
    agent_dev: {value: 3, unit: GPU-h}
    per_submission_verify: {value: 1.5, unit: GPU-h}
    reference_precompute: {value: 15, unit: GPU-h}
  sandbox:
    network: disabled
    filesystem: output_only
    hidden_inputs: server_only
    measurement: server_side
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
