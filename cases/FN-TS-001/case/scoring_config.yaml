# Scoring contract scaffold; calibrate coefficients before leaderboard use.
version: v0-scaffold
primary_metrics:
- Rank IC
- Long-short portfolio Sharpe (after costs)
- Performance in post-cutoff windows
normalization:
  direction: higher_is_better per metric declaration
  baseline: server reference envelope
  aggregation: geometric mean for ratios; arithmetic mean for bounded scores; publish
    both
gates:
- valid_run_manifest
- resource_and_time_budget
- finite_metrics
- deterministic_replay
- no_hidden_input_or_network_access
- quality floor versus reference baseline
discovery: optional when submitted; score only with server-side evidence and source
  verification
missing_real_artifacts: report pending rather than zeroing a fabricated score
simulation_policy: 'none: this scaffold does not generate scores'
deferred_due_to:
- licensed_time_forward_data_snapshot
- transaction_cost_and_survivorship_rules
- post_cutoff_hidden_window
- specific_anchor_or_citation_verification
