version: v0-scaffold
case_id: C-QNT-003
objective: pareto_frontier
primary_metrics:
- {name: quantized_quality, direction: higher, unit: normalized_score, role: quality}
- {name: model_size_mb, direction: lower, unit: MB, role: cost}
- {name: throughput_tokens_per_s, direction: higher, unit: tokens/s, role: quality_cost}
- {name: p95_decode_latency_ms, direction: lower, unit: ms/token, role: cost}
- {name: peak_memory_gb, direction: lower, unit: GB, role: cost}
- {name: calibration_gpu_hours, direction: lower, unit: GPU-h, role: cost}
normalization: {direction: per metric declaration, baseline: server reference envelope, aggregation: non-dominated set + normalized hypervolume}
gates: [valid_run_manifest, resource_and_time_budget, finite_metrics, deterministic_replay, numerical_equivalence, no_hidden_input_or_network_access, quality_floor]
pareto_policy: {no_single_sota_gate: true, constraint_fail: dominated_and_ineligible, tie_break: lower total measured cost then lower variance}
simulation_policy: 'none: this scaffold does not generate scores'
missing_real_artifacts: report pending rather than zeroing a fabricated score
deferred_due_to: [frozen_model_tokenizer_and_runtime_hash, quantization_kernel_and_hardware_baseline, hidden_quality_suite_and_server_timer]
objective_mode: pareto
resource_profile: frozen_inference_24gb
spec_refs: [spec/pareto_protocol.md, spec/sandbox_profiles.md]
pareto:
  axes:
  - {id: quantized_quality, direction: maximize, unit: normalized_score, primary: true}
  - {id: model_size_mb, direction: minimize, unit: MB, primary: false}
  - {id: throughput_tokens_per_s, direction: maximize, unit: tokens/s, primary: false}
  - {id: p95_decode_latency_ms, direction: minimize, unit: ms/token, primary: false}
  - {id: peak_memory_gb, direction: minimize, unit: GB, primary: false}
  - {id: calibration_gpu_hours, direction: minimize, unit: GPU-h, primary: false}
  feasibility: [{metric: quantized_quality, op: '>=', threshold: reference_quality_floor}]
  aggregation: empirical_frontier
  report: [frontier_points, hypervolume, knee_point, dominated_by_reference]
