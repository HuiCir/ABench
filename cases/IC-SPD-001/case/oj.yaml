schema: abench.oj/v2
case_id: IC-SPD-001
handcrafted: true
standard: true
task_statement: v2.1            # task statement standard spec/task_statement_standard.md
agent_visible:
  task: case/agent/task.md
  interface:
    - harness/interface.md
    - harness/gpu_sandbox.md
    - harness/speedrun_harness.py
    - harness/speedrun_runner.py
    - harness/selfcheck.py
  # The task statement must state metrics, thresholds and the evaluation method, so these terms are exempt from the leak check in this case's agent view
  leak_allow: [hidden, evaluation, metric, threshold, score, evaluate]
agent_budget:
  gpu_hours: 1.0
  session_hours: 3.0
data:
  public:
    - path: sandbox/data/IC-SPD-001/train.npz
      sha256: pending
      rows: 50000
      dev_rows: 5000
  hidden:
    path: sandbox/hidden/IC-SPD-001/test.npz.enc
    sha256_plain: pending
    rows: 12000
    rows_by_src: {cifar10: 10000, cifar10_1: 2000}
  sources:
    - name: CIFAR-10 (Krizhevsky 2009)
      url: https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz
      mirror: https://huggingface.co/datasets/uoft-cs/cifar10
      md5: c58f30108f718f92721af3b95e74349a
      license: to_verify
    - name: CIFAR-10.1 v6 (Recht et al. 2018, arXiv:1806.00451)
      url: https://github.com/modestyachts/CIFAR-10.1/tree/d9982abb0bfc4846b8d13a11e66b887d946205d0/datasets
      pinned: "commit d9982abb0bfc4846b8d13a11e66b887d946205d0; sha256 of both files in tools/prepare_ic_spd.py (checked 2026-10-21)"
      license: "code MIT; images follow Tiny Images terms (to_verify)"
submission:
  kind: code_only
  entry: method.py
  checkpoint_dir: null
  allowed_top_level: [README.md, method.py, src, report, references.yaml]
  code_suffixes: [.py, .yaml, .yml, .md, .txt]
  code_max_bytes: 200000
  max_bytes: 2000000
  report_profile: design_report_v2
judge:
  kind: timed_train_classification
  activation: awaiting_data       # set to active after the operator runs tools/prepare_ic_spd.py on the real data
  runner: harness/speedrun_runner.py
  device: cuda
  reference_gpu: "RTX 4090-class 24GB (model, driver, CUDA and torch versions frozen at activation)"
  seeds: [913, 2718, 31415, 57721, 86753]   # kept secret by the operator
  n_classes: 10
  subsets: {cifar10: 0, cifar10_1: 1}
  timeout_sec: 600
  predict_cap_sec: 5
  tail_slack_sec: 3
  threads: 8
  gates:
    - {metric: accuracy_cifar10_mean, min: 0.94}
    - {metric: accuracy_cifar10_1_mean, min: 0.80}
  primary: train_seconds_mean
