schema_version: '1.0'
case_id: IC-SPD-001
status: frozen_definitions_pending_reference_runs
metrics:
- id: train_seconds_mean
  name: Training time T (primary metric)
  direction: lower_is_better
  unit: seconds
  aggregation: mean
  aggregation_note: over 5 judge seeds; parent-process clock, handshake R→T (harness/speedrun_runner.py)
  required: true
  pareto_role: objective
- id: accuracy_cifar10_mean
  name: CIFAR-10 test accuracy
  direction: higher_is_better
  unit: fraction
  aggregation: mean
  aggregation_note: over 5 judge seeds; 10,000 official test images
  required: true
  gate: {min: 0.94}
- id: accuracy_cifar10_1_mean
  name: CIFAR-10.1 v6 accuracy
  direction: higher_is_better
  unit: fraction
  aggregation: mean
  aggregation_note: over 5 judge seeds; 2,000 images
  required: true
  gate: {min: 0.80, note: provisional until reference runs on the frozen card}
