# Generic protocol scaffold; no simulated evaluation outputs.
case_id: U-DLM-005
version: v2026.07
cutoff: '2026-07-01'
hardware:
  reference: single 24GB GPU (Budget; explicit resource_profile)
  software: benchmark manifest required
  timing: server-side wall clock; median over fixed seeds
proxy:
  types:
  - INFER
  plan: Use ≤ 1B masked-diffusion LM weights from HF and change only sampling; LLaDA-8B serves only as literature background
  fidelity_gate: track-level calibration must reproduce at least 5 known pairwise
    orderings with >=80% agreement
budget:
  agent_dev_gpu_h: 4
  per_submission_verify_gpu_h: 2
  reference_precompute_gpu_h: 5
  submissions: 1
ladder:
  L0_smoke:
    visibility: agent
    checks:
    - interface
    - finite outputs
    - determinism
    - resource limits
    - no input mutation
  L1_proxy:
    visibility: agent
    settings: smallest documented proxy
  L2_main:
    visibility: benchmark
    settings: public validation split and fixed seeds
  L3_holdout:
    visibility: hidden
    settings: scale/length/parameter/OOD holdout as appropriate
inputs:
  public: resources.yaml
  private: benchmark-side manifests and hidden split
  required_hashes: true
outputs:
  required:
  - manifest.json
  - run.jsonl
  - artifacts.sha256
  - metrics.json
  forbidden:
  - simulated_scores
  - fabricated_reference_runs
  - undeclared_network_access
special_blockers:
- frozen_checkpoint_or_synthetic_task_suite
- long_context_and_compute_calibration
- reference_runs
- fixed_checkpoint_and_runtime_stack
- specific_anchor_or_citation_verification
activation: deferred until blocked_inputs are frozen and real reference runs exist
# Shared resource and sandbox profile (v2026.07)
resource_profile:
  sandbox_profile: frozen_inference_24gb
  hardware_class: single_gpu_24gb
  accelerator: RTX_4090_class
  accelerator_count: 1
  memory_gib: 24
  cost_unit: GPU-h
  leaderboard: budget
  limits:
    agent_dev:
      value: 4
      unit: GPU-h
    per_submission_verify:
      value: 2
      unit: GPU-h
    reference_precompute:
      value: 5
      unit: GPU-h
  sandbox:
    network: disabled
    filesystem: output_only
    hidden_inputs: server_only
    measurement: server_side
