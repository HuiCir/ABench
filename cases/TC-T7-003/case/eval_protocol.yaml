resource_profile:
  sandbox_profile: low_cpu
  hardware_class: cpu_only
  accelerator: benchmark_cpu
  accelerator_count: 1
  memory_gib: null
  cost_unit: CPU-h
  leaderboard: budget_cpu
  limits:
    agent_dev:
      value: 0
      unit: CPU-h
    per_submission_verify:
      value: 0
      unit: CPU-h
    reference_precompute:
      value: 0
