# DS-GBM-001 OJ contract (v2.1 case, generated by tools/build_standard_cases.py from spec/cases/DS-GBM-001.yaml; edit the spec, not this file)
schema: abench.oj/v2
case_id: DS-GBM-001
standard: false
task_statement: v2.1
mode: judge_trains
agent_visible:
  task: case/agent/task.md
  interface:
  - harness/interface.md
  - harness/sandbox_guide.md
  - harness/stages.py
  - harness/metrics.py
  - harness/abench_stage.py
  - harness/abench_metrics.py
  - harness/selfcheck.py
  - harness/submission_rules.json
  - harness/baselines/hgb/model.py
  leak_allow:
  - hidden
  - evaluation
  - metric
  - threshold
  - score
  - evaluate
  - held-out
agent_budget:
  cpu_core_hours: 32
  session_hours: 4
data:
  public_dir: sandbox/data/DS-GBM-001
  public: []
  public_files: dev_<name>.npz for the ten dev datasets (hashes recorded in data_lock.yaml by tools/prepare/run.py)
  hidden:
    path: sandbox/hidden/DS-GBM-001/hidden.npz.enc
    sha256_plain: pending
    keys: 'h00..h19: x_train, y_train, task (given before the timed phase), x_test (after it), y_test (evaluator
      only)'
  sources:
  - name: 'Tabular benchmark of Grinsztajn et al. 2022, Hugging Face inria-soda/tabular-benchmark (30 CSV files:
      10 dev, 20 held-out)'
    url: https://huggingface.co/datasets/inria-soda/tabular-benchmark
    revision: 8d0ff9103525b7e3579b180230fddb3186258301
    license: no licence on the dataset card (to_verify before release); each file re-uploads an OpenML dataset
    verified: '2026-10-22: revision and file list from the Hugging Face API; CSV layout (numeric features, target
      in the last column) read from clf_cat/compas-two-years.csv and clf_num/heloc.csv at this revision'
submission:
  kind: code_only
  entry: model.py
  checkpoint_dir: null
  allowed_top_level:
  - README.md
  - model.py
  - src
  - report
  - references.yaml
  code_suffixes:
  - .py
  - .yaml
  - .yml
  - .md
  - .txt
  code_max_bytes: 200000
  max_bytes: 2000000
  report_profile: design_report_v2
judge:
  kind: harness
  activation: awaiting_data
  stages: harness/stages.py
  metrics: harness/metrics.py
  device: cpu
  reference_hardware: 8 CPU cores (model frozen at activation)
  seeds:
  - 1603
  - 2754
  baseline: harness/baselines/hgb
template: DS-PIPE-002
