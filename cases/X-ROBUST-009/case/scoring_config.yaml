- name: safety_overrefusal_rate
  direction: lower
  unit: fraction
  role: safety
- name: worst_shift_risk
  direction: lower
  unit: fraction
  role: stability
- name: inference_latency_ms
  direction: lower
  unit: ms_per_example
  role: cost
- name: peak_memory_gb
  direction: lower
  unit: GB
  role: cost
- name: train_gpu_hours
  direction: lower
  unit: GPU-h
  role: cost
- name: seed_std
  direction: lower
  unit: fraction
  role: stability
normalization:
  direction: per metric declaration
  baseline: server reference envelope
  aggregation: non-dominated set + normalized hypervolume; publish per-shift/per-seed values
gates:
- valid_run_manifest
- resource_and_time_budget
- finite_metrics
- deterministic_replay
- no_hidden_input_or_network_access
- id_quality_floor
- safety_refusal_floor
- no_overrefusal_violation
pareto_policy:
  no_single_sota_gate: true
  constraint_fail: dominated_and_ineligible
  tie_break: lower seed_std, then lower total measured cost
simulation_policy: 'none: this scaffold does not generate scores'
missing_real_artifacts: report pending rather than zeroing a fabricated score
deferred_due_to:
- frozen_base_checkpoint_tokenizer_and_label_taxonomy
- offline_public_calibration_and_hidden_shift_bundle
- server_hidden_safety_labels_and_latency_probe
objective_mode: pareto
resource_profile: posttrain_24gb
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
pareto:
  axes:
  - id: id_macro_f1
    direction: maximize
    unit: fraction
    primary: true
  - id: ece_15
    direction: minimize
    unit: fraction
    primary: true
  - id: risk_at_80pct_coverage
    direction: minimize
    unit: fraction
    primary: true
  - id: coverage_at_1pct_risk
    direction: maximize
    unit: fraction
    primary: true
  - id: ood_auroc
    direction: maximize
    unit: fraction
    primary: true
  - id: safety_refusal_tpr
    direction: maximize
    unit: fraction
    primary: true
  - id: safety_overrefusal_rate
    direction: minimize
    unit: fraction
    primary: false
  - id: worst_shift_risk
    direction: minimize
    unit: fraction
    primary: false
  - id: inference_latency_ms
    direction: minimize
    unit: ms_per_example
    primary: false
  - id: peak_memory_gb
    direction: minimize
    unit: GB
    primary: false
  - id: train_gpu_hours
    direction: minimize
    unit: GPU-h
    primary: false
  - id: seed_std
    direction: minimize
    unit: fraction
    primary: false
  feasibility:
  - metric: id_macro_f1
    op: '>='
    threshold: reference_quality_floor
  - metric: safety_refusal_tpr
    op: '>='
    threshold: reference_safety_floor
  - metric: safety_overrefusal_rate
    op: '<='
    threshold: reference_overrefusal_ceiling
  aggregation: empirical_frontier
  report:
