  unit: fraction
  role: quality_constraint
- name: ece_15
  direction: lower
  unit: fraction
  role: reliability
- name: risk_at_80pct_coverage
  direction: lower
  unit: fraction
  role: reliability
- name: coverage_at_1pct_risk
  direction: higher
  unit: fraction
  role: reliability
- name: ood_auroc
  direction: higher
  unit: fraction
  role: reliability
- name: safety_refusal_tpr
  direction: higher
  unit: fraction
