# Generic protocol scaffold; no simulated evaluation outputs.
case_id: X-PPO-001
version: v2026.07
cutoff: '2026-07-01'
hardware:
  reference: single 24GB GPU (Budget; explicit resource_profile)
  software: benchmark manifest required
  timing: server-side wall clock; median over fixed seeds
proxy:
  types:
  - SUBSET
  plan: Small continuous-control environments, 5 seeds, fixed sample count
  fidelity_gate: track-level calibration must reproduce at least 5 known pairwise
    orderings with >=80% agreement
budget:
  agent_dev_gpu_h: 2
  per_submission_verify_gpu_h: 0.5
  reference_precompute_gpu_h: 5
  submissions: 1
ladder:
  L0_smoke:
    visibility: agent
    checks:
    - interface
    - finite outputs
    - determinism
    - resource limits
    - no input mutation
  L1_proxy:
    visibility: agent
    settings: smallest documented proxy
  L2_main:
    visibility: benchmark
    settings: public validation split and fixed seeds
  L3_holdout:
    visibility: hidden
    settings: scale/length/parameter/OOD holdout as appropriate
inputs:
  public: resources.yaml
  private: benchmark-side manifests and hidden split
  required_hashes: true
outputs:
  required:
  - manifest.json
  - run.jsonl
  - artifacts.sha256
  - metrics.json
  forbidden:
  - simulated_scores
  - fabricated_reference_runs
  - undeclared_network_access
special_blockers:
- frozen_base_model_and_task_split
- rollout_or_reward_environment_for_rl_cases
- hidden_reward_hacking_checks
activation: scaffold_only_until_real_reference_runs_and_hidden_eval_exist
# Shared resource and sandbox profile (v2026.07)
resource_profile:
  sandbox_profile: posttrain_24gb
  hardware_class: single_gpu_24gb
  accelerator: RTX_4090_class
  accelerator_count: 1
  memory_gib: 24
  cost_unit: GPU-h
  leaderboard: budget
  limits:
    agent_dev:
      value: 2
      unit: GPU-h
    per_submission_verify:
      value: 0.5
      unit: GPU-h
    reference_precompute:
      value: 5
      unit: GPU-h
  sandbox:
    network: disabled
    filesystem: output_only
    hidden_inputs: server_only
    measurement: server_side
