# Scoring contract scaffold; calibrate coefficients before leaderboard use.
version: scaffold-v1
case_id: TC-ENC-002
primary_metric: GLUE subtask accuracy
metrics:
  primary: macro accuracy/F1 on hidden text sets
  efficiency: documents per second and CPU/GPU time
  robustness: post-cutoff/OOD regression
weights:
  primary: 0.6
  efficiency: 0.2
  robustness: 0.2
gates:
- all required outputs are server-measured
- hidden evaluation is separated from development data
statistics:
  seeds: per eval_protocol
  aggregation: dataset/task macro mean with bootstrap interval
status: scaffold_only_no_real_runs
primary_metrics: []
# Shared multi-objective evaluation; formal coefficients are frozen after calibration.
objective_mode: pareto
pareto:
  axes:
    - id: quality
      metric: case_defined_macro_quality
      direction: maximize
      unit: normalized_score
      required: true
      source: server
    - id: throughput
      metric: samples_per_s
      direction: maximize
      unit: case_defined_per_s
      required: false
      source: server
    - id: peak_memory
      metric: peak_rss_mb
      direction: minimize
      unit: MiB
      required: false
      source: server
    - id: compute_cost
      metric: compute_cost_cpu_h
      direction: minimize
      unit: reference_h
      required: false
      source: server
    - id: stability
      metric: stable_success_rate
      direction: maximize
      unit: fraction
      required: true
      source: server
  feasibility:
    - metric: quality
      op: ">="
      threshold: reference_quality_floor
    - metric: compute_cost
      op: "<="
      threshold: declared_budget
  comparison:
    scope: same_case_same_hardware_same_budget_tier
    reference: reference_envelope
    unavailable_axis: null_and_exclude_from_frontier
    uncertainty: confidence_interval_then_noise_floor
  aggregation: empirical_frontier
  report: [frontier_points, normalized_hypervolume, knee_point, dominated_by_reference, confidence_intervals]
  tie_break: lower_compute_cost_then_lower_peak_memory_then_lower_variance
