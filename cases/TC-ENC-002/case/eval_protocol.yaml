version: scaffold-v1
case_id: TC-ENC-002
hardware:
  primary: fixed reference GPU/CPU image (to be frozen)
  software: container, libraries and driver hashes required
  timing: server-side wall-clock; warmup and windows logged
budget:
  agent_dev_hours: 1
  per_submission_verify_hours: 0.3
  reference_precompute_hours: 3
  unit: CPU-h or GPU-h
  plan: ≤ 110M encoder, 4 GLUE subtasks
ladder:
  L0_smoke:
    visibility: agent
    checks:
    - entrypoint/output schema
    - deterministic seed handling
    - finite outputs
    - resource declaration
  L1_proxy:
    visibility: agent
    purpose: ≤ 110M encoder, 4 GLUE subtasks
  L2_main:
    visibility: benchmark
    purpose: frozen public verification subset
  holdout:
    visibility: hidden
    purpose: OOD/temporal/dataset holdout and anti-gaming checks
data_split: Document-level train/validation; temporal or post-cutoff hidden text holdout.
metrics:
  primary: GLUE subtask accuracy
  raw_metrics: GLUE subtask accuracy
artifacts:
  required:
  - submission manifest
  - run metadata
  - metrics.json
  - stdout/stderr
  - resource usage
  forbidden:
  - simulated runs
  - fabricated reference curves
  - hidden-label access
status: scaffold_only_real_resources_and_reference_runs_pending
# Shared resource and sandbox profile (v2026.07)
resource_profile:
  sandbox_profile: single_gpu_24gb
  hardware_class: single_gpu_24gb
  accelerator: RTX_4090_class
  accelerator_count: 1
  memory_gib: 24
  cost_unit: GPU-h
  leaderboard: budget
  limits:
    agent_dev:
      value: 1
      unit: CPU-h
    per_submission_verify:
      value: 0.3
      unit: CPU-h
    reference_precompute:
      value: 3
      unit: CPU-h
  sandbox:
    network: disabled
    filesystem: output_only
    hidden_inputs: server_only
    measurement: server_side
