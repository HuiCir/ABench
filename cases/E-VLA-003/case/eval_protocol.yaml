# Generic protocol scaffold; no simulated evaluation outputs.
case_id: E-VLA-003
version: v2026.07
cutoff: '2026-07-01'
hardware:
  reference: single 24GB GPU (Budget; resource_profile pending)
  software: benchmark manifest required
  timing: server-side wall clock; median over fixed seeds
proxy:
  types:
  - FROZEN
  plan: Switch to a small VLA of ≤ 0.5B (such as SmolVLA), freeze the VLM and only replace or fine-tune the action head; 7B OpenVLA fine-tuning is not in v1
  fidelity_gate: track-level calibration must reproduce at least 5 known pairwise
    orderings with >=80% agreement
budget:
  agent_dev_gpu_h: 8
  per_submission_verify_gpu_h: 4
  reference_precompute_gpu_h: 30
  submissions: 1
ladder:
  L0_smoke:
    visibility: agent
    checks:
    - interface
    - finite outputs
    - determinism
    - resource limits
    - no input mutation
  L1_proxy:
    visibility: agent
    settings: smallest documented proxy
  L2_main:
    visibility: benchmark
    settings: public validation split and fixed seeds
  L3_holdout:
    visibility: hidden
    settings: scale/length/parameter/OOD holdout as appropriate
inputs:
  public: resources.yaml
  private: benchmark-side manifests and hidden split
  required_hashes: true
outputs:
  required:
  - manifest.json
  - run.jsonl
  - artifacts.sha256
  - metrics.json
  forbidden:
  - simulated_scores
  - fabricated_reference_runs
  - undeclared_network_access
special_blockers:
- LIBERO_or_SimplerEnv_version_and_assets
- simulator_determinism_and_30Hz_measurement
- perturbation_holdout_tasks
activation: deferred until blocked_inputs are frozen and real reference runs exist
