    visibility: agent
    purpose: CPU only
  L2_main:
    visibility: benchmark
    purpose: frozen public verification subset
  holdout:
    visibility: hidden
    purpose: OOD/temporal/dataset holdout and anti-gaming checks
data_split: Document-level train/validation; temporal or post-cutoff hidden text holdout.
metrics:
  primary: Accuracy; documents processed per second
  raw_metrics: Accuracy; documents processed per second
artifacts:
  required:
  - submission manifest
  - run metadata
  - metrics.json
  - stdout/stderr
  - resource usage
  forbidden:
  - simulated runs
  - fabricated reference curves
  - hidden-label access
status: scaffold_only_real_resources_and_reference_runs_pending
