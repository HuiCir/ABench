case_id: X-DATA-007
version: v2026.07
cutoff: '2026-07-01'
hardware:
  reference: single 24GB GPU unless CPU-only stage is explicitly stated
  software: benchmark manifest required; fixed container/CUDA/PyTorch
  timing: server-side wall clock and peak memory; median over fixed seeds
proxy:
  types:
  - SUBSET
  - MICRO
  plan: Fixed 256MB–1GB offline document bundle and 7M/17M small models; compare exact/MinHash/SimHash/quality-tiered mixtures, with hidden duplicate clusters and rare-topic tests
  fidelity_gate: track-level calibration must reproduce at least 5 known pairwise
    orderings with >=80% agreement
budget:
  agent_dev_cpu_h: 1
  per_submission_verify_cpu_h: 0.5
  reference_precompute_cpu_h: 10
  budget_tier: low
  submissions: 1
ladder:
  L0_smoke:
    visibility: agent
    checks:
    - interface
    - finite outputs
    - determinism
    - resource limits
    - no input mutation
  L1_proxy:
    visibility: agent
    settings: smallest documented proxy
  L2_main:
    visibility: benchmark
    settings: public validation split and fixed seeds
  L3_holdout:
    visibility: hidden
    settings: hidden lengths/shapes/capability families/duplicate clusters as appropriate
inputs:
  public: resources.yaml
  private: benchmark-side manifests and hidden split
  required_hashes: true
outputs:
  required:
  - manifest.json
  - run.jsonl
  - artifacts.sha256
  - metrics.json
  forbidden:
  - simulated_scores
  - fabricated_reference_runs
  - undeclared_network_access
metrics:
  objective: pareto_frontier
  dimensions:
  - name: validation_ce
    direction: lower
    unit: nats/token
    role: quality
  - name: unique_token_coverage
    direction: higher
    unit: fraction
    role: quality
  - name: duplicate_recall
    direction: higher
    unit: fraction
    role: constraint
  - name: false_delete_rate
    direction: lower
    unit: fraction
    role: constraint
  - name: preprocess_cpu_hours
    direction: lower
    unit: CPU-h
    role: cost
  - name: training_tokens_per_second
    direction: higher
    unit: tokens/s
    role: cost
  dominance: quality dimensions maximize; cost dimensions minimize; constraint dimensions
    must pass before dominance
  aggregation: report full non-dominated set and hypervolume against server reference
    envelope
special_blockers:
- frozen_document_bundle_and_duplicate_clusters
- server_hidden_contamination_labels
- fixed_cpu_timer_and_training_probe
activation: scaffold_only_until_real_reference_runs_and_hidden_eval_exist
resource_profile:
  sandbox_profile: low_cpu
  hardware_class: cpu_only
  accelerator: benchmark_cpu
  accelerator_count: 1
  memory_gib: null
  cost_unit: CPU-h
  leaderboard: budget_cpu
  limits:
    agent_dev: {value: 1, unit: CPU-h}
    per_submission_verify: {value: 0.5, unit: CPU-h}
    reference_precompute: {value: 10, unit: CPU-h}
  sandbox:
    network: disabled
    filesystem: output_only
    hidden_inputs: server_only
    measurement: server_side
objective_mode: pareto
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
