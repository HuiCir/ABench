    license: Apache-2.0
  - name: inception
    path: sandbox/models/V-SMP-002/inception
    tree_sha256: pending
    license: Apache-2.0 (pytorch-fid)
  sources:
  - name: google/ddpm-cifar10-32 (Ho et al. 2020, arXiv:2006.11239)
    url: https://huggingface.co/google/ddpm-cifar10-32
    revision: 267b167dc01f0e4e61923ea244e8b988f84deb80
    license: Apache-2.0
