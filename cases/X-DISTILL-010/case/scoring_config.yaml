version: v0-scaffold
case_id: X-DISTILL-010
objective: pareto_frontier
primary_metrics:
- name: hidden_capability_score
  direction: higher
  unit: hidden_task_score
  role: quality
- name: teacher_gap
  direction: lower
  unit: score_gap
  role: quality_constraint
- name: pretrain_ce_regression
  direction: lower
  unit: nats/token
  role: constraint
- name: student_params_m
  direction: lower
  unit: million
  role: cost
- name: student_tokens_per_s
  direction: higher
  unit: tokens/s
  role: quality_cost
- name: peak_memory_gb
  direction: lower
  unit: GB
  role: cost
- name: train_gpu_hours
  direction: lower
  unit: GPU-h
  role: cost
normalization:
  direction: per metric declaration
  baseline: server reference envelope
  aggregation: non-dominated set + normalized hypervolume
gates:
- valid_run_manifest
- resource_and_time_budget
- finite_metrics
- deterministic_replay
- no_hidden_input_or_network_access
- capability_and_regression_constraints
pareto_policy:
  no_single_sota_gate: true
  constraint_fail: dominated_and_ineligible
  tie_break: lower total measured cost then lower variance
simulation_policy: 'none: this scaffold does not generate scores'
missing_real_artifacts: report pending rather than zeroing a fabricated score
deferred_due_to:
- frozen_teacher_student_tokenizer_and_initialization_hash
- offline_distillation_corpus_and_capability_holdout
- server_training_and_inference_timer
objective_mode: pareto
resource_profile: posttrain_24gb
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
pareto:
  axes:
  - id: hidden_capability_score
    direction: maximize
    unit: hidden_task_score
    primary: true
  - id: teacher_gap
    direction: minimize
    unit: score_gap
    primary: false
  - id: pretrain_ce_regression
    direction: minimize
    unit: nats/token
    primary: false
  - id: student_params_m
    direction: minimize
    unit: million
    primary: false
  - id: student_tokens_per_s
    direction: maximize
    unit: tokens/s
    primary: false
  - id: peak_memory_gb
    direction: minimize
    unit: GB
    primary: false
  - id: train_gpu_hours
    direction: minimize
    unit: GPU-h
    primary: false
  feasibility:
  - metric: hidden_capability_score
    op: '>='
    threshold: reference_quality_floor
  aggregation: empirical_frontier
  report:
  - frontier_points
  - hypervolume
  - knee_point
  - dominated_by_reference
