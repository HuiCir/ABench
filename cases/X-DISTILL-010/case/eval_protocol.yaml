case_id: X-DISTILL-010
version: v2026.07
cutoff: '2026-07-01'
hardware:
  reference: single 24GB GPU; teacher forward may be cached server-side
  software: fixed container/CUDA/PyTorch/transformers lockfile
  timing: server-side wall clock, tokens/s and peak memory; median over fixed seeds
proxy:
  types:
  - SURG
  - SUBSET
  plan: Fixed ≤ 350M teacher and ≤ 125M student with an offline text bundle; compare hard-label, logit, feature and
    sequence-level distillation, with hidden capability families held out
  fidelity_gate: track-level calibration must reproduce at least 5 known pairwise
    orderings with >=80% agreement
budget:
  agent_dev_gpu_h: 3
  per_submission_verify_gpu_h: 1.5
  reference_precompute_gpu_h: 15
  budget_tier: medium
  submissions: 1
ladder:
  L0_smoke:
    visibility: agent
    checks:
    - interface
    - finite_outputs
    - determinism
    - resource_limits
    - no_input_mutation
  L1_proxy:
    visibility: agent
    settings: smallest documented proxy
  L2_main:
    visibility: benchmark
    settings: "public validation split, fixed seeds and signed teacher cache"
  L3_holdout:
    visibility: hidden
    settings: "hidden capability families, templates and length buckets"
inputs:
  public: resources.yaml
  private: benchmark-side manifests and hidden split
  required_hashes: true
outputs:
  required:
  - manifest.json
  - run.jsonl
  - artifacts.sha256
  - metrics.json
  forbidden:
  - simulated_scores
  - fabricated_reference_runs
  - undeclared_network_access
metrics:
  objective: pareto_frontier
  dimensions:
  - name: hidden_capability_score
    direction: higher
    unit: hidden_task_score
    role: quality
  - name: teacher_gap
    direction: lower
    unit: score_gap
    role: quality_constraint
  - name: pretrain_ce_regression
    direction: lower
    unit: nats/token
    role: constraint
  - name: student_params_m
    direction: lower
    unit: million
    role: cost
  - name: student_tokens_per_s
    direction: higher
    unit: tokens/s
    role: cost_quality
  - name: peak_memory_gb
    direction: lower
    unit: GB
    role: cost
  - name: train_gpu_hours
    direction: lower
    unit: GPU-h
    role: cost
  dominance: quality dimensions maximize; cost dimensions minimize; constraint dimensions
    must pass before dominance
  aggregation: report full non-dominated set and hypervolume against server reference
    envelope
special_blockers:
- frozen_teacher_student_tokenizer_and_initialization_hash
- offline_distillation_corpus_and_capability_holdout
- server_training_and_inference_timer
activation: scaffold_only_until_real_reference_runs_and_hidden_eval_exist
objective_mode: pareto
resource_profile:
  sandbox_profile: posttrain_24gb
  hardware_class: single_gpu_24gb
  accelerator: RTX_4090_class
  accelerator_count: 1
  memory_gib: 24
  cost_unit: GPU-h
  leaderboard: budget
  limits:
    agent_dev: 3
    per_submission_verify: 1.5
    reference_precompute: 15
  sandbox:
    network: disabled
    filesystem: output_only
    hidden_inputs: server_only
    measurement: server_side
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
