  arxiv: '1503.02531'
  verify_before_freeze: true
task: On a fixed teacher, student initialization and offline text corpus, design a logit/feature/sequence-level distillation recipe that is Pareto-optimal over task quality, forgetting, student inference cost and training cost
metrics: Hidden capability-family quality; teacher gap; pretraining cross-entropy degradation; student parameter count; inference tokens/s; peak memory; training GPU-h Pareto
