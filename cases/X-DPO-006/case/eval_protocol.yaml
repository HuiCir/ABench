case_id: X-DPO-006
version: v2026.07
cutoff: '2026-07-01'
hardware:
  reference: single 24GB GPU unless CPU-only stage is explicitly stated
  software: benchmark manifest required; fixed container/CUDA/PyTorch
  timing: server-side wall clock and peak memory; median over fixed seeds
proxy:
  types:
  - SURG
  - SUBSET
  plan: Fixed ≤ 350M base and preference_pairs_v1; at most 5k training steps; DPO/IPO/KTO/ORPO reference recipes with 3 seeds, reviewed on hidden
    pairs and counterfactual prompts
  fidelity_gate: track-level calibration must reproduce at least 5 known pairwise
    orderings with >=80% agreement
budget:
  agent_dev_gpu_h: 4
  per_submission_verify_gpu_h: 2
  reference_precompute_gpu_h: 25
  budget_tier: medium
  submissions: 1
ladder:
  L0_smoke:
    visibility: agent
    checks:
    - interface
    - finite outputs
    - determinism
    - resource limits
    - no input mutation
  L1_proxy:
    visibility: agent
    settings: smallest documented proxy
  L2_main:
    visibility: benchmark
    settings: public validation split and fixed seeds
  L3_holdout:
    visibility: hidden
    settings: hidden lengths/shapes/capability families/duplicate clusters as appropriate
inputs:
  public: resources.yaml
  private: benchmark-side manifests and hidden split
  required_hashes: true
outputs:
  required:
  - manifest.json
  - run.jsonl
  - artifacts.sha256
  - metrics.json
  forbidden:
  - simulated_scores
  - fabricated_reference_runs
  - undeclared_network_access
metrics:
  objective: pareto_frontier
  dimensions:
  - name: preference_accuracy
    direction: higher
    unit: accuracy
    role: quality
  - name: reference_kl
    direction: lower
    unit: nats/token
    role: constraint
  - name: length_bias_abs
    direction: lower
    unit: tokens
    role: robustness
  - name: safety_pass_rate
    direction: higher
    unit: fraction
    role: constraint
  - name: train_gpu_hours
    direction: lower
    unit: GPU-h
    role: cost
  dominance: quality dimensions maximize; cost dimensions minimize; constraint dimensions
    must pass before dominance
  aggregation: report full non-dominated set and hypervolume against server reference
    envelope
special_blockers:
- frozen_base_and_reference_checkpoint_hash
- offline_preference_pairs_and_hidden_counterfactuals
- reference_runs_and_kl_length_evaluator
activation: scaffold_only_until_real_reference_runs_and_hidden_eval_exist
resource_profile:
  sandbox_profile: posttrain_24gb
  hardware_class: single_gpu_24gb
  accelerator: RTX_4090_class
  accelerator_count: 1
  memory_gib: 24
  cost_unit: GPU-h
  leaderboard: budget
  limits:
    agent_dev: {value: 4, unit: GPU-h}
    per_submission_verify: {value: 2, unit: GPU-h}
    reference_precompute: {value: 25, unit: GPU-h}
  sandbox:
    network: disabled
    filesystem: output_only
    hidden_inputs: server_only
    measurement: server_side
objective_mode: pareto
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
