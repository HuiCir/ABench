# Generic protocol scaffold; no simulated evaluation outputs.
case_id: PRO-SRV-005
version: v2026.07
cutoff: '2026-07-01'
hardware:
  reference: 4 × H100 80GB SXM (Pro; explicit resource_profile)
  software: benchmark manifest required
  timing: server-side wall clock; median over fixed seeds
proxy:
  types:
  - RERUN
  - EVAL
  plan: The benchmark reruns twice on hidden traffic traces, about 1 hour × 4 GPUs each; references are tuned vLLM and SGLang configurations
  fidelity_gate: track-level calibration must reproduce at least 5 known pairwise
    orderings with >=80% agreement
budget:
  agent_dev_gpu_h: 96
  per_submission_verify_gpu_h: 8
  reference_precompute_gpu_h: 16
  submissions: 1
ladder:
  L0_smoke:
    visibility: agent
    checks:
    - interface
    - finite outputs
    - determinism
    - resource limits
    - no input mutation
  L1_proxy:
    visibility: agent
    settings: smallest documented proxy
  L2_main:
    visibility: benchmark
    settings: public validation split and fixed seeds
  L3_holdout:
    visibility: hidden
    settings: scale/length/parameter/OOD holdout as appropriate
inputs:
  public: resources.yaml
  private: benchmark-side manifests and hidden split
  required_hashes: true
outputs:
  required:
  - manifest.json
  - run.jsonl
  - artifacts.sha256
  - metrics.json
  forbidden:
  - simulated_scores
  - fabricated_reference_runs
  - undeclared_network_access
special_blockers:
- 4xH100_scheduler_and_network_sandbox
- hidden_tasks_and_post_cutoff_eval
- hash_chain_and_1h_resume_audit
- pro_hardware_quota_and_resume_audit
- specific_anchor_or_citation_verification
activation: deferred until blocked_inputs are frozen and real reference runs exist
resource_profile:
  sandbox_profile: pro_4xh100
  hardware_class: 4xh100_80gb
  accelerator: H100_SXM
  accelerator_count: 4
  memory_gib: 80
  cost_unit: H100-h
  leaderboard: pro
  limits:
    agent_dev: {value: 96, unit: H100-h}
    per_submission_verify: {value: 12, unit: H100-h}
    reference_precompute: {value: 192, unit: H100-h}
  sandbox:
    network: allowlisted_hf_pip_only
    filesystem: output_only
    hidden_inputs: server_only
    measurement: server_side
