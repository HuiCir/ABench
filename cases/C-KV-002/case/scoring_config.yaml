# Scoring contract scaffold; calibrate coefficients before leaderboard use.
status: calibration_required
primary_metrics:
- KV compression ratio
- Long-context task quality
- End-to-end latency/throughput
- Peak memory
score:
  components:
  - quality
  - efficiency
  - resource
  - reproducibility
  formula: To be frozen by the benchmark operator based on a real calibration set
  gates:
    finite_outputs: true
    deterministic_replay: true
    resource_limits: true
    hidden_holdout_required: true
anti_simulation:
  reject_provenance:
  - mock
  - sim
  - simulated
  - demo
  - synthetic
  require_hashes:
  - config
  - code
  - data
  - runtime
  - outputs
# Shared multi-objective evaluation; formal coefficients are frozen after calibration.
objective_mode: pareto
pareto:
  axes:
    - id: quality
      metric: case_defined_task_quality
      direction: maximize
      unit: normalized_score
      required: true
      source: server
    - id: throughput
      metric: throughput_items_per_s
      direction: maximize
      unit: case_defined_per_s
      required: false
      source: server
    - id: peak_memory
      metric: peak_memory_mb
      direction: minimize
      unit: MiB
      required: false
      source: server
    - id: compute_cost
      metric: compute_cost_gpu_h
      direction: minimize
      unit: reference_h
      required: false
      source: server
    - id: stability
      metric: stable_success_rate
      direction: maximize
      unit: fraction
      required: true
      source: server
  feasibility:
    - metric: quality
      op: ">="
      threshold: reference_quality_floor
    - metric: compute_cost
      op: "<="
      threshold: declared_budget
  comparison:
    scope: same_case_same_hardware_same_budget_tier
    reference: reference_envelope
    unavailable_axis: null_and_exclude_from_frontier
    uncertainty: confidence_interval_then_noise_floor
  aggregation: empirical_frontier
  report: [frontier_points, normalized_hypervolume, knee_point, dominated_by_reference, confidence_intervals]
  tie_break: lower_compute_cost_then_lower_peak_memory_then_lower_variance
