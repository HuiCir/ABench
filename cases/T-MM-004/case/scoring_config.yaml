version: v0-scaffold
case_id: T-MM-004
objective: pareto_frontier
primary_metrics:
- name: retrieval_recall_at_10
  direction: higher
  unit: fraction
  role: quality
- name: compositional_recall_at_10
  direction: higher
  unit: fraction
  role: robustness
- name: trainable_params_m
  direction: lower
  unit: million
  role: cost
- name: peak_memory_gb
  direction: lower
  unit: GB
  role: cost
- name: inference_latency_ms
  direction: lower
  unit: ms/query
  role: cost
normalization:
  direction: per metric declaration
  baseline: server reference envelope
  aggregation: non-dominated set + normalized hypervolume; publish per-dimension values
gates:
- valid_run_manifest
- resource_and_time_budget
- finite_metrics
- deterministic_replay
- no_hidden_input_or_network_access
- quality_and_safety_constraints
pareto_policy:
  no_single_sota_gate: true
  constraint_fail: dominated_and_ineligible
  tie_break: lower total measured cost then lower variance
simulation_policy: 'none: this scaffold does not generate scores'
missing_real_artifacts: report pending rather than zeroing a fabricated score
deferred_due_to:
- frozen_vision_text_encoder_and_tokenizer_hash
- offline_image_text_bundle_and_hidden_compositions
- fixed_gpu_timer_and_retrieval_evaluator
objective_mode: pareto
resource_profile: single_gpu_24gb
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
pareto:
  axes:
  - id: retrieval_recall_at_10
    direction: maximize
    unit: fraction
    primary: true
  - id: compositional_recall_at_10
    direction: maximize
    unit: fraction
    primary: false
  - id: trainable_params_m
    direction: minimize
    unit: million
    primary: false
  - id: peak_memory_gb
    direction: minimize
    unit: GB
    primary: false
  - id: inference_latency_ms
    direction: minimize
    unit: ms/query
    primary: false
  feasibility:
  - metric: retrieval_recall_at_10
    op: '>='
    threshold: reference_quality_floor
  aggregation: empirical_frontier
  report:
  - frontier_points
  - hypervolume
  - knee_point
  - dominated_by_reference
