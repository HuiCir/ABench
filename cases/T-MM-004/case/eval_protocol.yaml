case_id: T-MM-004
version: v2026.07
cutoff: '2026-07-01'
hardware:
  reference: single 24GB GPU unless CPU-only stage is explicitly stated
  software: benchmark manifest required; fixed container/CUDA/PyTorch
  timing: server-side wall clock and peak memory; median over fixed seeds
proxy:
  types:
  - FROZEN
  - SUBSET
  plan: Frozen ≤ 150M vision/text encoders with offline captioned-images_v1; train only adapters/cross-attention/temperature, with hidden-category and compositional retrieval tests
  fidelity_gate: track-level calibration must reproduce at least 5 known pairwise
    orderings with >=80% agreement
budget:
  agent_dev_gpu_h: 3
  per_submission_verify_gpu_h: 1.5
  reference_precompute_gpu_h: 15
  budget_tier: medium
  submissions: 1
ladder:
  L0_smoke:
    visibility: agent
    checks:
    - interface
    - finite outputs
    - determinism
    - resource limits
    - no input mutation
  L1_proxy:
    visibility: agent
    settings: smallest documented proxy
  L2_main:
    visibility: benchmark
    settings: public validation split and fixed seeds
  L3_holdout:
    visibility: hidden
    settings: hidden lengths/shapes/capability families/duplicate clusters as appropriate
inputs:
  public: resources.yaml
  private: benchmark-side manifests and hidden split
  required_hashes: true
outputs:
  required:
  - manifest.json
  - run.jsonl
  - artifacts.sha256
  - metrics.json
  forbidden:
  - simulated_scores
  - fabricated_reference_runs
  - undeclared_network_access
metrics:
  objective: pareto_frontier
  dimensions:
  - name: retrieval_recall_at_10
    direction: higher
    unit: fraction
    role: quality
  - name: compositional_recall_at_10
    direction: higher
    unit: fraction
    role: robustness
  - name: trainable_params_m
    direction: lower
    unit: million
    role: cost
  - name: peak_memory_gb
    direction: lower
    unit: GB
    role: cost
  - name: inference_latency_ms
    direction: lower
    unit: ms/query
    role: cost
  dominance: quality dimensions maximize; cost dimensions minimize; constraint dimensions
    must pass before dominance
  aggregation: report full non-dominated set and hypervolume against server reference
    envelope
special_blockers:
- frozen_vision_text_encoder_and_tokenizer_hash
- offline_image_text_bundle_and_hidden_compositions
- fixed_gpu_timer_and_retrieval_evaluator
activation: scaffold_only_until_real_reference_runs_and_hidden_eval_exist
objective_mode: pareto
resource_profile:
  sandbox_profile: single_gpu_24gb
  hardware_class: single_gpu_24gb
  accelerator: RTX_4090_class
  accelerator_count: 1
  memory_gib: 24
  cost_unit: GPU-h
  leaderboard: budget
  limits:
    agent_dev: {value: 3, unit: GPU-h}
    per_submission_verify: {value: 1.5, unit: GPU-h}
    reference_precompute: {value: 15, unit: GPU-h}
  sandbox:
    network: disabled
    filesystem: output_only
    hidden_inputs: server_only
    measurement: server_side
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
