version: v0-scaffold
case_id: K-COMP-005
objective: pareto_frontier
primary_metrics:
- name: steady_tokens_per_second
  direction: higher
  unit: tokens/s
  role: quality
- name: compile_seconds
  direction: lower
  unit: s
  role: cost
- name: peak_memory_gb
  direction: lower
  unit: GB
  role: cost
- name: first_run_latency_ms
  direction: lower
  unit: ms
  role: cost
- name: max_abs_error
  direction: lower
  unit: absolute
  role: constraint
normalization:
  direction: per metric declaration
  baseline: server reference envelope
  aggregation: non-dominated set + normalized hypervolume; publish per-dimension values
gates:
- valid_run_manifest
- resource_and_time_budget
- finite_metrics
- deterministic_replay
- no_hidden_input_or_network_access
- quality_and_safety_constraints
pareto_policy:
  no_single_sota_gate: true
  constraint_fail: dominated_and_ineligible
  tie_break: lower total measured cost then lower variance
simulation_policy: 'none: this scaffold does not generate scores'
missing_real_artifacts: report pending rather than zeroing a fabricated score
deferred_due_to:
- fixed_torch_cuda_container_and_gpu_model
- operator_graphs_and_hidden_shapes
- server_timer_numeric_equivalence_checker
objective_mode: pareto
resource_profile: single_gpu_24gb
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
pareto:
  axes:
  - id: steady_tokens_per_second
    direction: maximize
    unit: tokens/s
    primary: true
  - id: compile_seconds
    direction: minimize
    unit: s
    primary: false
  - id: peak_memory_gb
    direction: minimize
    unit: GB
    primary: false
  - id: first_run_latency_ms
    direction: minimize
    unit: ms
    primary: false
  - id: max_abs_error
    direction: minimize
    unit: absolute
    primary: false
  feasibility:
  - metric: steady_tokens_per_second
    op: '>='
    threshold: reference_quality_floor
  aggregation: empirical_frontier
  report:
  - frontier_points
  - hypervolume
  - knee_point
  - dominated_by_reference
