case_id: K-COMP-005
version: v2026.07
cutoff: '2026-07-01'
hardware:
  reference: single 24GB GPU unless CPU-only stage is explicitly stated
  software: benchmark manifest required; fixed container/CUDA/PyTorch
  timing: server-side wall clock and peak memory; median over fixed seeds
proxy:
  types:
  - STREAM
  plan: 12 fixed Transformer/MLP operator graphs, 3 shape distributions; only the torch.compile/Inductor/Triton
    allowlist is permitted, no custom drivers or network dependencies
  fidelity_gate: track-level calibration must reproduce at least 5 known pairwise
    orderings with >=80% agreement
budget:
  agent_dev_gpu_h: 2
  per_submission_verify_gpu_h: 1
  reference_precompute_gpu_h: 10
  budget_tier: medium
  submissions: 1
ladder:
  L0_smoke:
    visibility: agent
    checks:
    - interface
    - finite outputs
    - determinism
    - resource limits
    - no input mutation
  L1_proxy:
    visibility: agent
    settings: smallest documented proxy
  L2_main:
    visibility: benchmark
    settings: public validation split and fixed seeds
  L3_holdout:
    visibility: hidden
    settings: hidden lengths/shapes/capability families/duplicate clusters as appropriate
inputs:
  public: resources.yaml
  private: benchmark-side manifests and hidden split
  required_hashes: true
outputs:
  required:
  - manifest.json
  - run.jsonl
  - artifacts.sha256
  - metrics.json
  forbidden:
  - simulated_scores
  - fabricated_reference_runs
  - undeclared_network_access
metrics:
  objective: pareto_frontier
  dimensions:
  - name: steady_tokens_per_second
    direction: higher
    unit: tokens/s
    role: quality
  - name: compile_seconds
    direction: lower
    unit: s
    role: cost
  - name: peak_memory_gb
    direction: lower
    unit: GB
    role: cost
  - name: first_run_latency_ms
    direction: lower
    unit: ms
    role: cost
  - name: max_abs_error
    direction: lower
    unit: absolute
    role: constraint
  dominance: quality dimensions maximize; cost dimensions minimize; constraint dimensions
    must pass before dominance
  aggregation: report full non-dominated set and hypervolume against server reference
    envelope
special_blockers:
- fixed_torch_cuda_container_and_gpu_model
- operator_graphs_and_hidden_shapes
- server_timer_numeric_equivalence_checker
activation: scaffold_only_until_real_reference_runs_and_hidden_eval_exist
resource_profile:
  sandbox_profile: single_gpu_24gb
  hardware_class: single_gpu_24gb
  accelerator: RTX_4090_class
  accelerator_count: 1
  memory_gib: 24
  cost_unit: GPU-h
  leaderboard: budget
  limits:
    agent_dev: {value: 2, unit: GPU-h}
    per_submission_verify: {value: 1, unit: GPU-h}
    reference_precompute: {value: 10, unit: GPU-h}
  sandbox:
    network: disabled
    filesystem: output_only
    hidden_inputs: server_only
    measurement: server_side
objective_mode: pareto
spec_refs:
- spec/pareto_protocol.md
- spec/sandbox_profiles.md
