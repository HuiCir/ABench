schema: abench.env_profiles/v1
status: pinned-build-inputs
profiles:
  cpu-sci:
    python: 3.11.13
    packages:
      numpy: 2.2.6
      scipy: 1.15.3
      scikit-learn: 1.6.1
      pyyaml: 6.0.2
      joblib: 1.5.1
      threadpoolctl: 3.6.0
    hardware: 8 CPU cores, no GPU
    version: '2026.10'
    base: python:3.11.13-slim-bookworm
  gpu-torch:
    python: 3.11.13
    packages:
      torch: 2.8.0
      triton: 3.4.0
      numpy: 2.2.6
      scipy: 1.15.3
      scikit-learn: 1.6.1
      pyyaml: 6.0.2
      safetensors: 0.6.2
    hardware: one RTX 4090-class 24 GB GPU; driver and CUDA runtime recorded in the
      lock
    version: '2026.10'
    base: python:3.11.13-slim-bookworm
  gpu-torch-hf:
    extends: gpu-torch
    packages:
      transformers: 4.55.4
      tokenizers: 0.21.4
      safetensors: 0.6.2
      torchaudio: 2.8.0
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    version: '2026.10'
    python: 3.11.13
  gpu-torch-diffusion:
    extends: gpu-torch
    packages:
      scipy: 1.15.3
      diffusers: 0.35.1
      pytorch-fid: 0.3.0
    env:
      HF_HUB_OFFLINE: '1'
    note: pytorch-fid's Inception weights (pt_inception-2015-12-05-6726825d.pth) are
      frozen into the models dir, not downloaded
    version: '2026.10'
    python: 3.11.13
  gpu-torch-sim:
    extends: gpu-torch
    packages:
      gymnasium: 0.29.1
      gym-pusht: 0.1.5
    version: '2026.10'
    python: 3.11.13
  gpu-torch-cuda-dev:
    extends: gpu-torch
    packages:
      ninja: 1.11.1.4
    system: CUDA toolkit (nvcc) matching torch.version.cuda, for torch.utils.cpp_extension.load_inline
    version: '2026.10'
    python: 3.11.13
    base: nvidia/cuda:12.8.1-devel-ubuntu24.04
  pro-h100:
    python: 3.11.13
    packages:
      torch: 2.8.0
      triton: 3.4.0
      numpy: 2.2.6
      scipy: 1.15.3
      pyyaml: 6.0.2
      transformers: 4.55.4
      safetensors: 0.6.2
    hardware: one node, 4 x H100 80GB SXM with NVLink; NCCL version recorded in the
      lock
    version: '2026.10'
    base: python:3.11.13-slim-bookworm
