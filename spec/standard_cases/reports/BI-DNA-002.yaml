case: BI-DNA-002
title: 'k-mer Spectrum with Ridge Regression: An Alignment-Free Baseline for Regulatory Element Classification'
abstract: This submission gives an alignment-free baseline for three Genomic Benchmarks tasks [@gresova2023genomic]. Each
  sequence is represented by its normalised k-mer spectrum for k = 1 to 6, in the spirit of the spectrum kernel [@leslie2002spectrum],
  log-scaled and standardised, and a linear classifier is fitted per dataset by ridge regression in closed form, with the
  regulariser chosen on a seeded validation split. The baseline is position-free by construction; the anchor's long-convolution
  model [@nguyen2023hyenadna] shows how position-aware, single-nucleotide models go further.
sections:
- title: Introduction
  paras:
  - Regulatory elements such as promoters, enhancers and open chromatin are recognisable partly by composition (GC content,
    CpG islands, short motifs) and partly by the arrangement of motifs. A k-mer spectrum captures the first part and is a
    standard baseline; whatever entries gain over it measures how much positional and long-range structure their models exploit.
- title: Related Work
  paras:
  - The spectrum kernel compares sequences through the counts of their length-k substrings [@leslie2002spectrum]. Convolutional
    networks learn motif detectors directly [@alipanahi2015deepbind], and HyenaDNA uses implicit long convolutions to process
    sequences at single-nucleotide resolution [@nguyen2023hyenadna].
  - HyenaDNA models long-range order at single-nucleotide resolution after pretraining; k-mer spectra capture composition
    only; this reference is the latter and leaves positional and long-range structure as the gap.
- title: Method
  subsections:
  - title: Features and classifier
    paras:
    - For each k in 1..6, all k-mers containing only A, C, G or T are counted and divided by the number of such k-mers, giving
      5,460 frequencies per sequence; values are mapped by log(1 + 1000 f) and standardised. A bias is appended and weights
      solve the ridge problem to ±1 targets; λ ∈ {10, 100, 1000, 10000} is chosen on a 10% split of the training data drawn
      with the seed, and the final weights are refitted on all training data.
    algorithm_caption: Training for one dataset
    algorithm:
    - F ← standardise(log(1 + 1000 · spectrum_{1..6}(seq)));  append 1
    - split train / validation (10%) with the seed
    - λ* ← argmax over λ of validation accuracy of (F_trᵀF_tr + λI)^{-1}F_trᵀt_tr
    - w ← (FᵀF + λ*I)^{-1}Fᵀt;  p(1 | seq) = σ(2 F(seq) w)
  - title: Complexity
    paras:
    - Spectrum extraction is O(L · 6) per sequence of length L. With d = 5,461 features, forming FᵀF costs O(n d²) and solving
      O(d³); prediction is O(L + d) per sequence.
- title: Design Rationale
  paras:
  - Frequencies rather than counts make sequences of different lengths comparable, and the log map compresses the heavy tail
    of frequent short k-mers so that informative 5- and 6-mers are not drowned out. Including all k from 1 to 6 lets the linear
    model combine composition with short motifs.
- title: Scope and Limitations
  paras:
  - The representation discards motif positions, spacing and strand, and longer motifs are only seen through their 6-mer pieces;
    learned position-aware models address these limits.
