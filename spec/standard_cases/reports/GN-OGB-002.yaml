- text: Fixed SGC propagation of standardised features (depths 0, 1, 2, concatenated) replaces the anchor's trained GNN baselines.
  code: 'model.py: adjacency, features'
- text: A closed-form one-vs-rest ridge readout with the strength selected on validation nodes replaces gradient training.
  code: 'train.py: main'
