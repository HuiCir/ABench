changes:
- text: One histogram gradient-boosted model per dataset with early stopping replaces the anchor's multi-layer stack of model
    families.
  code: 'train.py: fit_one'
- text: Missing values are routed by the booster natively instead of the anchor's per-type preprocessing.
  code: 'train.py: fit_one (HistGradientBoostingClassifier)'
- text: Fitted models are pickled per dataset and selected by dataset id at prediction time.
  code: 'model.py: load, predict_proba'
