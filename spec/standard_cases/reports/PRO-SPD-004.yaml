changes:
- text: 'Over-training instead of a compute-optimal budget: 454M parameters for about 3.2B tokens (6,100 × 524,288).'
  code: 'train.py: main (--steps)'
- text: Muon with Newton–Schulz orthogonalisation and bf16 weights with a separate uint16 mantissa for the hidden matrices;
    Adam for embeddings, head and scalars; stable-then-linear-decay schedule with a 70% cool-down.
  code: 'train.py: Muon, update, main'
- text: 'Record architecture: QK-normalised attention with half-truncated rotary embeddings, three value-embedding tables
    in a 012…012 pattern, U-net skip connections, ReLU² MLP, no attention in layer 7, soft-capped logits, document-masked
    long-short sliding windows grown with a cubic schedule.'
  code: 'model.py: GPT, CausalSelfAttention, Block, create_blockmasks'
- text: 'Four GPUs with the record''s global batch: 8 / W micro-steps per rank, gradients averaged before the Muon and Adam
    steps.'
  code: 'train.py: train_step, GLOBAL_MICRO'
- text: 6,100 steps instead of 5,960 for margin under the target and for the ABench evaluation windows.
  code: 'train.py: main (--steps default)'
- text: 'Evaluation interface: model(idx) returns soft-capped logits for one window with the final attention window; FlexAttention
    compiled on its own so the uncompiled module can be evaluated.'
  code: 'model.py: GPT.forward, build_model, flex_attention_compiled'
