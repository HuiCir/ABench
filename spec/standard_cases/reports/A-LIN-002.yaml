changes:
- text: A full-rank gate projection replaces the anchor's low-rank gate.
  code: 'mixer.py: Mixer.__init__ (g)'
- text: No normalisation of the output before gating, and fp32 computation inside the layer.
  code: 'mixer.py: Mixer.forward'
- text: Chunkwise-parallel computation with chunk size 64 in plain PyTorch instead of the anchor's Triton kernels.
  code: 'mixer.py: Mixer.forward (chunks)'
