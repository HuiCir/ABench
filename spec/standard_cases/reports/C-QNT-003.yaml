- text: Asymmetric 4-bit round-to-nearest per group of 128 input channels with fp16 scales and zero points; no calibration
    and no error compensation, unlike the anchor.
  code: 'quantize.py: _q, _dq'
- text: The tied embedding is quantized as well, so the whole model fits the 4.25-bit budget.
