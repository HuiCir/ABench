- text: Retrieval of the five nearest demonstration frames in standardised keypoint space replaces the anchor's diffusion
    action head.
  code: 'policy.py: _Policy.act (nearest neighbours)'
- text: The average of the neighbours' next eight actions is executed open loop before the next query.
  code: 'policy.py: _Policy.act (queue); train.py: main (chunks)'
