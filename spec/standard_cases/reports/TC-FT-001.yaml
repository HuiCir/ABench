changes:
- text: A sparse linear model over hashed unigram and bigram counts replaces the anchor's averaged learned embeddings, so
    there is no embedding layer and no vocabulary.
  code: 'model.py: vectorizer, predict'
- text: Sublinear tf and idf weighting with L2 normalisation of each document, which the anchor does not use.
  code: 'train.py: main (TfidfTransformer); model.py: predict'
- text: Averaged SGD on the modified Huber loss replaces the anchor's softmax trained with SGD and a hierarchical softmax
    option.
  code: 'train.py: main (SGDClassifier)'
