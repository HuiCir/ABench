case: TC-FT-001
title: 'Hashed n-gram Linear Classifier: A CPU Baseline for Review-Rating Classification'
author_note: Standard reference for task statement standard v2.1 (a baseline that does not aim to be best)
abstract: This submission gives a baseline for CPU-budgeted review-rating classification. Following the anchor's observation
  that a linear model over a bag of n-grams is a strong and fast text classifier [@joulin2017fasttext], documents are mapped
  to a fixed 2^20-dimensional space of unigram and bigram counts with the hashing trick [@weinberger2009hashing], re-weighted
  with sublinear tf-idf [@salton1988tfidf], and classified by a linear model trained with stochastic gradient descent on the
  modified Huber loss [@zhang2004sgd] with iterate averaging [@polyak1992averaging]. Training is a single streaming pass structure
  with no vocabulary to build, and prediction is one sparse matrix product.
sections:
- title: Introduction
  paras:
  - The task rewards accuracy under a minimum prediction throughput on eight CPU cores, with the model trained once in the
    sandbox. Both favour models whose cost is linear in the number of tokens and whose parameters fit in memory without a
    vocabulary pass. Bag-of-n-gram linear models satisfy both and are known to be competitive with much larger neural encoders
    on topic and review-rating classification (the anchor reports 63.9% on Yelp Review Full with bigrams) [@joulin2017fasttext;@zhang2015charcnn].
  - As a reference version this submission uses only mature components; its purpose is to be complete in interface, timing
    and report format and to leave the room for improvement to the entries.
- title: Related Work
  paras:
  - fastText represents a document by the average of learned embeddings of its words and hashed bigrams and trains a linear
    softmax classifier on top [@joulin2017fasttext]. The hashing trick maps an unbounded feature set into a fixed number of
    buckets with a hash function, trading a small collision rate for constant memory and no vocabulary construction [@weinberger2009hashing].
    Term weighting with inverse document frequency down-weights ubiquitous tokens [@salton1988tfidf].
  - Neither fastText's learned embeddings nor the hashing and weighting components address prediction throughput directly;
    this reference keeps the anchor's bag of n-grams but drops the learned embedding layer, which leaves a gap in word-similarity
    modelling that entries can close.
- title: Method
  subsections:
  - title: Features
    paras:
    - Each document is lower-cased and split into word tokens; unigrams and adjacent bigrams are hashed into 2^20 non-negative
      count features. Counts are transformed to 1 + log(tf) and multiplied by an inverse document frequency estimated on the
      training documents only, then each row is L2-normalised.
  - title: Classifier
    paras:
    - A one-vs-rest linear classifier is trained by stochastic gradient descent on the modified Huber loss, which is a smoothed
      hinge loss with bounded gradients [@zhang2004sgd], with an L2 penalty of 2e-6 and 15 epochs. The averaged iterate is
      used for prediction, which reduces the variance of the final SGD iterate [@polyak1992averaging]. The implementation
      uses scikit-learn [@pedregosa2011sklearn].
    algorithm_caption: Training and prediction
    algorithm:
    - '**fit**(texts, labels, seed):'
    - '  C ← HashCounts(texts)  `# sparse N × 2^20, unigrams and bigrams`'
    - '  learn idf on C; X ← l2norm((1 + log C) ⊙ idf)'
    - '  W ← averaged SGD on modified Huber loss over X, labels (seed fixes the order)'
    - '**predict**(texts): return argmax over classes of l2norm(tfidf(HashCounts(texts))) W'
  - title: Complexity
    paras:
    - With T tokens in the training set, featurisation costs O(T) and each SGD epoch O(nnz(X)) = O(T); memory is O(nnz(X)
      + 4 · 2^20) for the data and the weights. Prediction costs O(T') for T' held-out tokens.
- title: Design Rationale
  paras:
  - Hashing removes the vocabulary pass and bounds memory, which matters more on a CPU budget than the small loss from collisions
    at 2^20 buckets. Sublinear tf and idf weighting make a linear model less sensitive to document length and to frequent
    function words. The modified Huber loss keeps the robustness of the hinge loss while allowing probability-like scores,
    and averaging makes the result less sensitive to the learning-rate schedule.
- title: Scope and Limitations
  paras:
  - The model has no notion of word similarity beyond shared n-grams and cannot use subword information; both are natural
    directions for entries, as are learned low-dimensional embeddings in the style of the anchor.
