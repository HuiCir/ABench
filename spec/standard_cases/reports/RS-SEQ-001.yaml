changes:
- text: First-order transition counts between consecutive items replace the anchor's self-attention over the history.
  code: 'train.py: main (transition counts); model.py: recommend'
- text: A 90-day time-decayed popularity prior is added to every score, which the anchor does not have.
  code: 'train.py: main (decayed popularity)'
- text: Items already in the user's history are excluded from the ranking.
  code: 'model.py: recommend'
