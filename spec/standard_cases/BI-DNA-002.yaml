id: BI-DNA-002
title: Genomic sequence classification on three Genomic Benchmarks datasets
anchor:
  authors: Eric Nguyen, Michael Poli, Marjan Faizi, Armin Thomas, Callum Birch-Sykes, Michael Wornow, Aman Patel, Clayton
    Rabideau, Stefano Massaroli, Yoshua Bengio, Stefano Ermon, Stephen A. Baccus, Chris Ré
  title: 'HyenaDNA: Long-Range Genomic Sequence Modeling at Single Nucleotide Resolution'
  arxiv: '2306.15794'
baseline: k-mer spectrum features with a closed-form ridge classifier (`example_submission/`)
reference_verification: The reference submission and the whole pipeline (dev split, stage runner, metrics) run end to end
  on synthetic data in tests/test_standard_cases.py. Nothing has been run on the real frozen data yet.
n_seeds: 1
task: |
  Design one DNA sequence model that reaches the **highest mean test accuracy** on three human regulatory-element classification tasks from Genomic Benchmarks: non-TATA promoters, enhancers (Cohn et al.) and open chromatin regions (Ensembl). Develop and train it on one 24GB GPU in the sandbox, then submit the trained models.

  - Submit your model code, the trained checkpoint (covering all three datasets) and the training program that produced it. The evaluator loads the checkpoint and classifies each official test split; it never retrains.
  - Only the provided sequences may be used: no pretrained genomic language models (including HyenaDNA checkpoints), no reference genome or other external data.
  - You may build on any public work from before the cutoff (convolutional, long-convolution, state-space, attention or k-mer models; tokenisation at nucleotide or k-mer level), but the design report must state what you borrowed and what you changed.
data: |
  `$ABENCH_DATA_DIR/<name>.npz` (read-only), official train splits of Genomic Benchmarks (Grešová et al. 2023):

  | File | Train sequences | Held-out (test) sequences | Classes |
  |---|---|---|---|
  | `human_nontata_promoters.npz` | 27,097 | 9,034 | 2 (251 bp) |
  | `human_enhancers_cohn.npz` | 20,843 | 6,948 | 2 |
  | `human_ocr_ensembl.npz` | 139,804 | 34,952 | 2 |

  Each file has `seq` (N,) strings over A, C, G, T and N, `y` (N,) int64 0/1, and `dev_idx` (10% per class, used only by `selfcheck.py`). Sequence lengths vary within the enhancer and open-chromatin datasets. The test splits are not in the sandbox.
interface: Implement `load(checkpoint_dir, device)` and `predict(model, name, seqs)` in `model.py`. `predict` returns (M,
  2) class scores for the list of sequences `seqs` of dataset `name`. Your `train.py` writes `checkpoint/` from the files
  above.
metrics: |
  | Metric | Definition | Requirement |
  |---|---|---|
  | **Mean accuracy** (primary) | Test accuracy of argmax(scores) per dataset (the Genomic Benchmarks metric), averaged over the 3 datasets; higher is better | — |
  | Per-dataset accuracy and ROC AUC | Reported for each dataset | reported |
  | Load time | Seconds from the start signal to the return of `load()` (includes importing `model.py`) | reported (killed at 120 s) |


  No threshold applies to any metric: a submission is valid if it loads, runs within the time limits and returns well-formed outputs (see below).
  **Timing and decision**

  - Loading and prediction run in a new process with empty cache directories, on the same GPU model, timed by the evaluator's parent process (`interface/abench_stage.py`); creating the CUDA context is not timed. `predict()` runs after the timed phase; the three test splits must be classified within 120 seconds.
  - If loading or prediction crashes, exceeds a time limit, or returns scores of the wrong shape or non-finite values, the submission is invalid; valid submissions are ranked by mean accuracy.
  - The final ABench score is driven mainly by mean accuracy, and also considers how different the method is from existing methods and the quality of the sources cited in the design report; the exact weights are not published.
hardware:
  kind: gpu
  session_hours: 3
  dev_budget: 4 GPU-hours
  notes: |
    - Sequences are Python strings; batch them into integer tensors yourself. Lengths differ within two of the datasets.
    - The self-check scores your checkpoint on the dev sequences (`dev_idx`) of each dataset. Leave them out of training (the reference `train.py` does by default) if you want an unbiased estimate; you may include them in the final checkpoint.
deliverables:
  tree: |
    $ABENCH_SUBMISSION_DIR/
    ├── model.py            # required: load() and predict()
    ├── train.py            # required: the program that produced checkpoint/ (kept for audit, not run by the evaluator)
    ├── checkpoint/         # required: trained parameters, any file types, at most 500 MB
    ├── src/                # optional: other .py modules imported by model.py or train.py
    ├── README.md           # optional
    ├── report/index.html   # required: design report
    └── references.yaml     # required: reference register
  notes: |
    - Outside `checkpoint/`, files may only be `.py`, `.yaml`, `.yml`, `.md` and `.txt`, at most 200,000 bytes in total.
rules: |
  - The checkpoint must be produced by your `train.py` from the provided data only, inside the sandbox; no pretrained weights, no external data and no hand-set parameters copied from elsewhere.
  - The evaluator loads `checkpoint/` with your model code and runs inference only; it does not run `train.py`, which is kept for audit and must reproduce the checkpoint up to randomness.
  - No pretrained weights, reference genome or external data.
  - `predict()` must classify each sequence independently, without adapting to the test split.
interface_md: |
  # BI-DNA-002 interface

  ## Entry point: `model.py`

  ```python
  def load(checkpoint_dir: str, device: str):
      """Load your trained classifiers for the three datasets from checkpoint/ (any Python object). device is "cuda" at evaluation."""

  def predict(model, name: str, seqs: list[str]) -> numpy.ndarray:
      """name in ("human_nontata_promoters", "human_enhancers_cohn", "human_ocr_ensembl"); seqs over {A, C, G, T, N}.
      Return float (len(seqs), 2) class scores."""
  ```

  - `model.py` may import modules under `src/`; the submission directory is on `sys.path`.

  ## Training program: `train.py`

  Write a `train.py` that produces `checkpoint/` from the files in `$ABENCH_DATA_DIR` (one `<dataset>.npz` per dataset with `seq`, `y` and `dev_idx`), for example
  `python3 train.py --data "$ABENCH_DATA_DIR" --out "$ABENCH_SUBMISSION_DIR/checkpoint"`. The evaluator does not run it;
  it is kept with the submission so the checkpoint can be audited and reproduced. The reference implementation under
  `interface/baseline/` (its `model.py` and `train.py`) is a working starting point you may improve on or replace.

  ## Evaluator code you can read

  `stages.py` (pipeline, dev split, time limits), `metrics.py` and `abench_metrics.py` (accuracy, AUC),
  `abench_stage.py` (process and timing protocol) and `selfcheck.py`.

  ## Available software

  Python 3, PyTorch (CUDA, Triton), NumPy, SciPy. Nothing can be installed.
oj:
  agent_budget:
    gpu_hours: 4.0
    session_hours: 3.0
  data:
    public_dir: sandbox/data/BI-DNA-002
    public:
    - path: sandbox/data/BI-DNA-002/human_nontata_promoters.npz
      sha256: pending
      rows: 27097
    - path: sandbox/data/BI-DNA-002/human_enhancers_cohn.npz
      sha256: pending
      rows: 20843
    - path: sandbox/data/BI-DNA-002/human_ocr_ensembl.npz
      sha256: pending
      rows: 139804
    hidden:
      path: sandbox/hidden/BI-DNA-002/hidden.npz.enc
      sha256_plain: pending
    sources:
    - name: Genomic Benchmarks (Grešová et al. 2023, BMC Genomic Data, doi:10.1186/s12863-023-01123-8)
      url: https://github.com/ML-Bioinfo-CEITEC/genomic_benchmarks
      mirror: https://huggingface.co/datasets/katarinagresova/Genomic_Benchmarks_<name> (revisions pinned in tools/prepare/bi_dna_002.py)
      license: Apache-2.0 on the upstream repository; the Hugging Face mirrors state no license
      verified: '2026-10-19: repository license, dataset list and nontata promoter sizes from GitHub; revisions, files, columns
        and split sizes of the three mirrors from the Hugging Face API'
  submission:
    kind: code_plus_checkpoint
    entry: model.py
    checkpoint_dir: checkpoint
    allowed_top_level:
    - README.md
    - model.py
    - train.py
    - checkpoint
    - src
    - report
    - references.yaml
    code_suffixes:
    - .py
    - .yaml
    - .yml
    - .md
    - .txt
    code_max_bytes: 200000
    max_bytes: 526288000
    checkpoint_max_bytes: 524288000
    required_files:
    - train.py
  judge:
    device: cuda
    reference_gpu: RTX 4090-class 24GB (model, driver, CUDA and torch versions frozen at activation)
    seeds:
    - 2306
mode: checkpoint
