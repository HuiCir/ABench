id: MD-MNIST-003
title: Lightweight medical image classification on BloodMNIST and OrganAMNIST
anchor:
  authors: Jiancheng Yang, Rui Shi, Donglai Wei, Zequan Liu, Lin Zhao, Bilian Ke, Hanspeter Pfister, Bingbing Ni
  title: MedMNIST v2 - A large-scale lightweight benchmark for 2D and 3D biomedical image classification
  arxiv: '2110.14795'
baseline: random ReLU features with a closed-form ridge classifier (`example_submission/`)
reference_verification: The reference submission and the whole pipeline (dev split, stage runner, metrics) run end to end
  on synthetic data in tests/test_standard_cases.py. Nothing has been run on the real frozen data yet.
n_seeds: 1
task: |
  Design one image classification method that reaches the **highest mean test accuracy** on two 28×28 MedMNIST datasets: blood-cell microscopy (8 classes, RGB) and abdominal CT organ slices (11 classes, grayscale). Develop and train it on one 24GB GPU in the sandbox, then submit the trained models.

  - Submit your model code, the trained checkpoint (covering both datasets) and the training program that produced it. The evaluator loads the checkpoint and classifies each official test split; it never retrains.
  - Only the provided images may be used: no pretrained weights and no external data. The same method must serve both datasets (dataset-specific heads or settings chosen by your code from the data are fine).
  - You may build on any public work from before the cutoff, but the design report must state what you borrowed and what you changed. MedMNIST is for research on lightweight models; it is **not** intended for clinical use.
data: |
  `$ABENCH_DATA_DIR/blood.npz` and `$ABENCH_DATA_DIR/organa.npz` (read-only), the official 28×28 releases of BloodMNIST and OrganAMNIST (MedMNIST, Zenodo record 10519652, CC BY 4.0):

  | Key | Shape | Type | Description |
  |---|---|---|---|
  | `x_train`, `x_val` | (N, 28, 28, 3) blood; (N, 28, 28) organa | uint8 | Images, official train and validation splits |
  | `y_train`, `y_val` | (N,) | int64 | Classes 0–7 (blood) or 0–10 (organa) |

  The held-out sets are the official test splits; they are not in the sandbox. The self-check uses the validation split as its held-out set.
interface: Implement `load(checkpoint_dir, device)` and `predict(model, name, x)` in `model.py`. `predict` returns (M, n_classes)
  class scores for the images `x` of dataset `name` (`"blood"` or `"organa"`). Your `train.py` writes `checkpoint/` from the
  arrays above.
metrics: |
  | Metric | Definition | Requirement |
  |---|---|---|
  | **Mean accuracy** (primary) | Test accuracy of argmax(scores), averaged over the two datasets; higher is better | — |
  | Mean AUC | Macro one-vs-rest ROC AUC per dataset, averaged over datasets (the MedMNIST v2 metrics are AUC and ACC) | reported |
  | Load time | Seconds from the start signal to the return of `load()` (includes importing `model.py`) | reported (killed at 120 s) |


  No threshold applies to any metric: a submission is valid if it loads, runs within the time limits and returns well-formed outputs (see below).
  **Timing and decision**

  - Loading and prediction run in a new process with empty cache directories, on the same GPU model, timed by the evaluator's parent process (`interface/abench_stage.py`); creating the CUDA context is not timed. `predict()` runs after the timed phase; both test splits must be classified within 60 seconds.
  - If loading or prediction crashes, exceeds a time limit, or returns scores of the wrong shape or non-finite values, the submission is invalid; valid submissions are ranked by mean accuracy.
  - The final ABench score is driven mainly by mean accuracy, and also considers how different the method is from existing methods and the quality of the sources cited in the design report; the exact weights are not published.
hardware:
  kind: gpu
  session_hours: 3
  dev_budget: 1 GPU-hour
  notes: |
    - The self-check scores your checkpoint on the official validation split. Train without it (the reference `train.py` does by default and selects on a slice of the train split) if you want an unbiased dev estimate; you may use it in the final checkpoint.
deliverables:
  tree: |
    $ABENCH_SUBMISSION_DIR/
    ├── model.py            # required: load() and predict()
    ├── train.py            # required: the program that produced checkpoint/ (kept for audit, not run by the evaluator)
    ├── checkpoint/         # required: trained parameters, any file types, at most 500 MB
    ├── src/                # optional: other .py modules imported by model.py or train.py
    ├── README.md           # optional
    ├── report/index.html   # required: design report
    └── references.yaml     # required: reference register
  notes: |
    - Outside `checkpoint/`, files may only be `.py`, `.yaml`, `.yml`, `.md` and `.txt`, at most 200,000 bytes in total.
rules: |
  - The checkpoint must be produced by your `train.py` from the provided data only, inside the sandbox; no pretrained weights, no external data and no hand-set parameters copied from elsewhere.
  - The evaluator loads `checkpoint/` with your model code and runs inference only; it does not run `train.py`, which is kept for audit and must reproduce the checkpoint up to randomness.
  - No pretrained weights, external data.
  - `predict()` must not update the model on the test images (no test-time training or statistics pooled across the test split).
interface_md: |
  # MD-MNIST-003 interface

  ## Entry point: `model.py`

  ```python
  def load(checkpoint_dir: str, device: str):
      """Load your trained classifiers for both datasets from checkpoint/ (any Python object). device is "cuda" at evaluation."""

  def predict(model, name: str, x: numpy.ndarray) -> numpy.ndarray:
      """name is "blood" (8 classes, x uint8 (M, 28, 28, 3)) or "organa" (11 classes, x uint8 (M, 28, 28));
      return float (M, n_classes) scores."""
  ```

  - Class indices follow the MedMNIST label dictionaries of each dataset.
  - `model.py` may import modules under `src/`; the submission directory is on `sys.path`.

  ## Training program: `train.py`

  Write a `train.py` that produces `checkpoint/` from the files in `$ABENCH_DATA_DIR` (`blood.npz`, `organa.npz`: `x_train`, `y_train`, `x_val`, `y_val`), for example
  `python3 train.py --data "$ABENCH_DATA_DIR" --out "$ABENCH_SUBMISSION_DIR/checkpoint"`. The evaluator does not run it;
  it is kept with the submission so the checkpoint can be audited and reproduced. The reference implementation under
  `interface/baseline/` (its `model.py` and `train.py`) is a working starting point you may improve on or replace.

  ## Evaluator code you can read

  `stages.py` (pipeline, dev split, time limits), `metrics.py` and `abench_metrics.py` (accuracy and AUC),
  `abench_stage.py` (process and timing protocol) and `selfcheck.py`.

  ## Available software

  Python 3, PyTorch (CUDA, Triton), NumPy, SciPy. Nothing can be installed.
oj:
  agent_budget:
    gpu_hours: 1.0
    session_hours: 3.0
  data:
    public_dir: sandbox/data/MD-MNIST-003
    public:
    - path: sandbox/data/MD-MNIST-003/blood.npz
      sha256: pending
    - path: sandbox/data/MD-MNIST-003/organa.npz
      sha256: pending
    hidden:
      path: sandbox/hidden/MD-MNIST-003/hidden.npz.enc
      sha256_plain: pending
      keys:
      - x_test_blood
      - y_test_blood
      - x_test_organa
      - y_test_organa
    sources:
    - name: MedMNIST (Yang et al. 2023), Zenodo record 10519652 (MedMNIST+ v3.0)
      url: https://zenodo.org/records/10519652
      files:
        bloodmnist.npz: md5 7053d0359d879ad8a5505303e11de1dc
        organamnist.npz: md5 68e3f8846a6bd62f0c9bf841c0d9eacc
      license: CC BY 4.0 (DermaMNIST, CC BY-NC 4.0, is not used); not intended for clinical use
      verified: '2026-10-19: record version, license notes, file names and md5 checksums read from zenodo.org/record/10519652'
  submission:
    kind: code_plus_checkpoint
    entry: model.py
    checkpoint_dir: checkpoint
    allowed_top_level:
    - README.md
    - model.py
    - train.py
    - checkpoint
    - src
    - report
    - references.yaml
    code_suffixes:
    - .py
    - .yaml
    - .yml
    - .md
    - .txt
    code_max_bytes: 200000
    max_bytes: 526288000
    checkpoint_max_bytes: 524288000
    required_files:
    - train.py
  judge:
    device: cuda
    reference_gpu: RTX 4090-class 24GB (model, driver, CUDA and torch versions frozen at activation)
    seeds:
    - 2110
mode: checkpoint
