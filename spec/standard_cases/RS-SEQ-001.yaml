id: RS-SEQ-001
title: Next-item recommendation on MovieLens-1M
anchor:
  authors: Wang-Cheng Kang, Julian McAuley
  title: Self-Attentive Sequential Recommendation
  arxiv: '1808.09781'
baseline: first-order item transitions blended with time-decayed popularity (`example_submission/`)
reference_verification: The reference submission and the whole pipeline (dev split, stage runner, metrics) run end to end
  on synthetic data in tests/test_standard_cases.py. Nothing has been run on the real frozen data yet.
n_seeds: 1
leak_allow:
- ranking
task: |
  Design a sequential recommendation model that ranks every user's **next item** as high as possible among all items (full ranking, leave-one-out). Develop and train it on one 24GB GPU in the sandbox, then submit the trained model.

  - Submit your model code, the trained checkpoint and the training program that produced it. The evaluator loads the checkpoint and calls `recommend()` with every user's public history; it never retrains.
  - Only the provided interaction histories may be used: no pretrained weights, movie metadata, ratings values from outside the file, or external data.
  - You may build on any public work (self-attentive, recurrent or convolutional sequence models, factorised Markov chains, graph models), but the design report must state what you borrowed and what you changed.
data: |
  `$ABENCH_DATA_DIR/train.npz` (read-only), from MovieLens-1M (Harper & Konstan 2015): all 1,000,209 ratings of 6,040 users are treated as implicit interactions, ordered by timestamp (ties by item id), with **each user's final interaction removed** (that item is the held-out target).

  | Key | Shape | Type | Description |
  |---|---|---|---|
  | `items` | (994,169,) | int32 | Item ids 1..`n_items` (0 is reserved for padding), concatenated user by user |
  | `times` | same | int64 | Unix timestamps of the interactions |
  | `offsets` | (6041,) | int64 | User u's sequence is `items[offsets[u]:offsets[u+1]]`, users 0..6039 |
  | `n_items` | () | int64 | Number of items (every movie with at least one rating) |

  No items are filtered. The held-out targets are not in the sandbox; the self-check holds out the last public item of each user instead.
interface: Implement `load(checkpoint_dir, device)` and `recommend(model, histories, users, k)` in `model.py`. `histories`
  holds the arrays above (the user histories to condition on); `recommend` returns an int array (len(users), k) of distinct
  item ids, best first, for the next interaction of each user after their history. Your `train.py` writes `checkpoint/`.
metrics: |
  | Metric | Definition | Requirement |
  |---|---|---|
  | **NDCG@10** (primary) | 1/log2(rank + 1) if the held-out item is in the user's top-10 list, else 0; mean over all 6,040 users; higher is better | — |
  | Recall@10 | Fraction of users whose held-out item is in their top-10 list | reported |
  | Load time | Seconds from the start signal to the return of `load()` (includes importing `model.py`) | reported (killed at 120 s) |
  | Recommendation time | Seconds `recommend()` takes for all users | reported (limit 120 s) |

  Ranking is over **all** items (no sampled negatives). Items already in a user's history are never the target (MovieLens-1M has one rating per user and movie), so recommending them only wastes slots.


  No threshold applies to any metric: a submission is valid if it loads, runs within the time limits and returns well-formed outputs (see below).
  **Timing and decision**

  - Loading and recommendation run in a new process with empty cache directories, on the same GPU model, timed by the evaluator's parent process (`interface/abench_stage.py`); loading `train.npz` and creating the CUDA context are not timed.
  - If loading or recommendation crashes, exceeds a time limit, or returns lists of the wrong shape or with repeated items, the submission is invalid; valid submissions are ranked by NDCG@10.
  - The final ABench score is driven mainly by NDCG@10, and also considers how different the method is from existing methods and the quality of the sources cited in the design report; the exact weights are not published.
hardware:
  kind: gpu
  session_hours: 3
  dev_budget: 2 GPU-hours
  notes: |
    - The reference submission is NumPy only; GPU models are welcome and are evaluated on the same GPU model.
    - `recommend()` receives the public histories at evaluation and, during the self-check, the same histories with each user's final item removed. Train without that item (the reference `train.py` does by default) if you want an unbiased dev estimate; you may include it in the final checkpoint.
deliverables:
  tree: |
    $ABENCH_SUBMISSION_DIR/
    ├── model.py            # required: load() and recommend()
    ├── train.py            # required: the program that produced checkpoint/ (kept for audit, not run by the evaluator)
    ├── checkpoint/         # required: trained parameters, any file types, at most 500 MB
    ├── src/                # optional: other .py modules imported by model.py or train.py
    ├── README.md           # optional
    ├── report/index.html   # required: design report
    └── references.yaml     # required: reference register
  notes: |
    - Outside `checkpoint/`, files may only be `.py`, `.yaml`, `.yml`, `.md` and `.txt`, at most 200,000 bytes in total.
rules: |
  - The checkpoint must be produced by your `train.py` from the provided data only, inside the sandbox; no pretrained weights, no external data and no hand-set parameters copied from elsewhere.
  - The evaluator loads `checkpoint/` with your model code and runs inference only; it does not run `train.py`, which is kept for audit and must reproduce the checkpoint up to randomness.
  - No pretrained weights, metadata or external data.
  - The data comes from MovieLens-1M under the GroupLens usage license (research use only, no redistribution); do not copy it into the submission.
interface_md: |
  # RS-SEQ-001 interface

  ## Entry point: `model.py`

  ```python
  def load(checkpoint_dir: str, device: str):
      """Load your trained recommender from checkpoint/ and return it (any Python object). device is "cuda" at evaluation."""

  def recommend(model, histories: dict, users: numpy.ndarray, k: int = 10) -> numpy.ndarray:
      """Return int (len(users), k): distinct item ids in 1..n_items, best first, for each user's next item.

      histories["items"]    int32 (L,), item ids 1..n_items, concatenated user by user, oldest first
      histories["times"]    int64 (L,), Unix timestamps
      histories["offsets"]  int64 (U + 1,), user u's history is items[offsets[u]:offsets[u + 1]]
      histories["n_items"]  int64 scalar
      """
  ```

  - The evaluator calls `load` inside the timed phase and `recommend` once after it, with `users = arange(U)` and the public histories.
  - `model.py` may import modules under `src/`; the submission directory is on `sys.path`.

  ## Training program: `train.py`

  Write a `train.py` that produces `checkpoint/` from the files in `$ABENCH_DATA_DIR` (`train.npz`), for example
  `python3 train.py --data "$ABENCH_DATA_DIR" --out "$ABENCH_SUBMISSION_DIR/checkpoint"`. The evaluator does not run it;
  it is kept with the submission so the checkpoint can be audited and reproduced. The reference implementation under
  `interface/baseline/` (its `model.py` and `train.py`) is a working starting point you may improve on or replace.

  ## Evaluator code you can read

  `stages.py` (pipeline, dev split, time limits), `metrics.py` and `abench_metrics.py` (NDCG@10 and Recall@10),
  `abench_stage.py` (process and timing protocol) and `selfcheck.py`.

  ## Available software

  Python 3, PyTorch (CUDA, Triton), NumPy. Nothing can be installed.
oj:
  agent_budget:
    gpu_hours: 2.0
    session_hours: 3.0
  data:
    public_dir: sandbox/data/RS-SEQ-001
    public:
    - path: sandbox/data/RS-SEQ-001/train.npz
      sha256: pending
    hidden:
      path: sandbox/hidden/RS-SEQ-001/hidden.npz.enc
      sha256_plain: pending
      rows: 6040
      keys:
      - target
    sources:
    - name: MovieLens 1M (Harper & Konstan 2015, doi:10.1145/2827872)
      url: https://files.grouplens.org/datasets/movielens/ml-1m.zip
      license: 'GroupLens usage license: research use only; no redistribution without permission; no commercial use; cite
        the dataset'
      verified: '2026-10-19: download URL, release (2/2003), ratings.dat format and license terms read from grouplens.org
        and ml-1m-README.txt'
  submission:
    kind: code_plus_checkpoint
    entry: model.py
    checkpoint_dir: checkpoint
    allowed_top_level:
    - README.md
    - model.py
    - train.py
    - checkpoint
    - src
    - report
    - references.yaml
    code_suffixes:
    - .py
    - .yaml
    - .yml
    - .md
    - .txt
    code_max_bytes: 200000
    max_bytes: 526288000
    checkpoint_max_bytes: 524288000
    required_files:
    - train.py
  judge:
    device: cuda
    reference_gpu: RTX 4090-class 24GB (model, driver, CUDA and torch versions frozen at activation)
    seeds:
    - 1808
mode: checkpoint

