id: FN-LOB-002
title: Mid-price direction from limit-order-book windows (FI-2010)
anchor:
  authors: Zihao Zhang, Stefan Zohren, Stephen Roberts
  title: 'DeepLOB: Deep Convolutional Neural Networks for Limit Order Books'
  arxiv: '1808.03668'
baseline: hand-crafted order-book features with a class-balanced ridge classifier (`example_submission/`)
reference_verification: The reference submission and the whole pipeline (dev split, stage runner, metrics) run end to end
  on synthetic data in tests/test_standard_cases.py. Nothing has been run on the real frozen data yet.
n_seeds: 1
task: |
  Design a model that reads the last 100 events of a 10-level limit order book and predicts whether the mid-price will move **up, stay stationary or move down** over the next 10 events, with the **highest macro-F1** on later trading days. Develop and train it on one 24GB GPU in the sandbox, then submit the trained model.

  - Submit your model code, the trained checkpoint and the training program that produced it. The evaluator loads the checkpoint and classifies held-out windows from the three test days; it never retrains.
  - Only the provided training events may be used: no pretrained weights and no external market data.
  - You may build on any public work from before the cutoff (convolutional and recurrent LOB encoders, attention, hand-crafted microstructure features, gradient boosting), but the design report must state what you borrowed and what you changed.
data: |
  `$ABENCH_DATA_DIR/train.npz` (read-only), from FI-2010 (Ntakaris et al. 2018; five Nasdaq Nordic stocks, ten trading days), in the setup used by DeepLOB: no auction period, z-score normalisation, days 1–7 for training (`Train_Dst_NoAuction_ZScore_CF_7`).

  | Key | Shape | Type | Description |
  |---|---|---|---|
  | `events` | (E, 40) | float32 | Order book after each event: for levels 1–10, ask price, ask volume, bid price, bid volume (z-scored) |
  | `labels` | (E, 5) | int8 | Direction label for horizons k = 1, 2, 3, 5, 10 events: 0 up, 1 stationary, 2 down |

  Events are in time order, about a quarter of a million in total. The task uses horizon k = 10 (column 4); the other horizons may be used as auxiliary targets. The held-out set is 15,000 windows sampled with a fixed seed from the test days 8–10 (`Test_Dst_NoAuction_ZScore_CF_7/8/9`); each window holds the 100 events up to and including the prediction time. It is not in the sandbox; the self-check holds out the last 20% of the training events.
interface: Implement `load(checkpoint_dir, device)` and `predict(model, windows)` in `model.py`. `windows` is float32 (Q,
  100, 40), oldest event first; `predict` returns (Q, 3) class scores or probabilities in the order up, stationary, down.
  Your `train.py` writes `checkpoint/`.
metrics: |
  | Metric | Definition | Requirement |
  |---|---|---|
  | **Macro-F1** (primary) | Unweighted mean of the per-class F1 of argmax(`predict`) over up, stationary, down on the 15,000 held-out windows; higher is better | — |
  | Accuracy | Fraction of correct directions | reported |
  | Prediction throughput | Windows per second of `predict()` | reported |
  | Load time | Seconds from the start signal to the return of `load()` (includes importing `model.py`) | reported (killed at 120 s) |


  No threshold applies to any metric: a submission is valid if it loads, runs within the time limits and returns well-formed outputs (see below).
  **Timing and decision**

  - Loading and prediction run in a new process with empty cache directories, on the same GPU model, timed by the evaluator's parent process (`interface/abench_stage.py`); creating the CUDA context is not timed. `predict()` runs after the timed phase and must finish within 120 seconds.
  - If loading or prediction crashes, exceeds a time limit, or returns scores of the wrong shape or non-finite values, the submission is invalid; valid submissions are ranked by macro-F1.
  - The final ABench score is driven mainly by macro-F1, and also considers how different the method is from existing methods and the quality of the sources cited in the design report; the exact weights are not published.
hardware:
  kind: gpu
  session_hours: 3
  dev_budget: 2 GPU-hours
  notes: |
    - The held-out windows are about 240 MB as float32; `predict()` should process them in batches.
    - Windows are cut by the evaluator, so the model can never look past the prediction time. In `train.py`, building windows from `events` is up to you.
    - The self-check scores your checkpoint on windows from the last 20% of the training events. Train on the first 80% only (the reference `train.py` does by default) if you want an unbiased dev estimate; you may use all events in the final checkpoint.
deliverables:
  tree: |
    $ABENCH_SUBMISSION_DIR/
    ├── model.py            # required: load() and predict()
    ├── train.py            # required: the program that produced checkpoint/ (kept for audit, not run by the evaluator)
    ├── checkpoint/         # required: trained parameters, any file types, at most 500 MB
    ├── src/                # optional: other .py modules imported by model.py or train.py
    ├── README.md           # optional
    ├── report/index.html   # required: design report
    └── references.yaml     # required: reference register
  notes: |
    - Outside `checkpoint/`, files may only be `.py`, `.yaml`, `.yml`, `.md` and `.txt`, at most 200,000 bytes in total.
rules: |
  - The checkpoint must be produced by your `train.py` from the provided data only, inside the sandbox; no pretrained weights, no external data and no hand-set parameters copied from elsewhere.
  - The evaluator loads `checkpoint/` with your model code and runs inference only; it does not run `train.py`, which is kept for audit and must reproduce the checkpoint up to randomness.
  - No pretrained weights or external market data.
  - `predict()` must treat each window independently: no adaptation to, or statistics pooled across, the held-out windows.
interface_md: |
  # FN-LOB-002 interface

  ## Entry point: `model.py`

  ```python
  def load(checkpoint_dir: str, device: str):
      """Load your trained classifier from checkpoint/ and return it (any Python object). device is "cuda" at evaluation."""

  def predict(model, windows: numpy.ndarray) -> numpy.ndarray:
      """windows float32 (Q, 100, 40), oldest first; the label belongs to the last event of each window.
      Return float (Q, 3) scores for up, stationary, down."""
  ```

  - The label of event t at horizon k compares the mean mid-price of the next k events with the mid-price at t (threshold as defined by FI-2010).
  - `model.py` may import modules under `src/`; the submission directory is on `sys.path`.

  ## Training program: `train.py`

  Write a `train.py` that produces `checkpoint/` from the files in `$ABENCH_DATA_DIR` (`train.npz`: `events` float32 (E, 40) and `labels` int8 (E, 5), as described in the task), for example
  `python3 train.py --data "$ABENCH_DATA_DIR" --out "$ABENCH_SUBMISSION_DIR/checkpoint"`. The evaluator does not run it;
  it is kept with the submission so the checkpoint can be audited and reproduced. The reference implementation under
  `interface/baseline/` (its `model.py` and `train.py`) is a working starting point you may improve on or replace.

  ## Evaluator code you can read

  `stages.py` (pipeline, window construction, dev split, time limits), `metrics.py` and `abench_metrics.py` (macro-F1),
  `abench_stage.py` (process and timing protocol) and `selfcheck.py`.

  ## Available software

  Python 3, PyTorch (CUDA, Triton), NumPy, SciPy. Nothing can be installed.
oj:
  agent_budget:
    gpu_hours: 2.0
    session_hours: 3.0
  data:
    public_dir: sandbox/data/FN-LOB-002
    public:
    - path: sandbox/data/FN-LOB-002/train.npz
      sha256: pending
    hidden:
      path: sandbox/hidden/FN-LOB-002/hidden.npz.enc
      sha256_plain: pending
      rows: 15000
      keys:
      - events
      - query_idx
      - y
      - segment
    sources:
    - name: 'FI-2010: Benchmark Dataset for Mid-Price Forecasting of Limit Order Book Data (Ntakaris et al., arXiv:1705.03233)'
      url: https://etsin.fairdata.fi/dataset/73eb48d7-4dbc-4a10-a52a-da745b47a649
      urn: urn:nbn:fi:csc-kata20170601153214969115
      license: CC BY 4.0
      verified: '2026-10-19: license, URN and file naming scheme read from the research.fi record of the dataset'
  submission:
    kind: code_plus_checkpoint
    entry: model.py
    checkpoint_dir: checkpoint
    allowed_top_level:
    - README.md
    - model.py
    - train.py
    - checkpoint
    - src
    - report
    - references.yaml
    code_suffixes:
    - .py
    - .yaml
    - .yml
    - .md
    - .txt
    code_max_bytes: 200000
    max_bytes: 526288000
    checkpoint_max_bytes: 524288000
    required_files:
    - train.py
  judge:
    device: cuda
    reference_gpu: RTX 4090-class 24GB (model, driver, CUDA and torch versions frozen at activation)
    seeds:
    - 1808
mode: checkpoint
