      license: generated by ABench
      verified: '2026-10-19: the anchor''s experiment list (Parity, Copy with repeated tokens, Binary Addition, Binary Sum,
        Binary Multiplication, Unique Set) read from arxiv.org/html/2409.15647; this case uses three of them'
  submission:
