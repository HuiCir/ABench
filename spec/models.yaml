schema: abench.models/v1
# Harness-independent model endpoints: protocol, base URL, model id, the environment variable holding the key,
# and optional parameters (effort: reasoning effort, applied by each harness in its own way).
# Default per harness: claude -> claude-opus-5-5, codex -> gpt-6-astra, gemini -> gemini-4-argon,
# dsh -> deepseek-flash-anthropic, zcode -> glm-5.3. Add entries for any compatible gateway or provider.
models:
  claude-opus-5-5:
    api: anthropic
    base_url: https://api.anthropic.com
    model: claude-opus-5-5
    key_env: ANTHROPIC_API_KEY
    parameters: {effort: high}
  claude-sonnet:
    api: anthropic
    base_url: https://api.anthropic.com
    model: claude-sonnet-4-5
    key_env: ANTHROPIC_API_KEY
  gpt-6-astra:
    api: openai-responses
    base_url: https://api.openai.com/v1
    model: gpt-6-astra
    key_env: OPENAI_API_KEY
    parameters: {effort: high}
  gemini-4-argon:
    api: gemini
    base_url: https://generativelanguage.googleapis.com
    model: gemini-4-argon
    key_env: GEMINI_API_KEY
    parameters: {effort: high}
  deepseek-chat-anthropic:
    api: anthropic
    base_url: https://api.deepseek.com/anthropic
    model: deepseek-chat
    key_env: DEEPSEEK_API_KEY
  deepseek-chat-openai:
    api: openai-chat
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    key_env: DEEPSEEK_API_KEY
  deepseek-flash-anthropic:
    api: anthropic
    base_url: https://api.deepseek.com/anthropic
    model: deepseek-flash
    key_env: DEEPSEEK_API_KEY
    parameters: {effort: high}
  deepseek-flash-openai:
    api: openai-chat
    base_url: https://api.deepseek.com/v1
    model: deepseek-flash
    key_env: DEEPSEEK_API_KEY
    parameters: {effort: high}
  glm-5.3:
    # Z.ai general API; the id is ZCode's own built-in id for this endpoint
    api: openai-chat
    base_url: https://api.z.ai/api/paas/v4
    model: GLM-5.3
    key_env: ZAI_API_KEY
    parameters: {effort: high}
