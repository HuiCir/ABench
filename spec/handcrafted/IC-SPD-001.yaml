# Stable authored contract; agent task/interface files remain maintained by hand.
id: IC-SPD-001
environment:
  profile: gpu-torch
  version: '2026.10'
resources:
  budget_tier: budget
  hardware:
    reference: RTX 4090 24GB
  wall_clock_limit_h: 3.0
  leaderboard: all
  gpus: 1
  gpu_class: reference24
  cpus: 8
  memory: 32g
  shm_size: 2g
oj:
  schema: abench.oj/v2
  case_id: IC-SPD-001
  handcrafted: true
  standard: true
  task_statement: v2.1
  agent_visible:
    task: case/agent/task.md
    interface:
    - harness/interface.md
    - harness/gpu_sandbox.md
    - harness/speedrun_harness.py
    - harness/speedrun_runner.py
    - harness/selfcheck.py
    - harness/abench_stage.py
    - harness/abench_metrics.py
    - harness/stages.py
    - harness/metrics.py
    leak_allow:
    - hidden
    - evaluation
    - metric
    - threshold
    - score
    - evaluate
    - held-out            # the shared stage runner and metrics helpers in its view, as in every generated case
  agent_budget:
    gpu_hours: 1.0
    session_hours: 3.0
  data:
    public_dir: sandbox/data/IC-SPD-001
    public:
    - path: sandbox/data/IC-SPD-001/train.npz
      sha256: pending
      rows: 50000
      dev_rows: 5000
    hidden:
      path: sandbox/hidden/IC-SPD-001/test.npz.enc
      sha256_plain: pending
      rows: 12000
      rows_by_src:
        cifar10: 10000
        cifar10_1: 2000
    sources:
    - name: CIFAR-10 (Krizhevsky 2009)
      url: https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz
      mirror: https://huggingface.co/datasets/uoft-cs/cifar10
      md5: c58f30108f718f92721af3b95e74349a
      license: to_verify
    - name: CIFAR-10.1 v6 (Recht et al. 2018, arXiv:1806.00451)
      url: https://github.com/modestyachts/CIFAR-10.1/tree/d9982abb0bfc4846b8d13a11e66b887d946205d0/datasets
      pinned: commit d9982abb0bfc4846b8d13a11e66b887d946205d0; sha256 of both files in tools/prepare_ic_spd.py (checked
        2026-10-21)
      license: code MIT; images follow Tiny Images terms (to_verify)
  submission:
    kind: code_only
    entry: method.py
    checkpoint_dir: null
    allowed_top_level:
    - README.md
    - method.py
    - src
    - report
    - references.yaml
    code_suffixes:
    - .py
    - .yaml
    - .yml
    - .md
    - .txt
    code_max_bytes: 200000
    max_bytes: 2000000
    report_profile: design_report_v2
  judge:
    kind: harness
    activation: awaiting_data
    runner: harness/speedrun_runner.py
    stages: harness/stages.py
    metrics: harness/metrics.py
    device: cuda
    reference_gpu: RTX 4090-class 24GB (model, driver, CUDA and torch versions frozen at activation)
    seeds:
    - 913
    - 2718
    - 31415
    - 57721
    - 86753
    n_classes: 10
    subsets:
      cifar10: 0
      cifar10_1: 1
    timeout_sec: 600
    predict_cap_sec: 5
    tail_slack_sec: 3
    threads: 8
    gates:
    - metric: accuracy_cifar10_mean
      min: 0.94
    - metric: accuracy_cifar10_1_mean
      min: 0.8
    primary: train_seconds_mean
