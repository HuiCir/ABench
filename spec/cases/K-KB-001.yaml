  | `L1_5_Matrix_scalar_multiplication` | `M` = 16384 |
  | `L1_9_Tall_skinny_matrix_multiplication_` | — |
  | `L1_18_Matmul_with_transposed_both` | — |
  | `L1_19_ReLU` | `dim` = 49152 |
