  | `L1_52_Argmin_over_a_dimension` | `dim1` = 1024, `dim2` = 2047 |
  | `L1_58_conv_transposed_3D__asymmetric_input__asymmetric_kernel` | — |
  | `L1_60_conv_standard_3D__square_input__asymmetric_kernel` | — |
