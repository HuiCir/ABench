  session_hours: 8
  dev_budget: "8 GPU-hours (the whole session on one GPU)"
  software: "Python 3, PyTorch (CUDA, Triton), safetensors, NumPy, PyYAML"
  notes: |
    - `selfcheck.py --quick` runs 60 training steps and every measurement of the evaluation on stand-in material.
    - The cache is measured as stored; buffered tokens of a partial mini-batch count, but must stay bounded.
