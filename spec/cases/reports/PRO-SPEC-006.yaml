case: PRO-SPEC-006
title: 'An EAGLE-3 Drafter Trained on the Target''s Own Answers'
abstract: >-
  This submission trains an EAGLE-3 drafter [@li2025eagle3] for Qwen3-8B [@yang2025qwen3] and serves it with vLLM's
  exact speculative verification [@leviathan2023spec]. The drafter fuses the target's hidden states from a low, a
  middle and a high layer, runs one decoder layer and predicts over the 32,000 target tokens most frequent in its
  training data; training-time test unrolls it for seven steps on its own features. Training data are the target's
  greedy answers to UltraChat prompts [@ding2023ultrachat].
sections:
- title: Introduction
  paras:
  - >-
    At batch size 1, decoding is limited by reading the weights once per token; a cheap drafter that proposes several
    tokens which the target verifies in one pass converts spare compute into fewer target passes, without changing
    the output.
- title: Related Work
  paras:
  - >-
    Speculative decoding verifies drafts exactly [@leviathan2023spec]; EAGLE drafts at the feature level, and
    EAGLE-3 replaces feature prediction by direct token prediction from fused multi-layer features with
    training-time test [@li2025eagle3].
- title: Method
  paras:
  - >-
    60,000 UltraChat first turns are answered greedily by the target (non-thinking template, at most 1,024 tokens);
    target features are computed on the fly during training. Loss: sum over the seven unrolled steps of 0.8^k times
    the cross-entropy against the target's next token; AdamW 5e-5, four epochs, a checkpoint every 2,000 steps. The
    server proposes 5 tokens per step.
- title: Design Rationale
  paras:
  - >-
    Training on the target's own outputs matches the distribution the drafter sees at inference; training-time test
    trains the drafter on its own earlier predictions, which raises the acceptance of later draft positions.
- title: Scope and Limitations
  paras:
  - >-
    A fixed chain of 5 tokens instead of a dynamic tree; the weight names follow vLLM's EAGLE-3 loader at the frozen
    version and must be checked against it. Nothing here has been run in this build.
