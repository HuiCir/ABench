case: PRO-ARL-001
title: 'DAPO with a Python Tool and Masked Tool Outputs'
abstract: >-
  This submission applies DAPO [@yu2025dapo] to tool-integrated reasoning: Qwen3-4B-Base [@yang2025qwen3] answers
  with interleaved Python calls, rollouts are sampled with the evaluator's own tool loop, and the tokens of tool
  outputs are masked out of the policy loss, as in ReTool-style training [@feng2025retool]. Group-normalised
  advantages follow GRPO [@shao2024deepseekmath]; clip-higher, dynamic sampling, the token-mean loss and overlong
  shaping follow DAPO.
sections:
- title: Introduction
  paras:
  - >-
    A tool changes what the policy has to learn: when to call it, what to compute and how to use the result. Training
    with the same tool loop that the evaluation uses removes a mismatch between training and evaluation.
- title: Related Work
  paras:
  - >-
    GRPO normalises rewards within a group of answers to the same problem [@shao2024deepseekmath]; DAPO adds
    decoupled clipping, dynamic sampling, token-level averaging and overlong reward shaping [@yu2025dapo]; ReTool
    trains interleaved code execution with outputs excluded from the loss [@feng2025retool].
- title: Method
  paras:
  - >-
    Ranks on GPUs 1-3 train with FSDP; a vLLM worker on GPU 0 reloads the weights after every step and samples
    64 problems x 16 answers. Reward is 1 for a correct boxed integer minus a linear penalty over the last 2,048 of
    the 16,384 tokens; groups with identical rewards are dropped and refilled; eps_low 0.2, eps_high 0.28, no KL
    term, learning rate 1e-6, 400 steps; a checkpoint every 20 steps.
- title: Design Rationale
  paras:
  - >-
    Masking tool outputs keeps the policy from being trained to predict the interpreter; dynamic sampling keeps every
    group informative, which matters when a base model starts with near-zero accuracy on hard problems.
- title: Scope and Limitations
  paras:
  - >-
    One update per batch, no curriculum and no value model; the in-place weight reload relies on the V0 vLLM engine.
    Nothing here has been run in this build.
