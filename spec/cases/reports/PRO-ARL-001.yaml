changes:
- text: Rollouts use the evaluator's tool loop and tool outputs are masked out of the loss, which DAPO (text only) does not have.
  code: 'train.py: masks; src/rollout.py'
- text: The KL penalty is removed and the learner and the sampler share one node with an in-place weight reload.
  code: 'train.py: main; src/rollout.py: worker'
