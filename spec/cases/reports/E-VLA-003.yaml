changes:
- text: The backbone stays frozen and only an MLP on pooled layer-16 features is trained, instead of OpenVLA's full
    fine-tuning with discretised action tokens.
  code: 'src/features.py: encode; src/head.py: Head'
- text: Continuous 8-step chunks executed open loop replace one action per forward pass.
  code: 'policy.py: Policy.act'
