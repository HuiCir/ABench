case: IC-AUG-003
title: 'A RandAugment-Style Policy with Cutout and a Clean Final Phase'
abstract: >-
  This submission gives a reference augmentation policy for the fixed 40-epoch CIFAR-10 recipe. It replaces the
  anchor's learned sub-policies [@cubuk2019autoaugment] by RandAugment's two hyperparameters [@cubuk2020randaugment]:
  after the standard flip and translation, each image receives two operations drawn uniformly from nine at a shared
  magnitude, then an 8 × 8 cutout [@devries2017cutout]. The last 10% of the epochs use flip and translation only. No
  search was run for the reference; the magnitude is the common default for CIFAR-10, which leaves the search
  procedure itself to entries.
sections:
- title: Introduction
  paras:
  - >-
    Augmentation policies trade the diversity of training images against their fidelity to the test distribution, and
    the best trade-off depends on the network and the length of training. With a short recipe, strong policies can
    hurt; with a longer one, they usually help.
- title: Related Work
  paras:
  - >-
    AutoAugment searched sub-policies of two operations with probabilities and magnitudes using reinforcement learning on
    a reduced proxy task [@cubuk2019autoaugment]; Fast AutoAugment matched augmented and clean data distributions
    with density matching instead of training [@lim2019fast]. RandAugment showed that sampling operations uniformly at a
    single magnitude performs as well with two hyperparameters [@cubuk2020randaugment], and TrivialAugment that one
    random operation at a random strength needs none [@muller2021trivialaugment]. Cutout removes random square regions
    [@devries2017cutout].
  - >-
    These policies were tuned for training runs of hundreds of epochs; which search procedure finds the best policy for
    a 40-epoch recipe within three GPU-hours is the open question.
- title: Method
  subsections:
  - title: Policy
    paras:
    - >-
      Every image is flipped with probability 0.5 and translated by up to four pixels. For two rounds, each image draws
      one of nine operations — rotation up to 9°, horizontal or vertical shear up to 0.09, brightness, contrast,
      saturation and sharpness changes up to 27%, posterisation to six bits or solarisation above 0.7 — and the drawn
      operation is applied to those images only. An 8 × 8 cutout follows. From epoch 36 of 40 only flip and translation
      remain.
    algorithm_caption: augment(x, ops, gen, epoch, n_epochs)
    algorithm:
    - x ← translate(flip_lr(x), 4)
    - if epoch ≥ 0.9 · n_epochs, return x
    - 'repeat twice: k ← choice(9) per image; for each op i apply op_i(M) to the images with k = i'
    - return cutout(x, 8)
  - title: Complexity
    paras:
    - >-
      Per epoch, each image passes through four transformations on the GPU; each operation runs only on its subset, so
      the cost is about four whole-set passes, small next to an epoch of training.
- title: Design Rationale
  paras:
  - >-
    A single magnitude avoids a search over per-operation strengths that a 40-epoch recipe cannot amortise, and the
    clean final phase lets the network adapt to unaugmented images before testing.
- title: Scope and Limitations
  paras:
  - >-
    The magnitude and the clean-phase length were not searched, the operation list is fixed, and nothing adapts the
    policy to the network's progress during training.
