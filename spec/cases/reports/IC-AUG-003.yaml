changes:
- text: The anchor's searched sub-policies are replaced by RandAugment's uniform choice of two operations at one magnitude.
  code: 'policy.py: augment'
- text: Cutout is applied after the operations, and the last 10% of the epochs use only flip and translation.
  code: 'policy.py: augment'
- text: Each drawn operation runs only on the images that drew it, on the whole training set at once.
  code: 'policy.py: augment (masks)'
