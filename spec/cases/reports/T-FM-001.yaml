changes:
- text: Diffusion Policy's denoising head is replaced by a flow-matching velocity field on the straight noise-to-data path.
  code: 'policy.py: Velocity; train.py: main'
- text: Ten Euler steps per chunk instead of about a hundred denoising steps.
  code: 'policy.py: STEPS, sample_chunk'
- text: An MLP on keypoints replaces the convolutional or transformer backbone of the anchor's robot experiments.
  code: 'policy.py: Velocity'
