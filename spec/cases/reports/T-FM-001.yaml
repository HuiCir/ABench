case: T-FM-001
title: 'A Ten-Step Flow-Matching Action Head over Action Chunks'
abstract: >-
  This submission transfers conditional flow matching [@lipman2023flow] with the straight-line path of rectified flow
  [@liu2023flow] to imitation learning on PushT. A small MLP predicts the velocity that carries Gaussian noise to a
  chunk of 16 future actions, conditioned on the current keypoint observation; ten Euler steps produce a chunk, whose
  first eight actions are executed before replanning, as in action-chunking policies [@zhao2023act;@chi2023diffusion].
  Ten network evaluations per eight control steps keep act() far inside the latency budget. Distilling the head to one
  or two steps [@prasad2024consistency] is left to entries.
sections:
- title: Introduction
  paras:
  - >-
    Demonstrations of PushT are multimodal: the block can be pushed around either side. Generative action heads
    capture this where regression averages the modes, but diffusion heads pay for it with many denoising steps per
    decision. Flow matching learns a velocity field along straight paths, which can be integrated in far fewer steps.
- title: Related Work
  paras:
  - >-
    Diffusion Policy denoises action sequences conditioned on observations and established generative heads on PushT
    [@chi2023diffusion]; ACT showed that predicting chunks of actions reduces compounding errors [@zhao2023act]. Flow
    matching regresses a conditional velocity field along chosen probability paths [@lipman2023flow], and rectified flow
    uses the straight interpolation between noise and data, which makes few-step integration accurate
    [@liu2023flow]. Robot policies with flow-matching action experts followed [@black2024pi0], and consistency distillation
    has been used to make diffusion policies one-step [@prasad2024consistency].
  - >-
    How few integration steps a flow-matching action head can afford before losing the modes of the demonstrations,
    without a second distillation stage, is the gap.
- title: Method
  subsections:
  - title: Head, training and sampling
    paras:
    - >-
      Inputs are the standardised observation (end-effector position and eight block keypoints), the noisy standardised
      chunk and a sinusoidal embedding of t; three hidden layers of 512 SiLU units output the velocity. Training draws
      t uniformly in (0, 1), forms x_t = (1 − t) z + t a and regresses a − z, with AdamW and cosine decay for 30,000
      steps of batch 256. Sampling integrates from noise at t = 0 to t = 1 with ten Euler steps.
    algorithm_caption: One training step
    algorithm:
    - (o, a) ← batch of observations and their next 16 actions; z ~ N(0, I); t ~ U(0, 1)
    - x_t ← (1 − t) z + t a
    - loss ← ‖v_θ(x_t, t, o) − (a − z)‖²; AdamW step
  - title: Complexity
    paras:
    - >-
      Ten MLP evaluations per chunk, one chunk every eight control steps, so about 1.25 evaluations per step.
- title: Design Rationale
  paras:
  - >-
    The straight path makes the learned field nearly constant along each trajectory, so ten Euler steps lose little
    accuracy; executing eight of sixteen predicted actions balances reactivity against the cost of replanning.
- title: Scope and Limitations
  paras:
  - >-
    The MLP conditions only on the current observation, there is no temporal ensembling between chunks, and the
    number of integration steps is fixed rather than reduced by distillation.
