case: LG-LONG-001
title: 'Whole-Document tf-idf with Per-Article Logistic Regression for ECtHR Violation Prediction'
abstract: >-
  This submission gives a length-unlimited linear reference for the ECtHR task of LexGLUE [@chalkidis2022lexglue]. Each
  case is represented by sublinear tf-idf [@salton1988tfidf] over word unigrams and bigrams of all its paragraphs, and
  one L2-regularised logistic regression per article predicts whether the article was violated, with a single decision
  threshold tuned for micro-F1. It ignores the provided legal-domain encoder [@chalkidis2020legalbert] on purpose:
  how to bring a 512-token encoder to documents several thousand tokens long is the question entries answer.
sections:
- title: Introduction
  paras:
  - >-
    Judgment prediction on ECtHR cases asks which articles of the Convention were violated, given the facts as
    described by the court [@chalkidis2019judgment]. The facts run to thousands of tokens, longer than the input
    window of standard pretrained encoders, so models either truncate, encode paragraphs hierarchically, or use
    sparse attention.
- title: Related Work
  paras:
  - >-
    LexGLUE compares linear tf-idf models with pretrained encoders and finds that domain pretraining and hierarchical
    encoding of paragraphs give the strongest results on ECtHR [@chalkidis2022lexglue;@chalkidis2020legalbert]. Sparse
    attention patterns extend the window of a single transformer to several thousand tokens [@beltagy2020longformer].
    Paragraph-level rationales show that a few paragraphs usually carry the decision [@chalkidis2021rationale].
  - >-
    Linear models see the whole document but no word order beyond bigrams; encoders see order but not the whole
    document. This reference is the first kind, which leaves the second kind, and combinations of both, to entries.
- title: Method
  subsections:
  - title: Features and classifiers
    paras:
    - >-
      Lower-cased word tokens and adjacent-word bigrams are counted per case; the 100,000 terms with the highest
      document frequency (at least three cases) form the vocabulary. Each case vector holds (1 + log tf) · idf and is
      normalised to unit length. For each of the ten articles a logistic regression with L2 penalty 1e-4 is fitted
      by L-BFGS on 90% of the training cases; the remaining 10% choose one probability threshold for all articles that
      maximises micro-F1 including the "no violation" label.
    algorithm_caption: Training
    algorithm:
    - vocabulary ← top 100,000 unigrams and bigrams by document frequency (≥ 3)
    - X ← unit-normalised sublinear tf-idf of the fitting cases
    - 'for article j = 1 … 10: (w_j, b_j) ← L-BFGS on logistic loss + 1e-4/2 ‖w_j‖²'
    - threshold ← argmax over {0.10, 0.15, …, 0.70} of micro-F1 on the selection cases
  - title: Complexity
    paras:
    - >-
      Feature extraction is linear in document length; each L-BFGS iteration costs one sparse product with the
      9,000 × 100,000 case matrix per article. Prediction is one sparse matrix product.
- title: Design Rationale
  paras:
  - >-
    A linear model over the whole document sets a reference that has no length limit, which makes visible how much an
    encoder-based design gains from word order and pretraining despite seeing less of each case.
- title: Scope and Limitations
  paras:
  - >-
    Bag-of-n-grams features cannot tell which party a statement concerns, the threshold is shared by all articles, and
    rare articles get few positive examples.
