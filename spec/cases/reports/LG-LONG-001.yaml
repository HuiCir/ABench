changes:
- text: One logistic regression per article over whole-document tf-idf replaces the anchor's hierarchical encoders,
    so the full case is always used.
  code: 'model.py: tfidf, predict; train.py: fit_logistic'
- text: A single decision threshold for all articles is tuned on held-aside training cases for micro-F1 with the
    no-violation label.
  code: 'train.py: main (threshold)'
- text: Word bigrams are added to the anchor's unigram tf-idf baseline.
  code: 'model.py: terms'
