- text: One FNO is shared by three systems through per-system lifting and projection layers, instead of one model per dataset as in The Well's baselines.
  code: 'src/fno.py: FNO'
- text: FiLM conditioning on the physical parameters, which The Well's baselines do not receive.
  code: 'src/fno.py: FNO.film'
