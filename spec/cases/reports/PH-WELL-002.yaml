case: PH-WELL-002
title: 'A Shared Fourier Neural Operator with Parameter FiLM'
abstract: >-
  This submission trains one Fourier neural operator [@li2021fno] for the three systems of the case, with
  per-system 1 x 1 lifting and projection layers and FiLM conditioning [@perez2018film] of every layer on the
  system's normalised physical parameters. It predicts the change of the normalised frame from the last one and is
  trained on one-step loss, then on two-step unrolled loss with the first step detached, after the pushforward trick
  [@brandstetter2022mp]. The systems are from The Well [@ohana2024well].
sections:
- title: Introduction
  paras:
  - >-
    A surrogate that serves several systems must share what is common (local transport, diffusion, spectral
    structure) while keeping fields and parameters apart; conditioning on parameters is what lets it interpolate to
    values it has not seen.
- title: Related Work
  paras:
  - >-
    The Well provides the systems and FNO and U-Net baselines trained per dataset [@ohana2024well]; FNO learns
    mixing in a truncated Fourier basis [@li2021fno]; FiLM conditions features with learned scales and shifts
    [@perez2018film]; the pushforward trick trains on the model's own predictions without backpropagating through
    them [@brandstetter2022mp].
- title: Method
  paras:
  - >-
    Inputs are the 4 normalised frames stacked as channels plus two coordinate channels; six blocks of spectral
    convolution (16 x 16 modes) plus a 1 x 1 convolution, group normalisation and FiLM, with residual connections;
    width 96. Systems are sampled in turn; AdamW at 1e-3 with cosine decay, 40,000 steps of batch 16, bfloat16.
- title: Design Rationale
  paras:
  - >-
    System-specific layers are small (well under 10% of the parameters), so most capacity is shared; predicting the
    increment keeps the identity easy, which matters for stable rollouts.
- title: Scope and Limitations
  paras:
  - >-
    The anisotropic resampling of the radiative layer is ignored, systems are weighted equally regardless of their
    difficulty, and there is no noise injection. Nothing here has been trained in this build.
