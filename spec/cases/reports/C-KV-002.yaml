case: C-KV-002
title: 'Per-Token Asymmetric Quantisation of the Key-Value Cache'
abstract: >-
  This submission compresses the cache by quantising every cached key and value vector — one head of one token, 128
  numbers — with its own minimum and scale, the asymmetric scheme of the anchor KIVI [@liu2024kivi] simplified to
  per-token groups for both keys and values. Codes are bit-packed into bytes and dequantised when a layer reads the
  cache. The three budgets map to 4/4, 2/2 and 2/1 bits for keys/values, storing 4.25, 2.25 and 1.75 bits per element
  including the fp16 minimum and scale. It has not been run yet: it needs PyTorch and the Qwen2.5 weights, which were not
  available where the case was built.
sections:
- title: Introduction
  paras:
  - >-
    At 16k tokens the bf16 cache of Qwen2.5-1.5B takes about 460 MB per sequence, more than the model's activations and
    a large share of the weights. Compressing it trades memory for retrieval accuracy; the case asks how much accuracy
    survives at three budgets.
- title: Related Work
  paras:
  - >-
    KIVI quantises keys per channel and values per token to 2 bits with a full-precision window of recent tokens
    [@liu2024kivi]; KVQuant adds non-uniform and outlier-aware quantisation [@hooper2024kvquant]. Eviction keeps the
    tokens attention needs: heavy hitters [@zhang2023h2o], attention sinks plus a recent window [@xiao2024streaming], or
    tokens selected by the attention of the prompt's end [@li2024snapkv]. RULER measures long-context retrieval beyond
    needle-in-a-haystack tests [@hsieh2024ruler].
- title: Method
  paras:
  - >-
    For a vector x of 128 elements, lo = min x, s = (max x − lo)/(2^b − 1), q = round((x − lo)/s) ∈ [0, 2^b − 1]; 8/b
    codes are packed per byte, lo and s are kept in fp16. On every update the new tokens of a layer are quantised and
    appended, and the layer's whole cache is dequantised to bf16 for attention.
- title: Design Rationale
  paras:
  - >-
    Per-token groups make the stored size exactly proportional to the number of tokens, so the budget holds at every
    context length without a full-precision window; values tolerate one bit less than keys at the tightest budget,
    because attention averages values while keys decide which tokens are attended.
- title: Scope and Limitations
  paras:
  - >-
    Keys have outlier channels that per-token groups spread over all elements, which KIVI avoids with per-channel key
    groups; no tokens are evicted, so the 2-bit budgets rely on quantisation alone; and dequantising the whole cache at
    every step is slow. The scheme has not been run yet.
