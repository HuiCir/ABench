case: PH-SYM-005
title: 'Sparse Identification with Smoothed Derivatives, Scale-Free Thresholds and Cross-Validated Supports'
abstract: >-
  This submission keeps the sparse-regression formulation of SINDy [@brunton2016sindy] and changes the three places
  where the anchor's sequentially thresholded least squares (STLSQ) is fragile on unseen systems: derivatives are
  estimated with Savitzky-Golay smoothing [@savitzky1964] whose window follows a noise estimate, thresholds act on a
  column-normalised term library so that they do not depend on variable scales, and each equation's support is chosen
  along a path of thresholds by leave-one-trajectory-out error, keeping the sparsest support within 10% of the best.
  On three development sets of 20 systems drawn by the case's generator with public seeds, it recovers the exact
  structure of 65%, 35% and 50% of the systems against 30%, 35% and 50% for the anchor's STLSQ, with a lower
  extrapolation error on all three; these are calibration checks, not results of the case.
sections:
- title: Introduction
  paras:
  - >-
    Equation discovery asks for the terms of an unknown vector field, not only for a good fit. SINDy casts it as
    sparse regression of estimated derivatives on a library of candidate terms [@brunton2016sindy]; the anchor's STLSQ
    alternates least squares with hard thresholding at a fixed level. On systems it has not been tuned for, three
    choices decide whether the structure comes out right: how derivatives are estimated from noisy samples, how the
    threshold relates to coefficient scales, and how the final support is selected.
- title: Related Work
  paras:
  - >-
    The anchor introduced the library regression and STLSQ [@brunton2016sindy]; PDE-FIND extended it to partial
    differential equations with ridge-regularised thresholding [@rudy2017pdefind]. Model selection over candidate
    supports with information criteria was studied by Mangan et al. [@mangan2017selection]. Weak formulations replace
    pointwise derivatives by integrals against test functions and are markedly more robust to noise
    [@messenger2021weak]; ensembles over bootstrapped data give inclusion probabilities for each term
    [@fasel2022ensemble]; relaxed sparse optimisation unifies several thresholding schemes [@champion2020sr3].
  - >-
    The reference uses only pointwise derivatives and a deterministic support path, so weak forms and ensembles remain
    open directions for entries.
- title: Method
  subsections:
  - title: Derivatives
    paras:
    - >-
      For each trajectory, the relative size of second differences estimates the noise level; it selects a cubic
      Savitzky-Golay window of 7, 15, 25 or 41 samples [@savitzky1964]. The filter gives smoothed states and their
      derivatives; half a window is trimmed at both ends, where the fit is one-sided.
  - title: Support selection
    paras:
    - >-
      All trajectories are stacked and every library column is scaled to unit RMS. For each equation, STLSQ is run on
      the normalised columns for 30 thresholds spaced logarithmically between 10^-4 and 0.5 of the largest
      least-squares coefficient. Each distinct support is scored by leave-one-trajectory-out squared error; the sparsest
      support within 10% of the best error is kept and refit by least squares on all data, and the coefficients are
      mapped back to the original scale.
    algorithm_caption: Support selection for equation i
    algorithm:
    - Θ ← library at smoothed states; Θn ← Θ / rms(Θ); y ← estimated dx_i/dt
    - for λ in 30 thresholds, S(λ) ← support of STLSQ(Θn, y, λ)
    - e(S) ← Σ over held-out trajectories of the squared error of the fit on the other trajectories
    - S* ← sparsest S with e(S) ≤ 1.1 · min e; coefficients ← least squares on S*, rescaled
  - title: Complexity
    paras:
    - >-
      For n samples and p library terms each STLSQ run costs O(n p²); with 30 thresholds, d equations and 8 folds per
      distinct support the total is a few hundred least-squares solves per system, 20 to 75 seconds for 20 systems on
      two cores.
- title: Design Rationale
  paras:
  - >-
    A fixed threshold mixes two scales: the size of a coefficient and the size of the term it multiplies. Normalising
    the columns makes the threshold a statement about a term's contribution to the derivative. Cross-validation across
    trajectories penalises spurious terms that only fit noise along one trajectory, and the 10% tolerance prefers
    parsimony when supports explain the data equally well. On the development sets the reference halves the
    extrapolation error of STLSQ (0.07 to 0.11 against 0.18 to 0.30) but fails, like the baseline, on most random sparse
    systems with four variables and on systems whose trajectories excite few terms.
- title: Scope and Limitations
  paras:
  - >-
    Pointwise derivatives remain the main source of error at 1% noise; the noise estimate is coarse; the support path
    is greedy, so terms masked by a correlated term are lost; and nothing exploits the shared structure across
    equations or the inclusion statistics an ensemble would give.
