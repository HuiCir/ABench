changes:
- text: Derivatives come from Savitzky-Golay smoothing with a window chosen from a noise estimate, instead of finite
    differences of the raw samples.
  code: 'discover.py: _noise_level, _derivative'
- text: Thresholding acts on a library whose columns are scaled to unit RMS, so one threshold path serves every
    variable scale.
  code: 'discover.py: discover'
- text: Each equation's support is chosen along a path of 30 thresholds by leave-one-trajectory-out error (the sparsest
    within 10% of the best) instead of one fixed threshold.
  code: 'discover.py: discover, TOL'
