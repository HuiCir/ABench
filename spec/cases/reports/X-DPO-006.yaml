case: X-DPO-006
title: 'Direct Preference Optimisation of Low-Rank Updates'
abstract: >-
  This submission applies the anchor's objective unchanged [@rafailov2023dpo]: the log-sigmoid of β times the
  difference of the chosen and rejected answers' log-ratios to the starting model, with β = 0.1, minimised over
  rank-16 LoRA updates [@hu2022lora] of SmolLM2-360M-Instruct on 20,000 of the public UltraFeedback pairs
  [@cui2024ultrafeedback]. It is the plain floor: no length control, no data filtering, one epoch. It has not been run
  yet: it needs PyTorch and the SmolLM2 weights, which were not available where the case was built.
sections:
- title: Introduction
  paras:
  - >-
    Offline preference optimisation trains on fixed pairs without a reward model. Its known failure modes are drift from
    the starting model and longer answers that a judge rewards for their length; the case measures both next to the
    win rate.
- title: Related Work
  paras:
  - >-
    DPO turns the RLHF objective into a classification loss on pairs [@rafailov2023dpo]; IPO bounds the implied margin
    [@azar2024ipo]; SimPO drops the reference model and normalises by length [@meng2024simpo]; length-controlled win
    rates correct judge preferences for length [@dubois2024lcae].
- title: Method
  paras:
  - >-
    For a pair (x, y_w, y_l): loss = −log σ(β[(log π(y_w|x) − log π_ref(y_w|x)) − (log π(y_l|x) − log π_ref(y_l|x))]),
    with π_ref the starting model, log-probabilities summed over answer tokens in the evaluator's chat template,
    answers cut at 512 tokens. AdamW (lr 5e-5), 8 pairs per step, gradient clipping at 1, one pass over 20,000 pairs.
- title: Design Rationale
  paras:
  - >-
    Low-rank updates limit drift by construction; using the evaluator's template in training avoids a mismatch between
    the pairs and generation.
- title: Scope and Limitations
  paras:
  - >-
    DPO tends to lengthen answers and lowers the likelihood of both answers of a pair; nothing here counters either.
    It has not been run yet.
