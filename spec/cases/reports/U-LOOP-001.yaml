- text: The four-layer budget is split into two prelude layers, one looped core layer and one coda layer instead of four
    distinct layers.
  code: 'model.py: Looped.__init__, PRELUDE, CODA'
- text: The prelude output is injected before every core iteration through a linear adapter initialised near identity.
  code: 'model.py: Looped.forward, adapter'
- text: Each training step uses a loop count drawn uniformly from 1 to 8.
