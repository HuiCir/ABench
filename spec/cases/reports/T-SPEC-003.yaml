changes:
- text: Speculative decoding's prefix acceptance is replaced by a fixed slide of two states per round, with every state
    evaluated twice.
  code: 'sampler.py: WINDOW, ADVANCE, sample'
- text: The window update uses the closed-form affine DDIM recursion instead of ParaDiGMS's cumulative drift sum.
  code: 'sampler.py: coefficients, sample'
- text: Guesses beyond the window are copies of the newest state.
  code: 'sampler.py: sample'
