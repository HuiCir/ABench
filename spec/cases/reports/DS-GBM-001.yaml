changes:
- text: The anchor's single tuned configuration is replaced by an ordered four-setting grid selected on a holdout within
    half of the time budget.
  code: 'model.py: GRID, fit'
- text: Histogram split finding with native missing-value routing instead of the anchor's exact and sparsity-aware split
    search.
  code: 'model.py: _model'
- text: The selected setting is refitted on all rows for 1.25 times its early-stopped number of rounds.
  code: 'model.py: fit (refit)'
