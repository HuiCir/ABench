case: DS-GBM-001
title: 'Holdout-Selected Histogram Boosting: A Budget-Aware Tabular Learner'
abstract: >-
  This submission gives a reference learner for a task in which the evaluator trains the submission itself on
  unseen datasets. It keeps the anchor's model family, regularised gradient-boosted trees [@chen2016xgboost], in the histogram
  form of LightGBM [@ke2017lightgbm], and adds a small budget-aware selection step: four settings of learning rate, leaf
  count and L2 penalty are tried with early stopping on a 20% holdout [@prechelt1998early] while half the time budget
  lasts, and the best one is refitted on all rows. The design leaves ensembling across model families and meta-learned
  portfolios [@erickson2020autogluon;@feurer2022autosklearn2] open for entries.
sections:
- title: Introduction
  paras:
  - On medium-sized tables, tree ensembles remain the model to beat [@grinsztajn2022tree], but their accuracy depends on
    a few hyperparameters whose best values differ between datasets. When the learner is trained by the evaluator on datasets
    it has never seen, those choices must be made by the code from the training data alone and within a time budget.
- title: Related Work
  paras:
  - Gradient boosting fits an additive model of trees by functional gradient descent [@friedman2001gbm]; XGBoost adds
    second-order split gains and L2-regularised leaf values [@chen2016xgboost], and histogram learners bin features once
    to make split finding cheap [@ke2017lightgbm]. Benchmarks on the same suite show that tuned trees outperform neural
    tabular models at this scale [@grinsztajn2022tree].
  - AutoML systems close the remaining gap by searching configurations and ensembling across model families, either with
    Bayesian optimisation and meta-learned warm starts [@feurer2022autosklearn2] or with fixed robust defaults and multi-layer
    stacking [@erickson2020autogluon]. Both assume budgets of minutes to hours per dataset; with one minute of eight cores,
    which of these ideas still pays off is the open question this task poses.
- title: Method
  subsections:
  - title: Learner
    paras:
    - fit() permutes the rows with the given seed and holds out 20%. In a fixed order it fits four HistGradientBoosting
      settings (learning rate 0.1 with 31 leaves; 0.05 with 15 or 63 leaves and L2 penalty 1; 0.03 with 31 leaves, L2
      penalty 10 and 40 rows per leaf), each with internal early stopping (15% validation, patience 30, at most 2,000
      rounds) [@pedregosa2011sklearn]. It stops trying further settings once half of budget_seconds has passed. The setting
      with the lowest holdout loss (log-loss or squared error) is refitted on all rows for 1.25 times its early-stopped
      number of rounds.
    algorithm_caption: fit(x, y, task, budget, seed)
    algorithm:
    - split rows into train (80%) and holdout (20%) with seed
    - 'for each setting s in GRID while elapsed < budget / 2: fit s with early stopping on train; record holdout loss and rounds'
    - refit the best setting on all rows for 1.25 × its rounds; return it
  - title: Complexity
    paras:
    - With N rows, F features, B bins, M rounds and L leaves, binning costs O(NF log N) and each round O(NF + LFB); at
      most five fits are made per dataset, so the cost is about five times one early-stopped fit.
- title: Design Rationale
  paras:
  - A short ordered grid with early stopping adapts the two most sensitive choices, step size and tree size, at a cost that
    fits the per-dataset budget even for 10,000 rows and hundreds of features. Refitting on all rows recovers the data
    spent on the holdout, and scaling the round count by 1.25 accounts for the larger training set.
- title: Scope and Limitations
  paras:
  - One model family cannot use the complementary errors of linear or neural models; the grid is not adapted to dataset
    size or feature count, and half of the time budget is deliberately left unused.
