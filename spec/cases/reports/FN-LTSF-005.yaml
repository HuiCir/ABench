case: FN-LTSF-005
title: 'A Channel-Shared Ridge Forecaster with a Lookback Search'
abstract: >-
  This submission is the reference family of the case with one addition: the lookback window is searched. A
  channel-shared linear map from the last L standardised steps, minus the last observed value, to the next 720 steps
  is fitted in closed form by ridge regression, as in the linear baselines of DLinear and RLinear [@zeng2023dlinear;
  @li2023rlinear]. For every dataset and horizon the lookback (96, 192, 336 or 720) and the penalty are chosen on the
  validation rows; the chosen forecaster is refitted on training and validation rows. It needs no GPU and trains in
  about four minutes on eight CPU cores.
sections:
- title: Introduction
  paras:
  - >-
    Long-horizon forecasting benchmarks have repeatedly shown that a tuned linear map is hard to beat
    [@zeng2023dlinear; @li2023rlinear]; the case makes that map the yardstick. This submission tests whether the
    simplest knob, the lookback, helps the yardstick itself.
- title: Related Work
  paras:
  - >-
    The ETT series come from Informer [@zhou2021informer] and the hourly electricity panel from LSTNet
    [@lai2018lstnet]. DLinear decomposes the input into trend and remainder and maps each linearly
    [@zeng2023dlinear]; RLinear adds reversible normalisation [@li2023rlinear]; PatchTST feeds patches of each channel
    to a Transformer [@nie2023patchtst].
- title: Method
  paras:
  - >-
    Rows are (window, channel) pairs: inputs are the last L values minus the last one plus a bias, targets the next
    720 values minus the last one. A multi-output ridge solves each output column separately, so one solve gives all
    horizons. Training origins are thinned so that rows times channels stay within 300,000. The penalty grid is
    10^-4 to 1 per training row.
- title: Design Rationale
  paras:
  - >-
    A longer lookback carries more seasonal periods but adds parameters; choosing it on the validation rows lets
    each dataset and horizon decide.
- title: Scope and Limitations
  paras:
  - >-
    The forecaster is linear and shared across channels: it cannot model interactions between channels or
    nonlinear regimes. On the frozen test windows the lookback search did not improve on the fixed-lookback reference
    (calibration check: ratio 0.999), which suggests that the validation rows are too few to choose it reliably.
