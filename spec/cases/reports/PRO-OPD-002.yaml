changes:
- text: A filtered SFT warm start precedes on-policy distillation, so that a base model can be the student.
  code: 'train.py: main'
- text: The reverse KL is estimated per sampled token and used as a fixed advantage instead of GKD's full-distribution divergence.
  code: 'train.py: main'
