case: IC-RES-002
title: 'ResNets with Averaging Shortcuts and Zero-Initialised Residual Branches'
abstract: >-
  This submission keeps the anchor's ResNet-18 and ResNet-50 [@he2016resnet] at the two budgets and applies two tricks
  that cost no compute: downsampling shortcuts that average 2 × 2 pixels before a stride-1 projection (ResNet-D) and
  residual branches whose last batch-normalisation scale starts at zero, so that every block starts as the identity
  [@he2019bag; @goyal2017imagenet]. The deep stem of ResNet-C was left out because it would exceed the small budget at
  128 pixels. It has not been run yet: it needs PyTorch and a GPU, which were not available where the case was built.
sections:
- title: Introduction
  paras:
  - >-
    With ten classes and fewer than ten thousand training images, a backbone's inductive biases and its behaviour early
    in training matter as much as its capacity. The case fixes the recipe and two compute budgets, so the backbone is
    the only variable.
- title: Related Work
  paras:
  - >-
    Residual networks made deep convolutional networks trainable [@he2016resnet]; a collection of refinements to the
    shortcut, stem and training improved them without extra cost [@he2019bag]; zero-initialised residual branches
    stabilise large-batch training [@goyal2017imagenet]. Later designs changed the blocks themselves: inverted
    residuals [@sandler2018mobilenetv2], compound scaling [@tan2019efficientnet] and the modernised ConvNeXt design
    [@liu2022convnext].
- title: Method
  paras:
  - >-
    The stages, widths and depths are ResNet-18 (basic blocks, 2-2-2-2) and ResNet-50 (bottlenecks, 3-4-6-3) with the
    7 × 7 stem and max pooling. Every shortcut that changes resolution is average pooling with a 2 × 2 window followed
    by a 1 × 1 convolution and batch normalisation; every residual branch ends in a batch normalisation whose scale is
    initialised to 0. At 128 pixels the variants need 1.18 and 2.67 GFLOPs.
- title: Design Rationale
  paras:
  - >-
    A strided 1 × 1 shortcut discards three quarters of the activations it downsamples; averaging first keeps them at
    the same cost. Identity-initialised blocks make the early network shallow in effect, which helps when 20 epochs
    leave little time to recover from a poor start.
- title: Scope and Limitations
  paras:
  - >-
    The changes are small by design; neither uses the slack between the variants' FLOPs and the budgets, and the
    reference has not been run yet.
