changes:
- text: Training stops at a wall-clock limit (about an eighth of the anchor's steps) instead of 800,000 steps.
  code: 'train.py: main (--max-hours)'
- text: The forward pass runs under bf16 autocast.
  code: 'train.py: main'
- text: Sampling uses deterministic DDIM with x₀ clipping on 25 or 100 steps instead of the anchor's 1,000-step ancestral sampler.
  code: 'model.py: generate'
