case: X-SFT-005
title: 'Low-Rank Supervised Fine-Tuning on General Conversations'
abstract: >-
  This submission is the plain parameter-efficient floor: low-rank adapters [@hu2022lora] of rank 16 on every
  attention and MLP projection of SmolLM2-360M [@allal2025smollm2], trained for one epoch on 50,000 of the public
  conversations with the loss on assistant turns only, and merged into the base weights at load time. It trains 8.7
  million numbers, uses the evaluator's chat template, and adds no constraint-specific data, which is the gap entries
  are expected to fill. It has not been run yet: it needs PyTorch and the SmolLM2 weights, which were not available
  where the case was built.
sections:
- title: Introduction
  paras:
  - >-
    Small base models learn the format of a chat from a little supervised data, but precise instructions — exact
    counts, case, output formats — need more than imitation of general conversations. The case scores instruction
    following with verifiable checks [@zhou2023ifeval] and counts the cost in trained parameters and in forgetting.
- title: Related Work
  paras:
  - >-
    LoRA trains low-rank updates of frozen weights [@hu2022lora]; QLoRA does so on a 4-bit quantised base
    [@dettmers2023qlora]; DoRA separates magnitude and direction [@liu2024dora]; IFEval defines verifiable instructions
    [@zhou2023ifeval]; SmolLM2's own post-training mixes conversations with constraint data [@allal2025smollm2].
- title: Method
  paras:
  - >-
    Each conversation is rendered in ChatML; tokens of user turns and role headers are masked from the loss. Updates
    W + 2·BA (rank 16, α = 32, B initialised at zero) on the seven projection types of all 32 layers; AdamW, learning
    rate 2e-4 with cosine decay, batch 16, sequences cut at 1,024 tokens, gradient clipping at 1.
- title: Design Rationale
  paras:
  - >-
    Low-rank updates keep the base weights and therefore limit forgetting; masking user turns focuses the update on
    the assistant's behaviour; merging at load time leaves inference as fast as the base model.
- title: Scope and Limitations
  paras:
  - >-
    No constraint data, no selection of conversations, one epoch; it has not been run yet.
