changes:
- text: Chunks are executed asynchronously with stale actions skipped instead of ACT's synchronous temporal
    ensembling.
  code: 'policy.py: Controller'
- text: A small convolutional encoder and an MLP head replace ACT's ResNet backbones and transformer decoder.
  code: 'src/net.py: ChunkPolicy'
