case: A-NORM-005
title: 'Pre-RMSNorm with Query-Key Normalisation'
abstract: >-
  This submission keeps the anchor's pre-normalisation with RMSNorm [@zhang2019rmsnorm] and adds one change: queries
  and keys are RMS-normalised per head after the rotary embedding, with a learned gain per head dimension. QK
  normalisation bounds the attention logits, whose uncontrolled growth was identified as a source of loss spikes and
  divergence at high learning rates [@dehghani2023vit22b; @wortsman2023proxies]. It adds four gain vectors per layer and
  no matrix multiplication. It has not been run yet: it needs PyTorch and a GPU, which were not available where the case
  was built.
sections:
- title: Introduction
  paras:
  - >-
    Where a transformer normalises its activations decides how far the learning rate can be pushed before training
    becomes unstable. Pre-normalisation made deep transformers trainable without warm-up tricks [@xiong2020prenorm], and
    RMSNorm made it cheaper [@zhang2019rmsnorm]; at learning rates a few times above the usual one, small models still
    show loss spikes that trace back to attention.
- title: Related Work
  paras:
  - >-
    Post-normalisation, the original layout [@vaswani2017attention], needs careful warm-up; pre-normalisation removes that
    need [@xiong2020prenorm]. Residual scaling such as DeepNorm stabilises very deep post-norm models
    [@wang2022deepnet]; ReZero replaces normalisation by a gated residual initialised at zero [@bachlechner2021rezero].
    Normalising queries and keys was introduced for attention [@henry2020qknorm] and became the remedy for attention
    logit growth in large vision transformers [@dehghani2023vit22b]; small-scale proxies reproduce that instability at
    high learning rates and show QK normalisation removes it [@wortsman2023proxies].
- title: Method
  paras:
  - >-
    Each layer computes x ← x + attn(RMSNorm₁(x)) and x ← x + mlp(RMSNorm₂(x)); inside attention, after the rotary
    embedding, q ← g_q ⊙ q / rms(q) and k ← g_k ⊙ k / rms(k) per head, with gains of size head_dim initialised to
    head_dim^(1/4), so that the product of the two gains restores the scale √head_dim that the dot product of two
    unit-RMS vectors lacks. The final RMSNorm before the tied output head is unchanged.
- title: Design Rationale
  paras:
  - >-
    With fixed AdamW and a high peak learning rate, attention logits can grow until the softmax saturates; gradients
    through a saturated softmax vanish for most positions and spike for a few. Normalising queries and keys caps the
    logits by the learned gains, which grow only as fast as the optimiser moves them. The change targets the 4e-3 runs;
    at 1e-3 it should be neutral.
- title: Scope and Limitations
  paras:
  - >-
    It does not address output-logit divergence, which Wortsman et al. counter with a z-loss that this interface does not
    allow; it does not change the residual stream itself; and it has not been run yet.
