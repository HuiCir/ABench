case: X-DATA-007
title: 'Exact and MinHash Deduplication with a Target-Example Classifier Filter'
abstract: >-
  This submission chains the two standard steps of web-data preparation. It removes exact duplicates by normalised-text
  hashes and near-duplicates by MinHash over word 5-shingles with 20 bands of 5 rows [@broder1997resemblance;
  @lee2022dedup]. It then ranks the remaining documents with a logistic regression on hashed word 1-2-grams trained to
  separate the 5,000 target examples from random pool documents, in the spirit of classifier-based quality filters
  [@brown2020gpt3; @penedo2024fineweb], and keeps the best documents, each once, until the token budget is reached. It
  runs on the CPU in the select stage and was run in the build container on a synthetic pool.
sections:
- title: Introduction
  paras:
  - >-
    A fixed model trained on a fixed number of tokens learns more from some documents than from others; duplicated
    text wastes budget, and text far from the target distribution teaches little about it. The case isolates the data
    decision by fixing the model and the recipe.
- title: Related Work
  paras:
  - >-
    Lee et al. show that exact and near-duplicate removal improves language models [@lee2022dedup]; MinHash estimates
    Jaccard similarity of shingle sets [@broder1997resemblance]; GPT-3 and FineWeb-Edu filter with classifiers trained
    on reference text [@brown2020gpt3; @penedo2024fineweb]; data-constrained scaling quantifies the value of repetition
    [@muennighoff2023scaling].
- title: Method
  paras:
  - >-
    Normalise (lower-case, strip punctuation, collapse spaces) and hash; keep the first of each hash. Compute 100
    MinHash values per document (at most 2,000 shingles sampled per long document), drop a document if any of its 20
    five-row bands collides with a kept document. Train the classifier (C = 1) on the target examples against four
    times as many pool documents, score every remaining document and take them in descending score until the
    cumulative tokens exceed the budget.
- title: Design Rationale
  paras:
  - >-
    Taking each kept document once avoids repetition entirely; the classifier ties the filter to the target
    distribution using only the provided examples.
- title: Scope and Limitations
  paras:
  - >-
    No repetition of the best documents, no mixing across dumps, and the classifier's negatives include some good
    documents. The real pool has not been processed yet.
