case: V-3DG-005
title: 'Random Backgrounds and an Anisotropy Penalty for Sparse-View Gaussian Splatting'
abstract: >-
  This submission is plain 3D Gaussian splatting [@kerbl2023gaussian] from a random initialisation with two
  changes for sparse views: a random background colour at every training step, and a penalty on Gaussians whose
  largest scale exceeds ten times their smallest, after the anisotropy regulariser of PhysGaussian [@xie2024physgaussian].
  Both target artefacts that fit the 24 training views but fail elsewhere; neither adds a prior from outside the scene.
sections:
- title: Introduction
  paras:
  - >-
    With 24 views of an unbounded scene, Gaussian splatting overfits: semi-transparent Gaussians imitate the
    background and needle-shaped ones explain single views. Sparse-view methods such as FSGS add densification rules
    and depth priors [@zhu2024fsgs]; this submission tests two cheap regularisers that need no prior.
- title: Related Work
  paras:
  - >-
    3D Gaussian splatting optimises anisotropic Gaussians with a differentiable rasteriser [@kerbl2023gaussian]; FSGS
    grows Gaussians by proximity and uses monocular depth for sparse views [@zhu2024fsgs]; PhysGaussian limits the
    ratio of a Gaussian's scales [@xie2024physgaussian]; Mip-NeRF 360 introduced the scenes [@barron2022mipnerf360].
- title: Method
  paras:
  - >-
    The baseline's 7,000-step schedule, losses and densification are kept. Each step renders against a background
    colour drawn uniformly at random; the loss adds 0.01 times the mean of max(0, s_max / s_min - 10) over Gaussians.
- title: Design Rationale
  paras:
  - >-
    A random background makes any Gaussian that stands in for empty space pay a loss on most steps; bounding
    anisotropy keeps Gaussians from being thin enough to be invisible from all but one viewpoint.
- title: Scope and Limitations
  paras:
  - >-
    Initialisation is still random in a sphere, and unseen regions get no geometric regularisation. Nothing here has
    been run in this build.
