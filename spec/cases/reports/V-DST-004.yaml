changes:
- text: Squared-error distance instead of the anchor's LPIPS, which needs a pretrained network.
  code: 'train.py: main (loss)'
- text: The consistency function is the clipped clean-image estimate of an ε-predicting student on the teacher's discrete
    timesteps, instead of the anchor's skip-connection parametrisation in continuous time.
  code: 'model.py: consistency'
- text: The student is initialised from the teacher and the target network is an EMA with decay 0.999.
  code: 'train.py: main'
