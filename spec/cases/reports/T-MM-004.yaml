case: T-MM-004
title: 'Contrastive Projections over Frozen Self-Supervised Image and Sentence Encoders'
abstract: >-
  This submission aligns two frozen encoders with the anchor's contrastive objective [@radford2021clip]: the
  DINOv2-small class token concatenated with the mean patch token [@oquab2023dinov2], and the mean-pooled tokens of a
  MiniLM sentence encoder [@wang2020minilm], each pass through a trained two-layer projection into a shared 256-d space.
  Both encoders stay fixed, which makes this the locked-image setting of LiT [@zhai2022lit] with the text side locked
  as well. Frozen features are computed once, so training is cheap. It trains 1.7 million numbers and has not been run
  yet: it needs PyTorch and the encoder weights, which were not available where the case was built.
sections:
- title: Introduction
  paras:
  - >-
    Contrastive image-text models learn both encoders from hundreds of millions of pairs. With strong unimodal
    encoders available, the question is how much alignment a small trained interface can add on 110,000 images, and
    whether it captures the composition of captions or only their bag of words.
- title: Related Work
  paras:
  - >-
    CLIP trains both towers with a symmetric InfoNCE loss [@radford2021clip]; LiT locks the image tower and tunes the
    text tower [@zhai2022lit]; DINOv2 provides strong frozen visual features [@oquab2023dinov2]; SugarCrepe shows that
    contrastive models often ignore word order and attribute binding [@hsieh2023sugarcrepe].
- title: Method
  paras:
  - >-
    Image feature: [CLS; mean of patch tokens] of DINOv2-small at 224 px (768-d). Text feature: attention-masked mean of
    MiniLM token states (384-d). Projections: LayerNorm, Linear to 1,024, GELU, Linear to 256, then L2 normalisation.
    Loss: symmetric cross-entropy over a batch of 1,024 image-caption pairs with a learned temperature (capped at 100);
    one random caption per image per epoch; AdamW, 15 epochs.
- title: Design Rationale
  paras:
  - >-
    Concatenating the class token with the mean patch token keeps both the global and the spatially pooled view of the
    image; small projections on frozen features train in minutes, which leaves the budget for better negatives or for
    adapters inside the encoders.
- title: Scope and Limitations
  paras:
  - >-
    Pooled features lose word order and spatial relations, so swapped attributes and relations are the expected failure
    cases; there are no hard negatives. It has not been run yet.
