case: K-FUS-002
title: 'Library Convolutions with One-Pass Triton Epilogues'
abstract: >-
  This submission is the case's floor rather than a contender. For three problems whose operations after the
  convolution are all elementwise — problem 7 (ReLU, LeakyReLU, GELU, sigmoid, bias), 69 (hardswish, ReLU) and 100
  (clamp, division) — it keeps the cuDNN convolution [@chetlur2014cudnn] and runs the whole tail in one Triton pass
  [@tillet2019triton], so the convolution output is read once instead of once per operation; the other 17 problems
  submit their own PyTorch code [@ouyang2025kernelbench]. It has not been run yet: it needs PyTorch, Triton and a GPU,
  which were not available where the case was built.
sections:
- title: Introduction
  paras:
  - >-
    Level 2 of KernelBench chains a heavy operator with cheap ones [@ouyang2025kernelbench]. In eager PyTorch each
    cheap operator re-reads and re-writes the heavy operator's output; fusing them removes that traffic, which is what
    torch.compile does automatically for elementwise tails [@ansel2024pytorch2].
- title: Related Work
  paras:
  - >-
    TorchInductor fuses elementwise and reduction epilogues into generated Triton kernels [@ansel2024pytorch2]; TVM
    fuses operators and searches schedules [@chen2018tvm]; Triton makes hand-written fused kernels short
    [@tillet2019triton]; cuDNN supplies the convolutions [@chetlur2014cudnn].
- title: Method
  paras:
  - >-
    `src/ew.py` holds one Triton kernel with an operation code. For problem 7 it applies ReLU, LeakyReLU (0.01),
    exact GELU through erf, sigmoid and the per-channel bias (channel index = offset ÷ spatial size mod channels); for
    69 relu(x · relu6(x + 3) / 6); for 100 max(x, min) / divisor. The convolution stays in PyTorch with Model's
    parameter names, so the evaluator's weight copy applies.
- title: Design Rationale
  paras:
  - >-
    An elementwise tail after a library convolution is the one fusion that needs no change to the convolution; it
    removes all intermediate tensors of the tail. It only matches what torch.compile already does, so it is a floor.
- title: Scope and Limitations
  paras:
  - >-
    Reductions, normalisations and pooling in the tails, and fusion into the convolution itself, are left to entries;
    neither correctness nor timing has been measured yet.
