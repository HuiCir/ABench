changes:
- text: The potential is a linear model on random Fourier features of inverse distances instead of an equivariant
    message-passing network.
  code: 'ff.py: Model'
- text: A quadratic feature in each standardised inverse distance keeps restoring forces outside the training data.
  code: 'ff.py: Model.features, QUAD'
- text: Weights are fitted to energies and forces jointly by regularised least squares instead of stochastic gradient
    training.
  code: 'ff.py: fit'
