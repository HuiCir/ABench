- text: The update mixes orthogonalised momentum with an Adam-style ratio clipped to [-1, 1], with equal weights, instead
    of Lion's sign of an interpolated momentum.
  code: 'program.yaml'
- text: Candidates are filtered by similarity to known optimizers on a gradient stream before any training.
