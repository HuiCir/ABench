case: X-DISTILL-010
title: 'Mixed Cross-Entropy and Forward-KL Distillation from a 13× Larger Teacher'
abstract: >-
  This submission continues training the pretrained SmolLM2-135M student [@allal2025smollm2] with the anchor's
  objective [@hinton2015distilling]: half the next-token cross-entropy on the data and half the KL divergence from the
  frozen SmolLM2-1.7B teacher's full next-token distribution at temperature 1, over 30 million tokens of the public
  shard. It is a floor: no data selection, no truncated or cached teacher outputs, one schedule. It has not been run
  yet: it needs PyTorch and the SmolLM2 weights, which were not available where the case was built.
sections:
- title: Introduction
  paras:
  - >-
    A small model trained on the same data as a larger one can learn more per token from the larger model's
    distribution than from the one-hot target. With a fixed token budget, the question is which teacher signals and
    which tokens give the student the most.
- title: Related Work
  paras:
  - >-
    Logit distillation matches the teacher's softened distribution [@hinton2015distilling]; DistilBERT combines it
    with the data loss and hidden-state alignment [@sanh2019distilbert]; MiniLLM uses the reverse KL for generative
    models [@gu2024minillm]; MiniPLM refines pre-training data with the teacher [@gu2025miniplm].
- title: Method
  paras:
  - >-
    For each window of 1,024 tokens: L = ½ CE(student, data) + ½ KL(teacher ∥ student) per token, teacher in bf16
    without gradients; AdamW (β = 0.9, 0.95, weight decay 0.1), learning rate 3e-4 with 200 warm-up steps and cosine
    decay to 10%, 32 windows per step, gradient clipping at 1, about 915 steps.
- title: Design Rationale
  paras:
  - >-
    Starting from the pretrained student keeps what it already knows; the data term keeps the student calibrated where
    the teacher is wrong; the full distribution carries the most information per token.
- title: Scope and Limitations
  paras:
  - >-
    Running the teacher online costs about as much as the student's training itself; the budget could instead be spent
    on more tokens with cached top-k teacher outputs. It has not been run yet.
