case: PRO-SRV-005
title: 'Tensor-Parallel vLLM with Chunked Prefill and Prefix Caching'
abstract: >-
  This submission serves Qwen3-8B with vLLM [@kwon2023vllm]: paged KV cache, continuous batching, chunked prefill
  that mixes prefill chunks of at most 16,384 tokens with decoding steps [@agrawal2024sarathi], prefix caching, and
  tensor parallelism over the four GPUs, behind a small FastAPI front end that speaks the case's protocol. It is the
  configuration most deployments start from.
sections:
- title: Introduction
  paras:
  - >-
    Under a time-per-token SLO, long prefills that stall decoding are the main cause of violations; under a
    time-to-first-token SLO, queueing is. Chunked prefill addresses the first, a large batch and KV capacity the second.
- title: Related Work
  paras:
  - >-
    vLLM manages the KV cache in pages to batch many requests [@kwon2023vllm]; Sarathi-Serve splits prefills into
    chunks scheduled with decodes [@agrawal2024sarathi]; DistServe separates prefill and decode onto different GPUs
    [@zhong2024distserve].
- title: Method
  paras:
  - >-
    One engine with tensor parallelism 4, up to 512 concurrent sequences, 16,384 batched tokens per step, 92% of the
    GPU memory for weights and cache, greedy sampling with ignore_eos; every engine output is streamed as the new
    token ids.
- title: Design Rationale
  paras:
  - >-
    Tensor parallelism gives each request the full memory bandwidth of the node, which keeps time per token low at
    small batches; one engine avoids load imbalance between replicas.
- title: Scope and Limitations
  paras:
  - >-
    Four data-parallel replicas, disaggregated prefill and speculative decoding are not tried. Nothing here has been
    run in this build.
