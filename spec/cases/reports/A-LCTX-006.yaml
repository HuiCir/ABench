case: A-LCTX-006
title: 'YaRN Scaling with Attention Temperature for a Model Trained at 1,024 Tokens'
abstract: >-
  This submission keeps rotary position embedding [@su2021roformer] up to the training length and applies YaRN
  [@peng2023yarn] beyond it: rotary frequencies that turn many times over the training length are kept, slow ones are
  interpolated by the length ratio as in position interpolation [@chen2023pi], with a linear ramp in between, and
  queries and keys are scaled by YaRN's attention temperature. The case's 200-step extension phase at 4,096 tokens
  plays the role of YaRN's short fine-tuning.
sections:
- title: Introduction
  paras:
  - >-
    A model trained at 1,024 tokens sees rotary angles it never saw when it reads 16,384. Interpolation keeps the
    angles in range at the cost of resolution; YaRN interpolates only the dimensions that need it.
- title: Related Work
  paras:
  - >-
    RoPE encodes position by rotating query and key pairs [@su2021roformer]. Position interpolation divides positions
    by the length ratio [@chen2023pi]; YaRN interpolates per frequency band and adds an attention temperature
    [@peng2023yarn]. PG-19 provides book-length documents [@rae2020pg19].
- title: Method
  paras:
  - >-
    For T > 1,024 with s = T / 1,024: r_i = 1,024 theta_i / (2 pi), gamma_i = clamp((r_i - 1) / 31, 0, 1),
    theta_i' = (1 - gamma_i) theta_i / s + gamma_i theta_i; q and k are multiplied by 0.1 ln s + 1.
- title: Design Rationale
  paras:
  - >-
    High-frequency dimensions carry local order and already cover all relative positions within the training length;
    interpolating them would blur local syntax. Low-frequency dimensions are the ones that leave their training range.
- title: Scope and Limitations
  paras:
  - >-
    No learned parameters, the ramp bounds are YaRN's defaults for much larger models, and the temperature is not
    tuned for a 32M model. It has not been run here.
