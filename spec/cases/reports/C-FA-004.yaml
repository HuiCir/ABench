changes:
- text: The anchor's fused tiles are replaced by blocks of separate PyTorch matrix products over all heads at once.
  code: 'kernel.py: _Attention.forward, _Attention.backward'
- text: The block length is derived from the size of q so that one block of fp32 scores never exceeds it.
  code: 'kernel.py: _block'
- text: dK and dV are accumulated in fp32 across query blocks and cast to bf16 once.
  code: 'kernel.py: _Attention.backward'
