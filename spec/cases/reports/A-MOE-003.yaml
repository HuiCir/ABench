case: A-MOE-003
title: 'Fine-Grained Experts with Auxiliary-Loss-Free Load Balancing'
abstract: >-
  This submission replaces the baseline's top-2 of 8 experts with 16 experts of half the width and top-4 routing, which
  keeps total and active parameters unchanged while multiplying the expert combinations available to a token
  [@dai2024deepseekmoe]. Load is balanced without an auxiliary loss: a per-expert bias steers only the top-k selection
  and is moved against each expert's load deviation after every training step [@wang2024lossfree]. Router scores are
  sigmoids normalised over the selected experts. It has not been run yet: it needs PyTorch and a GPU, which were not
  available where the case was built.
sections:
- title: Introduction
  paras:
  - >-
    Sparse mixture-of-experts layers add parameters without adding compute per token, but their quality depends on the
    granularity of the experts and on how load balance is enforced. A balancing loss that is too strong degrades the
    language-modelling objective; one that is too weak leaves experts idle.
- title: Related Work
  paras:
  - >-
    Sparsely gated experts with top-k routing were introduced by Shazeer et al. [@shazeer2017moe]; the anchor
    simplified routing to one expert and introduced the load-balancing loss used by most later work
    [@fedus2022switch]. Expert choice routes tokens to experts by expert-side selection, which is not causal in a
    decoder [@zhou2022expertchoice]. DeepSeekMoE splits experts into finer ones and adds shared experts
    [@dai2024deepseekmoe]; loss-free balancing replaces the auxiliary loss by a selection bias [@wang2024lossfree].
- title: Method
  paras:
  - >-
    For a token h, s = σ(W_r h) gives 16 scores; the selection uses s + b and takes the top 4, the weights are the
    selected s renormalised to sum to one, and the output is the weighted sum of the selected SwiGLU experts of width
    512. After each training forward pass, b_e ← b_e + 10⁻³ · sign(mean load − load_e). In evaluation mode b is fixed,
    so routing depends only on the token's hidden state.
  algorithm_caption: One layer, training mode
  algorithm:
  - s ← sigmoid(W_r h); idx ← top4(s + b); w ← s[idx] / Σ s[idx]
  - y ← Σ_j w_j · expert_{idx_j}(h), each expert run only on its tokens
  - b ← b + 1e-3 · sign(mean(counts) − counts)
- title: Design Rationale
  paras:
  - >-
    Finer experts let the router compose more specialised functions at the same cost; the bias update balances load
    without a gradient term, so the language-modelling gradient is unchanged; and sigmoid scores avoid the competition
    between experts that a softmax over all experts imposes on the gates.
- title: Scope and Limitations
  paras:
  - >-
    Sixteen small experts run as sixteen small matrix multiplications, which lowers throughput relative to eight larger
    ones; the bias rate is not tuned; and the design has not been run yet.
