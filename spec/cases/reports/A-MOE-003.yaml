changes:
- text: Sixteen experts of width 512 with top-4 routing replace eight experts of width 1,024 with top-2 routing, at the
    same total and active parameters.
  code: 'moe.py: N_EXPERTS, FF, K'
- text: Load is balanced by a selection bias updated against each expert's load deviation instead of an auxiliary loss.
  code: 'moe.py: FineGrainedFree.forward'
- text: Router scores are sigmoids normalised over the selected experts instead of a softmax over the selected logits.
  code: 'moe.py: FineGrainedFree.forward'
