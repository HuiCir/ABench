case: U-BYTE-007
title: 'Space Patching in a Local-Global Byte Model'
abstract: >-
  This submission keeps the baseline's local-global byte model and replaces its static 4-byte patches by patches that
  end at spaces, newlines and document boundaries, the space-patching scheme that the anchor uses as a strong
  dynamic baseline [@pagnoni2024blt; @slagle2024spacebyte]. Patch embeddings are means of the local encoder states of
  their bytes, and each byte receives the global state of the patches before its own. Because a word with its
  separator averages about 5.5 bytes, the global transformer runs over fewer positions than with 4-byte patches, so
  the compute stays below the baseline's. It has not been run yet: it needs PyTorch and a GPU, which were not available
  where the case was built.
sections:
- title: Introduction
  paras:
  - >-
    Byte-level models avoid a tokenizer and its brittleness to spelling noise, but running a full transformer on every
    byte is expensive. Grouping bytes into patches puts most computation on patches; the question is where patches
    should end.
- title: Related Work
  paras:
  - >-
    MegaByte splits bytes into fixed patches handled by a global and a local model [@yu2023megabyte]. SpaceByte inserts
    global blocks after space-like bytes [@slagle2024spacebyte]; the anchor ends patches where a small byte model's
    next-byte entropy is high and reports space patching as a strong alternative [@pagnoni2024blt]. Character-level
    models such as ByT5 and CANINE operate on bytes or characters with downsampling [@xue2022byt5; @clark2022canine].
- title: Method
  paras:
  - >-
    A patch starts at byte 0 and after every byte 32, 10 or 0; patch ids are a cumulative sum of the start flags, which
    depend only on the preceding byte. A one-block local encoder with windowed attention produces byte states; their
    mean per patch, mapped to width 384, is the patch embedding. The global transformer (8 blocks) reads a start vector
    followed by the embeddings of patches 0..n−2, so its output at position s summarises the patches before s. Byte j
    of patch s adds that output to the embedding of byte j − 1 and passes through a one-block local decoder.
  algorithm_caption: Forward pass
  algorithm:
  - seg ← cumsum(start flags); h ← encoder(bytes)
  - P ← W · segment_mean(h, seg); g ← global([bos, P_0, …, P_{n−2}])
  - logits_j ← head(decoder(embed(byte_{j−1}) + U g_{seg_j}))
- title: Design Rationale
  paras:
  - >-
    Word boundaries are where the next byte is hardest to predict, so ending patches there spends global computation
    where it matters, the anchor's argument for entropy patching in a rule that needs no extra model. Mean pooling
    handles variable patch lengths without padding inside patches.
- title: Scope and Limitations
  paras:
  - >-
    Text without spaces (URLs, code, some scripts) produces long patches that one global step must summarise; letter
    noise does not move patch boundaries, but deleted spaces merge words; and the model has not been run yet.
