changes:
- text: Training adds half the cross-entropy at one random earlier iteration, so that intermediate answers are usable
    for early exit.
  code: 'train.py: main'
- text: Problems stop when their softmax confidence reaches 0.95 instead of running a fixed number of iterations.
  code: 'model.py: readout'
- text: A budget ledger over the batch keeps the least confident problems iterating while the average budget allows.
  code: 'model.py: init, step, readout'
