case: U-LOOP-002
title: 'A Recurrent-Depth Transformer with Confidence Exits and a Budget Ledger'
abstract: >-
  This submission follows the recurrent-depth design of the anchor [@geiping2025recurrent]: an input embedding, one
  shared transformer layer iterated with the embedded input re-injected at every step, and a readout head, trained with
  random unroll lengths and truncated backpropagation. For the budgeted setting it adds an intermediate-iteration loss so
  that early answers are usable, and a halting rule that stops a problem once its softmax confidence reaches 0.95 while
  a ledger keeps the batch within the average compute budget by stopping the most confident problems first. It has not
  been run yet: it needs PyTorch and a GPU, which were not available where the case was built.
sections:
- title: Introduction
  paras:
  - >-
    A looped model can trade iterations for accuracy at test time, but a fixed number of iterations spends the same on
    every problem. Under an average budget, compute saved on easy problems can be spent on hard ones; the question is
    how to decide, without labels, when a problem is finished.
- title: Related Work
  paras:
  - >-
    Universal transformers share one layer across depth and halt per position with adaptive computation time
    [@dehghani2019universal; @graves2016act]; PonderNet makes halting probabilistic and trains it end to end
    [@banino2021pondernet]. Early-exit networks stop when an intermediate classifier is confident
    [@teerapittayanon2016branchynet; @schuster2022calm]. Recurrent-depth language models iterate a core block on a
    latent state with the input re-injected and show that test-time iterations improve reasoning [@geiping2025recurrent];
    looped transformers generalise algorithmic tasks to longer inputs [@fan2024looped].
  - >-
    The reference keeps the anchor's training recipe and uses the simplest exit rule, so learned halting and
    difficulty prediction remain open for entries.
- title: Method
  subsections:
  - title: Model and training
    paras:
    - >-
      Per task, token and position embeddings and a learned answer token give e; the state starts at h = e and each
      iteration computes h ← Layer(W [h; e]) with one pre-norm transformer layer of width 256. A per-task linear head
      reads the answer token. Training draws, per task, 128 problems of uniform difficulty and an unroll length r
      uniform in 1–24; the first r − 8 iterations run without gradient and the loss is the cross-entropy at iteration r
      plus half the cross-entropy at one random earlier iteration within the gradient window.
  - title: Halting
    paras:
    - >-
      At load time the FLOPs of one iteration and one readout per problem are measured with the evaluator's counter.
      After each iteration, problems whose confidence reaches 0.95 stop; if the remaining budget cannot pay one more
      iteration for every active problem, only the least confident ones that fit continue.
    algorithm_caption: Readout after each iteration
    algorithm:
    - logits ← head(h) for active problems; p ← max softmax
    - active ← active ∧ (p < 0.95)
    - k ← ⌊(budget − spent) / cost per iteration⌋
    - if |active| > k, keep the k least confident active problems
- title: Design Rationale
  paras:
  - >-
    Confidence is a cheap proxy for difficulty that needs no extra parameters; the ledger turns a per-problem rule into
    an allocation that always respects the average budget, so no budget point is lost to overspending. The intermediate
    loss makes the head meaningful at every depth, which the exit rule relies on.
- title: Scope and Limitations
  paras:
  - >-
    Confidence can be high on wrong answers, especially for the two-class reachability task; the threshold is not
    tuned per budget; and the model has not been trained or measured yet.
