case: FN-QA-004
title: 'Nearest-Neighbour Program Prompting with TF-IDF Evidence Retrieval'
abstract: >-
  This submission follows FinQA's retriever-generator split [@chen2021finqa] without training either part. Table
  rows are turned into sentences and ranked together with the report's text by TF-IDF similarity to the question;
  the eight best facts and the four training questions most similar to the question, each with its gold evidence and
  program, form a few-shot prompt [@liu2022makes] from which the frozen model writes one FinQA program, in the spirit
  of program-of-thought prompting [@chen2023pot]. The case's executor computes the answer. On the dev split the
  retriever places all gold evidence in its top eight facts for 81.7% of the questions.
sections:
- title: Introduction
  paras:
  - >-
    FinQA questions need a few arithmetic steps over numbers spread across a table and its surrounding text. A small
    model can rarely do the arithmetic reliably in text; writing a short program and executing it separates finding
    the numbers from computing with them.
- title: Related Work
  paras:
  - >-
    FinQANet retrieves facts with a BERT classifier and generates programs with a sequence decoder
    [@chen2021finqa]. Program-of-thought prompting has the model write code that an interpreter runs
    [@chen2023pot]; choosing in-context examples by similarity to the query improves few-shot prompting
    [@liu2022makes].
- title: Method
  paras:
  - >-
    Facts are table rows rendered as "the <column> of <row> is <value>" and text sentences. Inverse document
    frequencies come from the training questions and the facts of 2,000 training reports. The prompt lists the
    instruction, four exemplars (facts, question, program) and the question's top eight facts; decoding is greedy
    with at most 96 new tokens, and the first line is taken as the program.
- title: Design Rationale
  paras:
  - >-
    Nearest-neighbour exemplars show programs of the same shape as the question (a percentage change, a ratio,
    a table average), which a 1.5B model copies more reliably than an abstract description of the language.
- title: Scope and Limitations
  paras:
  - >-
    TF-IDF misses evidence phrased differently from the question (18% of dev questions lack some gold fact in the top
    eight), there is no repair of invalid programs and no self-consistency. The frozen model has not been run here.
