case: B-OPT-004
title: 'LAMB with Square-Root Learning-Rate Scaling as a Large-Batch Reference'
abstract: >-
  This submission reproduces the anchor's layer-wise adaptive optimizer, LAMB [@you2020lamb], as the calibration
  reference for training a small language model on a fixed token budget at three batch sizes. Each weight matrix
  receives an Adam direction [@kingma2015adam] with decoupled weight decay [@loshchilov2019adamw], rescaled by the trust
  ratio between the norms of the parameter and the update, so that every layer moves by a set fraction of its size.
  The peak learning rate grows with the square root of the batch size. Rules for adapting the schedule or the
  trust ratio to the noise scale of the gradient [@mccandlish2018empirical] are left to entries.
sections:
- title: Introduction
  paras:
  - >-
    For a fixed number of training tokens, larger batches mean fewer sequential steps, but below the critical batch
    size each step makes less progress per token [@mccandlish2018empirical]. An optimizer for large batches must keep
    the loss reached per token close to that of small batches while taking larger steps.
- title: Related Work
  paras:
  - >-
    Linear scaling of the learning rate with warm-up keeps SGD accurate up to moderately large batches
    [@goyal2017accurate]. LARS normalises each layer's step by the ratio of its weight norm to its gradient norm
    [@you2017lars], and LAMB applies the same trust ratio to the Adam direction [@you2020lamb]. The gradient noise scale
    predicts the batch size beyond which these gains vanish [@mccandlish2018empirical].
  - >-
    Trust ratios fix the relative step size per layer but not how it should change as steps become fewer and less
    noisy; that coupling between batch size, schedule and per-layer step is the gap left open.
- title: Method
  subsections:
  - title: Update rule
    paras:
    - >-
      For each parameter tensor the rule keeps Adam's first and second moments (β₁ = 0.9, β₂ = 0.99, ε = 1e-6) with bias
      correction. For a matrix the direction u = m̂ / (√v̂ + ε) + 0.1 · p is scaled by min(‖p‖ / ‖u‖, 10); vector
      parameters use m̂ / (√v̂ + ε) without weight decay or trust ratio. The declared peak learning rate 0.002 is
      multiplied by (B / 32)^0.5 for a batch of B sequences, and the framework applies warm-up and cosine decay.
    algorithm_caption: Update of one matrix parameter
    algorithm:
    - m ← β₁ m + (1 − β₁) g; v ← β₂ v + (1 − β₂) g²; bias-correct to m̂, v̂
    - u ← m̂ / (√v̂ + ε) + wd · p
    - Δ ← −lr · min(‖p‖ / ‖u‖, 10) · u
  - title: Complexity
    paras:
    - >-
      Two state tensors per parameter (2x the parameter count) and two norms per tensor per step, on top of Adam's
      element-wise cost.
- title: Design Rationale
  paras:
  - >-
    The trust ratio removes the dependence of the step size on the scale of each layer's gradient, which is what
    otherwise forces the learning rate down as the batch grows; square-root scaling follows the anchor's recipe for
    Adam-type updates.
- title: Scope and Limitations
  paras:
  - >-
    The scaling exponent and warm-up fraction are fixed rather than derived from the batch size or the gradient noise,
    and at 512 sequences the 187 optimizer steps leave little room for warm-up.
