changes:
- text: The trust ratio is capped at 10 and not applied to vector parameters, which use the plain Adam direction.
  code: 'optimizer.py: LAMB.update'
- text: Square-root scaling of the peak learning rate from a base batch of 32 sequences, declared in hparam_space.yaml.
  code: 'hparam_space.yaml: lr_batch_exponent'
- text: The anchor's polynomial decay is replaced by the framework's warm-up and cosine schedule.
  code: 'hparam_space.yaml: owns_schedule'
