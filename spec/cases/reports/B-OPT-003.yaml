- text: The anchor's left and right Kronecker preconditioners are replaced by row and column means of the squared
    gradient, which fit the 1x cap.
  code: 'optimizer.py: Adafactor.update'
- text: No first moment; updates are clipped to unit RMS instead.
  code: 'optimizer.py: Adafactor.update (clip)'
- text: Decoupled weight decay on matrices only.
