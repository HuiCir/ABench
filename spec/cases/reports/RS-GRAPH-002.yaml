changes:
- text: The model is a factorisation trained by implicit alternating least squares instead of LightGCN's graph
    propagation trained with BPR.
  code: 'train.py: solve_side, main'
- text: The regulariser is scaled by the number of observed plus implicitly weighted entries of each row.
  code: 'train.py: solve_side'
- text: Recommendations score every item by the factor inner product and remove the user's training items.
  code: 'model.py: recommend'
