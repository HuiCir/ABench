case: V-BB-006
title: 'Vision Transformers with a Convolutional Stem and Average Pooling for Small Data'
abstract: >-
  This submission keeps the anchor's Vision Transformer [@dosovitskiy2021vit] at the ViT-Ti and ViT-S sizes and makes two
  changes known to help when data is scarce: the 16 × 16 patchify layer is replaced by a stem of four stride-2 3 × 3
  convolutions [@xiao2021early], and the class token and learned position embeddings are replaced by global average
  pooling and fixed 2-D sine-cosine embeddings [@beyer2022better]. The large variant drops one of its twelve blocks to
  stay within its budget. It has not been run yet: it needs PyTorch and a GPU, which were not available where the case
  was built.
sections:
- title: Introduction
  paras:
  - >-
    Vision transformers trained from scratch on ten thousand images fall well behind convolutional networks, because
    they must learn locality and translation equivariance from data. With the recipe fixed, the backbone has to supply
    those priors without exceeding its compute budget.
- title: Related Work
  paras:
  - >-
    The anchor showed that a plain transformer over image patches matches convolutional networks with large-scale
    pre-training [@dosovitskiy2021vit]; DeiT trained it on ImageNet alone with strong augmentation and distillation
    [@touvron2021deit]. A convolutional stem improves optimisation stability and accuracy at equal compute
    [@xiao2021early]; simple baselines with average pooling and fixed position embeddings train better in short
    schedules [@beyer2022better]; small-data studies add locality to attention or shift tokens [@lee2021small].
- title: Method
  paras:
  - >-
    The stem has four 3 × 3 convolutions with stride 2 and widths d/8, d/4, d/2 and d, each with batch normalisation and
    ReLU, followed by a 1 × 1 convolution, giving a 10 × 10 grid of tokens at 160 pixels. Fixed sine-cosine embeddings of
    the two grid coordinates are added. The blocks are the baseline's pre-norm blocks (12 for the small variant with
    width 192, 11 for the large one with width 384); the head reads the mean of the final tokens.
- title: Design Rationale
  paras:
  - >-
    Overlapping small convolutions give the early representation the locality that a single linear patch projection
    lacks, at a cost of about 0.1 GFLOPs; average pooling uses every token for the classification and removes a
    parameter that has to be learned from few images; fixed position embeddings remove another.
- title: Scope and Limitations
  paras:
  - >-
    The changes do not touch the attention itself; dropping a block in the large variant trades depth for the stem; and
    the reference has not been run yet.
