case: U-DLM-005
title: 'Confidence-Ordered Unmasking with a Cosine Schedule for MDLM'
abstract: >-
  This sampler replaces MDLM's ancestral sampling [@sahoo2024mdlm], which unmasks random positions, with the
  confidence ordering of MaskGIT [@chang2022maskgit] and LLaDA's low-confidence remasking [@nie2025llada]: at every
  step it samples all masked positions, commits the most probable draws, as many as a cosine schedule prescribes,
  and leaves the rest masked. Sampling at temperature 1 keeps the diversity that greedy decoding would lose, which
  matters because low-entropy text can game generative perplexity [@zheng2024masked].
sections:
- title: Introduction
  paras:
  - >-
    A masked diffusion model needs many evaluations when it unmasks positions at random, because early draws ignore
    each other. Committing confident tokens first lets later steps condition on them.
- title: Related Work
  paras:
  - >-
    MDLM trains a time-agnostic denoiser with a simplified bound and samples ancestrally [@sahoo2024mdlm]. MaskGIT
    unmasks by confidence with a cosine schedule [@chang2022maskgit]; LLaDA remasks low-confidence predictions
    [@nie2025llada]. Generative perplexity rewards low-entropy samples, and reduced-precision categorical sampling
    lowers entropy unnoticed [@zheng2024masked].
- title: Method
  paras:
  - >-
    With n masked positions at the start and K evaluations, after step k round(n cos(pi/2 (k+1)/K)) positions
    stay masked. At each step a token is drawn at every masked position from the denoiser's distribution; the draws
    with the highest probability are committed, up to the schedule.
- title: Design Rationale
  paras:
  - >-
    The cosine schedule commits few tokens early, when the denoiser is least certain, and many late; ordering by
    confidence puts the evaluations where they reduce uncertainty most.
- title: Scope and Limitations
  paras:
  - >-
    No remasking of committed tokens, no caching between steps, one schedule for all budgets. It has not been run
    here.
