        revision: 889765ea1f903759787add96995d81171b632d0c
        license: "MIT on the token repository; the underlying FineWeb text is ODC-BY"
        verified: "2026-10-19 (PRO-SPD-004): revision, licence and file list from the Hugging Face API"
  submission:
    kind: code_plus_checkpoint
    entry: model.py
    required_files: [train.py]
    checkpoint_dir: checkpoint
    checkpoint_max_bytes: 10737418240
    allowed_top_level: [README.md, model.py, train.py, src, checkpoint, report, references.yaml]
    code_suffixes: [.py, .sh, .yaml, .yml, .json, .toml, .md, .txt]
    code_max_bytes: 1000000
    max_bytes: 10738418240
  judge:
    device: cuda
    reference_hardware: "one node with 4 × H100 80GB SXM (NVLink); driver, CUDA, NCCL and torch versions frozen at activation"
    seeds: [0]
    code_audit: "the operator inspects model.py for special handling of the evaluation or of the FLOPs count"

