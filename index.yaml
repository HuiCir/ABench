# ABench v2026.07: track and case index
# Machine-readable catalog: why each track matters, its quota and risks, and each case's anchor, type, subset and status.
# Many arXiv IDs were compiled from memory; entries with verify: true must be checked before freezing to confirm the first-release date precedes the cutoff.

version: v2026.07
cutoff: "2026-07-01"

legend:
  types:
    T1: Paradigm-founding
    T2: Plug-in component
    T3: Optimizer and training method
    T4: Sparse and conditional computation
    T5: Sequence-mixer alternative
    T6: Efficiency and systems algorithm
    T7: Analysis and negative results
    TX: Cross-domain transfer
  subsets:
    calibration: "Calibration set: mature anchors, used to backtest the scoring function"
    main: "Main set: retrieve → synthesize → design, three-dimensional scoring"
    primitive: "Primitive-search set: program search from symbolic primitives (local discovery is not limited to this subset; see discovery_policy)"
    stress: "Stress/counterfactual: changed budget, data or hardware constraints"
  standard: "standard: true marks the reference case of its track, built to task statement standard v2.1 (spec/standard_cases/): judged by a frozen stage pipeline, data frozen by the operator from verified sources"
  status:
    built: "Built and run end to end"
    spec: "Task card finalized, awaiting construction"
    scaffold: "Bench skeleton built; real resources, reference runs and calibration pending"
    planned: "Scheduled; anchor to be verified"
  budget_tiers:               # Resource tiers. Reference card: one 24GB GPU (RTX 4090 class); see spec/compute_budget.md
    low: "Development ≤ 2 GPU-h (or CPU only) · per verification ≤ 0.5 · reference precompute ≤ 10"
    medium: "Development ≤ 4 GPU-h · per verification ≤ 2 · reference precompute ≤ 30"
    high: "Development ≤ 8 GPU-h · per verification ≤ 6 · reference precompute ≤ 80 (hard cap of the Budget edition)"
    pro: "4 × H100, 24 h wall clock (96 H100-h) · per verification ≤ 16 H100-h · reference precompute ≤ 200 H100-h (Pro Set only)"
  difficulty:                 # Difficulty level, independent of the resource tier (a judgment task may be low on resources and medium in difficulty)
    low: "Entry level and calibration: mature anchor, clear strong baseline; a strong agent should score close to full marks"
    medium: "Main evaluation on mature anchors and T7 judgment tasks: requires retrieval, synthesis and beating tuned existing methods"
    high: "Frontier anchors, non-mainstream paradigms, primitive search, stress/counterfactual, cross-domain transfer and the Pro Set: thin neighborhood or tight constraints, and existing methods are already strong"
  proxies:
    MICRO: "Micro-scale training (three sizes, about 7M / 17M / 42M)"
    SYN: "Synthetic mechanism probes"
    SURG: "Surgery on a small pretrained model + short continued training"
    FROZEN: "Frozen backbone + lightweight head"
    INFER: "Inference only, fixed weights"
    STREAM: "Fixed-stream component test"
    SUBSET: "Subtasks / fewer folds / fewer epochs / lower resolution"
    JUDGE: "Judgment task"
    EVAL: "Pro: evaluate the delivered checkpoint or system on the hidden set"
    AUDIT: "Pro: hash chain + 1-hour sampled resume-and-reproduce"
    RERUN: "Pro: the benchmark reruns the short task in full twice"
  priority:
    P0: "v1 first batch: cheap to verify, clean interface"
    P1: "v1 second batch"
    P2: "v1 last batch or v2"
  groups:
    method: "Method tracks: general architecture ability, split by technical direction"
    frontier: "Frontier exploration: non-mainstream paradigms with innovation potential; thin neighborhood, high ceiling"
    domain: "Professional domains: architecture ability applied to scientific and industrial problems with domain-standard metrics"
    pro: "Pro Set: compute-heavy tasks the industry depends on, 4 × H100 and 24 h wall clock, separate leaderboard"
    entry: "Classic ML entry level: data science, image/text classification, GNN, recommendation and similar classic problems; cheap, with clear strong baselines; used as a difficulty ladder and for calibration"

# Special rules for the frontier tracks
frontier_rules:
  objective: "Architecture, optimizer, quantization, compilation, KV cache, sampler and data-recipe tasks default to a Pareto front; the quality floor and reference point are kept, but single-point SOTA is not the only pass condition"
  sota_reference: "Still report the in-paradigm reference envelope and the gap to a mainstream Transformer at equal compute; only gate/judge tasks or tasks with a unique correct answer keep a single-point threshold"
  neighborhood: "Thin neighborhood, so retrieval requirements are relaxed; the weight of mechanism divergence in scoring is raised"
  t7: "Every frontier direction gets at least one T7 that tests whether popular claims hold against strong baselines at equal compute"

# Shared rules for the Pro Set (see spec/pro_set.md)
pro_rules:
  - "Hardware: one node with 4 × H100 80GB; the 24 h wall clock covers development and final training; network isolated, with only allowlisted HF and pip mirrors open"
  - "Verification does not retrain: evaluate the delivered artifacts + the log and checkpoint hash chain written by the harness + a 1-hour resume from one randomly chosen registered point; short tasks are rerun in full by the benchmark"
  - "The reference pool holds only 1–2 strong industry recipes, run under the same 4 × H100 × 24 h; a submission leads only if it exceeds the 2σ noise floor"
  - "Engineering metrics (MFU, throughput, goodput, number of interruptions) are reported separately; under a 24 h constraint hardware utilization translates directly into results"
  - "Each Pro case is paired with a corresponding Budget case to test the fidelity of the micro-scale proxy"

# Shared rules for the entry level
entry_rules:
  - "Role: the bottom of the difficulty ladder. Weak agents generally score 0 on the main set, and the entry level provides a separable signal; a strong agent should score close to full marks here, otherwise it has gaps in the basics"
  - "Separate leaderboard, not combined with the main set; difficulty weights are given separately in the summary report"
  - "Strong baselines are mandatory: tuned GBDT, airbench-level CIFAR training, fastText and small BERT, GCN/GraphSAGE, matrix factorization and the like. The classic lesson in these areas is that simple baselines often win"
  - "Anti-memorization: public sets such as CIFAR, IMDB and MovieLens are heavily memorized; hidden tests use newly collected or distribution-shifted versions (for example CIFAR-10.1 or data produced after the cutoff)"
  - "Anti-gaming: recommendation uses full-ranking metrics rather than sampled metrics; GNNs use fixed splits and multiple random seeds; tabular tasks use normalized ranks over multiple datasets"
  - "The same three-dimensional scoring and local-discovery rules apply; most resource tiers are low"

# Shared rules for the professional-domain tracks (in addition to the four admission questions)
domain_rules:
  - "Fifth question, compliance: data licenses are clear; medical data uses only public de-identified sets, and no conclusion is a clinical claim"
  - "Domain-standard metrics: use the evaluation metrics and splits accepted in the field rather than custom ones"
  - "Leak-proof splits: finance forward in time, medicine by patient, proteins by family, physics by unseen parameters, law by decision date"
  - "Post-cutoff data is a natural holdout: market data and new decisions produced after 2026-07 cannot have been memorized"
  - "The reference pool needs review by domain experts and must include strong baselines accepted in the field (such as nnU-Net and DLinear)"

subset_targets: {calibration: 0.30, main: 0.60, primitive: 0.10}

# Reduced-scale verification (see spec/compute_budget.md)
compute_policy:
  principle: "An agent needs repeated trial and error, so no case trains at the paper's full or large scale; every case is verified within a fixed budget cap using a proxy whose fidelity has been checked"
  reference_card: "One 24GB GPU (RTX 4090 class); all wall-clock metrics are measured on the reference card"
  objective_modes: "Architecture/training/inference efficiency/data recipes prefer pareto; hard conservation thresholds, T7 judgment tasks and tasks with a unique correct answer use gate or judge"
  pareto_axes: [quality, throughput, wall_clock, peak_memory, compute_cost, stability]
  fidelity_gate: "Before a track goes live, reproduce the ranking of ≥ 5 existing large-scale conclusion pairs on the proxy ladder: agreement ≥ 80% goes live, 60–80% is marked low fidelity, < 60% becomes a judgment task or is postponed"
  outer_validation: "Each version scales up only the top 3 submissions of each case by 10× for review; unscored, used only to update fidelity statistics"

# Definition of discovery (see spec/discovery.md)
discovery_policy:
  definition: "Discovery is a scoring layer that runs through all design tasks, not a subset: diagnose a concrete problem of the model, bring in a known result from another field or earlier research, and build it into an effective local module. The building block need not be original, as long as this use did not appear in the ML literature before the cutoff, its provenance is correct, and an ablation shows it works"
  exemplar: "DeepSeek mHC (arXiv 2512.24880): the residual mixing matrix of Hyper-Connections breaks the identity mapping, so Sinkhorn-Knopp (1967) is introduced to project it onto doubly stochastic matrices"
  scoring: "x = effectiveness (ablation) × application novelty (new 1 / transfer across problems 0.5 / already in ML 0) × provenance correctness × (0.5 + 0.5·provenance distance); X = 1 − Π(1 − x); the overall score is multiplied by (1 + 0.25·X)"
  weighting: "Venue tier and citation percentile of cross-field sources are assessed within their own field, not ranked together with ML papers"
  hooks_note: "The 'potential provenance directions' of each track are for reviewers only and are not given to the agent"

tracks:
  - id: A
    group: method
    name: LLM architecture
    priority: P1
    v1_quota: "6–8"
    verify_cost: medium
    why_focus: "Linear/hybrid attention, MoE and KV structure are the main line of current architecture evolution, with clear quality–throughput trade-offs that suit probe-based assessment of judgment"
    discovery_hooks: "Control theory and state space (Kalman filtering), numerical ODE discretization, associative memory (Hopfield)"
    risks: ["Scale mismatch: the advantages of hybrid attention and MoE may not show up in small proxies; verify at two or three scales", "Hotspot bias: keep quota for colder directions"]
    anti_gaming: ["Fixed FLOPs and parameters", "Long-context retrieval probes", "Throughput measured on fixed hardware"]
    cases:
      - {id: A-HYB-001, verify_plan: {proxy: [SYN, MICRO], dev: 8, verify: 5, ref: 70, risk: [scale_mismatch], plan: "Synthetic probes such as MQAR recall + μ1–μ3 language modeling, training context ≤ 4k; the throughput–context curve is inference only, measured up to 16k"}, difficulty: medium, anchor: "Mamba", arxiv: "2312.00752", type: T5, subset: main, age: mature, budget: high, status: scaffold, verify: true, path: cases/A-HYB-001,
         task: "Design a sequence mixer or a hybrid layer layout that keeps both language-modeling loss and retrieval ability at fixed FLOPs", metrics: "Loss at fixed FLOPs; long-context retrieval probes; throughput–context curve"}
      - {id: A-LIN-002, standard: true, verify_plan: {proxy: [SYN, MICRO], dev: 8, verify: 5, ref: 60, risk: [scale_mismatch], plan: "Shares probes and ladder with A-HYB-001; only the state-update rule of linear attention is replaced"}, difficulty: medium, anchor: "Gated Linear Attention", arxiv: "2312.06635", type: T5, subset: main, age: mature, budget: high, status: scaffold, verify: true, path: cases/A-LIN-002,
         task: "Improve the state-update rule of linear attention (decay, delta rule, etc.)", metrics: "MQAR recall on a longer held-out grid; causality and sub-quadratic scaling; throughput vs GLA"}
      - {id: A-MOE-003, verify_plan: {proxy: [MICRO], dev: 8, verify: 6, ref: 60, risk: [variance, scale_mismatch], plan: "Active parameters at μ2 scale, 8 experts, 3 seeds; load balance and expert utilization as constraint metrics"}, difficulty: medium, anchor: "Switch Transformer", arxiv: "2101.03961", type: T4, subset: main, age: mature, budget: high, status: scaffold, verify: true, path: cases/A-MOE-003,
         task: "Allocate expert capacity and routing under fixed active and total parameters", metrics: "Loss; load balance; token throughput"}
      - {id: A-KV-004, verify_plan: {proxy: [SURG, SYN], dev: 4, verify: 2, ref: 20, risk: [], plan: "Replace attention in SmolLM2-135M with the candidate KV structure and continue training for 30M tokens; KV-byte and length-extrapolation probes"}, difficulty: medium, anchor: "GQA", arxiv: "2305.13245", type: T2, subset: main, age: mature, budget: medium, status: scaffold, verify: true, path: cases/A-KV-004,
