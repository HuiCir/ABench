  - id: K
    group: method
    name: Systems and kernels
    priority: P0
    v1_quota: "4–6"
    verify_cost: very low
    why_focus: "Fastest and most objective evaluation; the lessons of KernelBench-Verified (weak baselines, narrow test distributions, an identity function scoring 374×) make it the testbed for the bench-wide anti-gaming template"
    discovery_hooks: "Polyhedral compiler models, cache-oblivious algorithms, communication-avoiding linear algebra"
    risks: ["Speedups vary widely across hardware; hardware must be fixed", "Falling back to library functions"]
